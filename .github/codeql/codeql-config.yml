# CodeQL configuration for developer.sailpoint.com
#
# Referenced by .github/workflows/codeql.yml.

name: "developer.sailpoint.com CodeQL config"

paths-ignore:
  # Redocly API reference bundles (static/redoc/*.html). These are generated by
  # scripts/generate-legacy-api-docs.sh, which inlines the entire minified
  # `redoc` npm bundle into each HTML file. CodeQL extracts that vendored
  # JavaScript and flags patterns inside Redoc itself — e.g. "Double escaping
  # or unescaping" in its saveHeading() chain and "Prototype-polluting
  # function" in its bundled polyfills. Both are third-party library code we
  # do not author or patch, so they are excluded rather than dismissed
  # one-by-one every time the bundles are regenerated.
  - static/redoc
