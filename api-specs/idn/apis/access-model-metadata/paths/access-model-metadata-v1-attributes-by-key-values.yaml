get:
  summary: List access model metadata values
  description: Get a list of Access Model Metadata Attribute Values. Supports pagination through limit and offset parameters.
  tags:
  - Access Model Metadata
  operationId: listAccessModelMetadataAttributeValueV1
  security:
  - userAuth:
    - idn:access-model-metadata:read
    - idn:access-model-metadata:manage
  - applicationAuth:
    - idn:access-model-metadata:read
    - idn:access-model-metadata:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  parameters:
  - name: key
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeV1
    schema:
      type: string
    description: Technical name of the Attribute.
    example: iscPrivacy
  - in: query
    name: filters
    schema:
      type: string
    example: name eq "Public"
    required: false
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **value**: *eq, co*


      **name**: *eq, co*


      **status**: *eq*


      **type**: *eq*


      Supported composite operators are *and, or*
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **value, name, status, type**
    example: name,-value
    required: false
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../shared/schemas/attributevaluedto.yaml
          examples:
            Paginated static and adhoc values:
              description: A paginated page of values for an Adhoc-enabled Attribute
              value:
                [
                  {
                    "value": "public",
                    "name": "Public",
                    "status": "active",
                    "type": "static"
                  },
                  {
                    "value": "restricted-42",
                    "name": "Restricted 42",
                    "status": "active",
                    "type": "adhoc"
                  }
                ]
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  summary: Create access model metadata value
  description: |
    Create a new value for an existing Access Model Metadata Attribute.

    The **type** field must be omitted, blank, or *static* (case-insensitive); *adhoc* is not an
    allowed value on this public API and results in a *400* error. Ad-hoc values are created
    dynamically through an internal service-to-service flow when the parent Attribute has *isAdhoc*
    set to *true*, not through this API.
  operationId: createAccessModelMetadataAttributeValueV1
  tags:
  - Access Model Metadata
  security:
  - userAuth:
    - idn:access-model-metadata:create
  - applicationAuth:
    - idn:access-model-metadata:create
  x-sailpoint-userLevels:
  - ORG_ADMIN
  parameters:
  - name: key
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeV1
    schema:
      type: string
    description: Technical name of the Attribute.
    example: iscPrivacy
  requestBody:
    required: true
    description: Attribute value to create
    content:
      application/json:
        schema:
          $ref: ../../shared/schemas/attributevaluedto.yaml
        examples:
          Static value:
            description: Create a static value; type may also be omitted or left blank
            value:
              value: "public"
              name: "Public"
              status: "active"
              type: "static"
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/attributevaluedto.yaml
    '400':
      description: Client Error - Returned if the request body is invalid.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
          examples:
            400.1 Bad request content:
              description: Response when an unsupported type (e.g. "adhoc") is sent to this public API
              value:
                detailCode: 400.1 Bad request content
                trackingId: 1ea1adcb84da4dcb890145e05745774e
                messages:
                  - locale: en-US
                    localeOrigin: DEFAULT
                    text: The request was syntactically correct but its content is semantically invalid.
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
