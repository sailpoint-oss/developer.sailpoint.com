type: object
properties:
  id:
    type: string
    description: ID of the tracker created to record this delete operation.
    example: 2c9180867817ac4d017817c491119a20
  type:
    type: string
    description: The type of object being tracked.
    example: metadata-attribute
  status:
    type: string
    description: The status of the delete operation.
    example: DELETING
  errors:
    type: array
    nullable: true
    description: Any errors encountered while processing the delete operation.
    items:
      type: string
  created:
    type: string
    format: date-time
    description: The time the delete operation was initiated.
    example: '2020-10-08T18:33:52.029Z'
  key:
    type: string
    nullable: true
    description: Technical name of the deleted Attribute.
    example: iscPrivacy
