post:
  operationId: updateAccessProfilesMetadataByFilterV1
  summary: Bulk-update metadata by filter
  tags:
  - Access Profiles
  description: |-
    This API initiates a bulk update of Access Model Metadata for every access profile matching the supplied filter expression.

    The update is processed asynchronously. The response returns the ID of the task performing the update.

    A single access profile cannot be assigned more than 25 metadata values. Adding or replacing custom metadata requires a suite license.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/accessprofilemetadatabulkupdatebyfilterrequest.yaml
        example:
          filters: requestable eq false
          operation: REPLACE
          replaceScope: ATTRIBUTE
          values:
          - attribute: iscFederalClassifications
            values:
            - topSecret
  responses:
    '202':
      description: Returned if the bulk update request was created.
      content:
        application/json:
          schema:
            $ref: ../schemas/accessprofilemetadatabulkupdateresponse.yaml
          examples:
            Update request created successfully:
              value:
                id: 2d82ac17-eb0d-4ba6-9918-dcad6ee0294d
                type: ACCESS_PROFILE
                status: CHUNK_PENDING
                created: '2024-09-16T18:59:06.871594Z'
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
