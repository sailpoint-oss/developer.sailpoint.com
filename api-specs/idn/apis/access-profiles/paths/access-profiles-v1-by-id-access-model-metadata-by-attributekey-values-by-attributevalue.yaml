post:
  operationId: updateAttributeKeyAndValueToAccessProfileV1
  summary: Add metadata to access profile
  tags:
  - Access Profiles
  description: >-
    This API adds a single Access Model Metadata value to an access profile by attribute key and attribute value. A
    single access profile cannot be assigned more than 25 metadata values. Adding custom metadata requires a suite
    license.
  parameters:
  - name: id
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessProfilesV1
    schema:
      type: string
    description: The access profile's ID.
    example: c24359c389374d0fb8585698a2189e3d
  - name: attributeKey
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeV1
    schema:
      type: string
    description: Technical name of the Attribute.
    example: iscPrivacy
  - name: attributeValue
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeValueV1
    schema:
      type: string
    description: Technical name of the Attribute Value.
    example: public
  responses:
    '200':
      description: Responds with the access profile as updated.
      content:
        application/json:
          schema:
            $ref: ../schemas/accessprofile.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
delete:
  operationId: deleteMetadataFromAccessProfileByKeyAndValueV1
  summary: Remove metadata from access profile
  tags:
  - Access Profiles
  description: >-
    This API removes a single Access Model Metadata value from an access profile by attribute key and attribute value.
  parameters:
  - name: id
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessProfilesV1
    schema:
      type: string
    description: The access profile's ID.
    example: 2c91808c74ff913f0175097daa9d59cd
  - name: attributeKey
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeV1
    schema:
      type: string
    description: Technical name of the Attribute.
    example: iscPrivacy
  - name: attributeValue
    in: path
    required: true
    x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeValueV1
    schema:
      type: string
    description: Technical name of the Attribute Value.
    example: public
  responses:
    '202':
      description: Request accepted
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
