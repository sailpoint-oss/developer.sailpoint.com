post:
  operationId: searchAccessProfilesByFilterV1
  summary: Filter access profiles by metadata
  tags:
  - Access Profiles
  description: >-
    Get a list of access profiles filtered by Access Model Metadata and by filter expression. Filtering is supported
    by filter expression, by metadata attribute key and values, or by both together.
  parameters:
  - in: query
    name: for-subadmin
    schema:
      type: string
    description: >-
      Filters the returned list according to what is visible to the indicated ROLE_SUBADMIN or SOURCE_SUBADMIN
      identity. The value of the parameter is either an identity ID or the special value **me**, which is shorthand
      for the calling identity's ID.


      If you specify an identity that isn't a subadmin, the API returns a 400 Bad Request error.
    example: 8c190e6787aa4ed9a90bd9d5344523fb
    required: false
  - in: query
    name: limit
    description: >-
      Max number of results to return.

      See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
      for more information.
    required: false
    example: 50
    schema:
      type: integer
      format: int32
      minimum: 0
      maximum: 250
      default: 50
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **name, created, modified**
    example: name
    required: false
  - in: query
    name: for-segment-ids
    schema:
      type: string
      format: comma-separated
    description: >-
      Filters the returned list to those access profiles assigned to the specified segment IDs.
    example: 0b5c9f2d-1e1b-4b2f-9b1a-0e7f4a6c2d3e
    required: false
  - in: query
    name: include-unsegmented
    schema:
      type: boolean
      default: true
    description: Whether the returned list includes unsegmented access profiles.
    example: true
    required: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/accessprofilelistfilterdto.yaml
        example:
          filters: requestable eq false
          ammKeyValues:
          - attribute: iscFederalClassifications
            values:
            - secret
  responses:
    '200':
      description: List of access profiles matching the filter criteria.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/accessprofile.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:read
    - idn:access-profile-checked:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
