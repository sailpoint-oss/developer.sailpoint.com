get:
  operationId: getAccessProfileEntitlementsV2
  tags:
  - Access Profiles
  summary: List access profile's entitlements
  description: >-
    Get a list of an access profile's entitlements.


    This version reads from Search Lite and returns a superset of the entitlement returned by [List Access Profile's
    Entitlements V1](https://developer.sailpoint.com/docs/api/get-access-profile-entitlements-v-1), adding the
    entitlement's `tags` and calculated `privilegeLevel`. It also supports opaque cursor pagination through the
    `cursor` parameter and `X-Next-Cursor` response header.


    A SOURCE_SUBADMIN user must have access to the source associated with the specified access profile.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - name: id
    in: path
    description: ID of the access profile containing the entitlements.
    required: true
    x-sailpoint-resource-operation-id: listAccessProfilesV2
    schema:
      type: string
      example: 2c91808a7813090a017814121919ecca
  - $ref: ../../shared/parameters/limit.yaml
  - in: query
    name: offset
    description: >-
      Offset into the full result set. Usually specified with *limit* to paginate through the results. Must be 0 when
      you supply a `cursor`, and `offset` plus `limit` must not exceed 10000.


      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 0
    schema:
      type: integer
      format: int32
      minimum: 0
      default: 0
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    schema:
      type: string
    description: >-
      Filter results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, in, co*


      **attribute**: *eq, co*


      **value**: *eq, co*


      **created**: *lt, le, gt, ge*


      **modified**: *lt, le, gt, ge*


      **privilegeLevel.effective**: *eq, in*


      Results are automatically scoped to entitlements belonging to the access profile.
    example: attribute eq "memberOf"
    required: false
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
    description: >-
      Sort results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **name, attribute, value, created, modified, id,
      privilegeLevel.effective**


      Defaults to **created** ascending when omitted.
    example: name,-id
    required: false
  - in: query
    name: cursor
    schema:
      type: string
    description: >-
      Opaque cursor taken from the `X-Next-Cursor` header of a previous response, used to retrieve the next page of
      results. When you supply a cursor, `offset` must be 0.
    example: W3sic29ydCI6ImNyZWF0ZWQiLCJ2YWx1ZSI6IjIwMjEtMDMtMDFUMjI6MzI6NTguMTA0WiJ9LHsic29ydCI6ImlkIiwidmFsdWUiOiIyYzkxODA4YTcxOTBkMDZlMDE3MTk5MzhmY2QyMDc5MiJ9XQ
    required: false
  responses:
    '200':
      description: List of entitlements.
      headers:
        X-Total-Count:
          description: The total result count, returned when *count* is **true**.
          schema:
            type: integer
            format: int32
          example: 42
        X-Next-Cursor:
          description: Opaque cursor for the next page of results, returned when more results exist.
          schema:
            type: string
          example: W3sic29ydCI6ImNyZWF0ZWQiLCJ2YWx1ZSI6IjIwMjEtMDMtMDFUMjI6MzI6NTguMTA0WiJ9LHsic29ydCI6ImlkIiwidmFsdWUiOiIyYzkxODA4YTcxOTBkMDZlMDE3MTk5MzhmY2QyMDc5MiJ9XQ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/accessprofileentitlementv2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
