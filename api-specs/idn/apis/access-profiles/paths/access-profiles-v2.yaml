get:
  operationId: listAccessProfilesV2
  tags:
  - Access Profiles
  summary: List access profiles
  description: >-
    Get a list of access profiles.


    This version reads from Search Lite and returns the same access profile shape as [List Access Profiles
    V1](https://developer.sailpoint.com/docs/api/list-access-profiles-v-1), with two additions: the calculated
    `privilegeLevel` field, and opaque cursor pagination through the `cursor` parameter and `X-Next-Cursor` response
    header.


    >**Note:** When you omit `sorters`, results are sorted by `created` ascending. For deterministic ordering across
    pages, always specify explicit sorters. When you use cursor pagination, include `id` in `sorters`; the service
    appends it automatically if you omit it.


    >**Note:** `offset` and `cursor` are mutually exclusive. Use `offset=0` along with a cursor value taken from a
    prior response's `X-Next-Cursor` header.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - in: query
    name: for-subadmin
    schema:
      type: string
    description: >-
      Filters the returned list according to what is visible to the indicated ROLE_SUBADMIN or SOURCE_SUBADMIN
      identity. The value of the parameter is either an identity ID or the special value **me**, which is shorthand
      for the calling identity's ID.


      If you specify an identity that isn't a subadmin, the API returns a 400 Bad Request error.
    example: 8c190e6787aa4ed9a90bd9d5344523fb
    required: false
  - in: query
    name: limit
    description: >-
      Max number of results to return.

      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 50
    schema:
      type: integer
      format: int32
      minimum: 0
      maximum: 250
      default: 50
  - in: query
    name: offset
    description: >-
      Offset into the full result set. Usually specified with *limit* to paginate through the results. Must be 0 when
      you supply a `cursor`, and `offset` plus `limit` must not exceed 10000.


      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 0
    schema:
      type: integer
      format: int32
      minimum: 0
      default: 0
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    schema:
      type: string
    description: >-
      Filter results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, in, co*


      **created**: *lt, le, gt, ge*


      **modified**: *lt, le, gt, ge*


      **requestable**: *eq*


      **source.id**: *eq, in*


      **owner.id**: *eq, in*


      **additionalOwners.id**: *eq, in*


      **dimensional**: *eq*


      **entitlement.id**: *eq, in*


      **entitlement.name**: *eq, co*


      **privilegeLevel.effective**: *eq, in*


      Supported composite operators are *and, or*
    example: name co "Developer"
    required: false
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
    description: >-
      Sort results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **name, created, modified, id, privilegeLevel.effective**


      Defaults to **created** ascending when omitted.
    example: name,-id
    required: false
  - in: query
    name: for-segment-ids
    schema:
      type: string
      format: comma-separated
    description: |-
      Filters access profiles to only those assigned to the segment(s) with the specified IDs.
      If segmentation is currently unavailable, specifying this parameter results in an error.
    example: 0b5c9f25-83c6-4762-9073-e38f7bb2ae26,2e8d8180-24bc-4d21-91c6-7affdb473b0d
    required: false
  - in: query
    name: include-unsegmented
    schema:
      type: boolean
      default: true
    description: >-
      Indicates whether the response list should contain unsegmented access profiles. If `for-segment-ids` is absent
      or empty, specifying *include-unsegmented* as `false` results in an error.
    example: false
    required: false
  - in: query
    name: cursor
    schema:
      type: string
    description: >-
      Opaque cursor taken from the `X-Next-Cursor` header of a previous response, used to retrieve the next page of
      results. When you supply a cursor, `offset` must be 0.
    example: W3sic29ydCI6ImNyZWF0ZWQiLCJ2YWx1ZSI6IjIwMjEtMDMtMDFUMjI6MzI6NTguMTA0WiJ9LHsic29ydCI6ImlkIiwidmFsdWUiOiIyYzkxODA4YTcxOTBkMDZlMDE3MTk5MzhmY2QyMDc5MiJ9XQ
    required: false
  responses:
    '200':
      description: List of access profiles.
      headers:
        X-Total-Count:
          description: The total result count, returned when *count* is **true**.
          schema:
            type: integer
            format: int32
          example: 137
        X-Next-Cursor:
          description: Opaque cursor for the next page of results, returned when more results exist.
          schema:
            type: string
          example: W3sic29ydCI6ImNyZWF0ZWQiLCJ2YWx1ZSI6IjIwMjEtMDMtMDFUMjI6MzI6NTguMTA0WiJ9LHsic29ydCI6ImlkIiwidmFsdWUiOiIyYzkxODA4YTcxOTBkMDZlMDE3MTk5MzhmY2QyMDc5MiJ9XQ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/accessprofilev2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
post:
  operationId: createAccessProfileV2
  tags:
  - Access Profiles
  summary: Create access profile
  description: >-
    Create an access profile.


    This version accepts the same request body and applies the same validation as [Create Access Profile
    V1](https://developer.sailpoint.com/docs/api/create-access-profile-v-1). It returns the v2 access profile shape,
    which adds the read-only `privilegeLevel` field.


    A user with `ROLE_SUBADMIN` or `SOURCE_SUBADMIN` authority must be associated with the access profile's source.

    The maximum supported length for the description field is 2000 characters. Longer descriptions will be preserved for
    existing access profiles. However, any new access profiles as well as any updates to existing descriptions are
    limited to 2000 characters.

    >**Note:** To use this endpoint, you need all the listed scopes.

    >**Note:** `privilegeLevel` is read-only and is ignored if supplied in the request body. It is calculated
    asynchronously from the access profile's entitlements, so it is typically absent from the create response.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/accessprofilev2.yaml
  responses:
    '201':
      description: Access profile created.
      content:
        application/json:
          schema:
            $ref: ../schemas/accessprofilev2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:access-profile:manage
    - idn:entitlement:read
    - idn:identity:read
    - idn:sources:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
