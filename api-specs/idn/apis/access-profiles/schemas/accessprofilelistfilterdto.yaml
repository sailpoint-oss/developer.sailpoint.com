description: Filter criteria and Access Model Metadata key/values used to select access profiles.
type: object
properties:
  filters:
    type: string
    nullable: true
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, sw*


      **created**: *gt, ge, le*


      **modified**: *gt, lt, ge, le*


      **owner.id**: *eq, in*


      **requestable**: *eq*


      **source.id**: *eq, in*


      Supported composite operators are *and, or*
    example: requestable eq false
  ammKeyValues:
    type: array
    nullable: true
    description: The Access Model Metadata attributes and values used to filter the results.
    items:
      type: object
      properties:
        attribute:
          type: string
          description: >-
            The technical name of the metadata attribute. A blank or missing value is rejected with a 400 error.
          example: iscFederalClassifications
        values:
          type: array
          description: >-
            The attribute values used to filter access profiles. If the list is empty, results are filtered by
            attribute key only.
          items:
            type: string
            example: secret
          example:
            - secret
    example:
      - attribute: iscFederalClassifications
        values:
          - secret
