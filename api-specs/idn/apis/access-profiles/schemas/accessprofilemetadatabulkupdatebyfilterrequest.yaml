description: >-
  Request to bulk update Access Model Metadata on every access profile matching a filter expression. A single access
  profile cannot be assigned more than 25 metadata values. Adding or replacing custom metadata requires a suite license.
type: object
properties:
  filters:
    description: |-
      Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

      Filtering is supported for the following fields and operators:

      **id**: *eq, in*

      **name**: *eq, sw*

      **created**: *gt, ge, le*

      **modified**: *gt, lt, ge, le*

      **owner.id**: *eq, in*

      **requestable**: *eq*

      **source.id**: *eq, in*

      Supported composite operators are *and, or*
    type: string
    example: requestable eq false
  operation:
    description: The operation to be performed
    type: string
    enum:
      - ADD
      - REMOVE
      - REPLACE
    example: REPLACE
  replaceScope:
    description: >-
      The choice of update scope. **ATTRIBUTE** replaces only the values of the attributes named in `values`, and
      **ALL** replaces every metadata attribute on the access profile.
    type: string
    enum:
      - ALL
      - ATTRIBUTE
    example: ATTRIBUTE
  values:
    description: The metadata to be updated, including attribute key and value.
    type: array
    nullable: false
    items:
      type: object
      required:
        - attribute
        - values
      properties:
        attribute:
          type: string
          description: The technical name of the metadata attribute.
          example: iscFederalClassifications
        values:
          type: array
          description: The values of the attribute to be updated.
          items:
            type: string
            example: secret
          nullable: true
          example:
            - secret
        objectType:
          type: string
          description: >-
            The type of the metadata attribute. Set to `custom` for custom metadata attributes, which require a suite
            license.
          example: custom
    example:
      - attribute: iscFederalClassifications
        values:
          - topSecret
required:
  - filters
  - operation
  - replaceScope
  - values
