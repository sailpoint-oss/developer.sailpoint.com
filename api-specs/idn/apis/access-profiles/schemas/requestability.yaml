type: object
nullable: true
properties:
  commentsRequired:
    type: boolean
    description: Indicates whether the requester of the containing object must provide comments justifying the request.
    example: true
    nullable: true
    default: false
  denialCommentsRequired:
    type: boolean
    description: Indicates whether an approver must provide comments when denying the request.
    example: true
    nullable: true
    default: false
  reauthorizationRequired:
    type: boolean
    description: Indicates whether reauthorization is required for the request.
    example: true
    nullable: true
    default: false
  requireEndDate:
    type: boolean
    description: Indicates whether the requester of the containing object must provide access end date.
    example: true
    nullable: true
    default: false
  maxPermittedAccessDuration:
    $ref: ../../shared/schemas/accessduration.yaml
    nullable: true
  approvalSchemes:
    type: array
    nullable: true
    description: List describing the steps involved in approving the request.
    items:
      $ref: ./accessprofileapprovalscheme.yaml
  formDefinitionId:
    type: string
    nullable: true
    description: >-
      The ID of the form definition used for the access request. If specified, the form is presented to the requester
      during the access request process.
    example: 78258e80-e9e2-4e1a-a11f-ce0b7c62f25d
