type: object
properties:
  requestedItems:
    description: Available account selections for the identity, per requested item
    type: array
    items:
      $ref: ./requesteditemaccountselections.yaml
  accountsSelectionRequired:
    description: A boolean indicating whether any account selections will be required for the user to raise an access request
    type: boolean
    example: false
    default: false
  type:
    $ref: ../../shared/schemas/dtotype.yaml
    description: >
      DTO type of the requested-for identity.
      * `IDENTITY` for human identities.
      * `MACHINE_IDENTITY` for machine identities.
    example: IDENTITY
  id:
    description: >
      The identity id for the requested-for identity.
      * `IDENTITY`: the human identity id.
      * `MACHINE_IDENTITY`: the machine identity id (not the correlated human identity).
    type: string
    example: 70016590f2df4b879bdb1313a9e4e19e
  name:
    description: The name of the identity
    type: string
    example: User name
