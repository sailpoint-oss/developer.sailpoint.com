type: object
title: Branding Item Create
x-sailpoint-lint-ignore:
  schema-optional-properties-must-have-default: Button colors and binary files do not need a default in this context
required:
  - name
  - productName
properties:
  name:
    type: string
    description: name of branding item
    example: custom-branding-item
  productName:
    type: string
    description: product name
    example: product name
    nullable: true
  actionButtonColor:
    type: string
    description: hex value of color for action button
    example: 0074D9
  darkActionButtonColor:
    type: string
    description: hex value of color for action button in dark mode
    example: 0074D9
  activeLinkColor:
    type: string
    description: hex value of color for link
    example: '011E69'
  darkActiveLinkColor:
    type: string
    description: hex value of color for link in dark mode
    example: '011E69'
  navigationColor:
    type: string
    description: hex value of color for navigation bar
    example: '011E69'
  darkNavigationColor:
    type: string
    description: hex value of color for navigation bar in dark mode
    example: '011E69'
  emailFromAddress:
    type: string
    description: email from address
    example: no-reply@sailpoint.com
  loginInformationalMessage:
    type: string
    description: login information message
    example: ''
  fileStandard:
    type: string
    format: binary
    description: >-
      png file with logo. To remove an existing logo, delete the branding item and create it again.
      Omitting this field on update keeps the current logo.
    example: \x00\x00\x00\x02
  darkFileStandard:
    type: string
    format: binary
    description: >-
      png file with dark-mode logo. To remove an existing dark-mode logo, delete the branding item and create it
      again. Omitting this field on update keeps the current dark-mode logo.
    example: \x00\x00\x00\x02
