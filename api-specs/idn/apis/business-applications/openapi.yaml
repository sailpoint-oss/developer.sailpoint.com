openapi: 3.0.1
info:
  title: SailPoint Identity Security API - Business Applications
  description: >-
    Use these APIs to interact with the SailPoint Identity Security platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Business Applications
    description: >-
      A Business Application groups machine identities (for example AI agents or applications) under a
      common owner and sanctioned status. Business Applications can be defined out-of-the-box, discovered
      from a source, or created by an administrator. Signatures on a Business Application drive automatic
      correlation of machine identities to it; sanctioned status is independent metadata that machine
      identities inherit once linked.
paths:
  /business-applications/v1:
    $ref: ./paths/business-applications-v1.yaml
  /business-applications/v1/mcp-servers:
    $ref: ./paths/business-applications-v1-mcp-servers.yaml
  /business-applications/v1/mcp-servers/count:
    $ref: ./paths/business-applications-v1-mcp-servers-count.yaml
  /business-applications/v1/mcp-servers/{id}:
    $ref: ./paths/business-applications-v1-mcp-servers-by-id.yaml
  /business-applications/v1/mcp-servers/{id}/connected-agents:
    $ref: ./paths/business-applications-v1-mcp-servers-by-id-connected-agents.yaml
  /business-applications/v1/{id}:
    $ref: ./paths/business-applications-v1-by-id.yaml
security:
  - userAuth:
      - sp:scopes:all
