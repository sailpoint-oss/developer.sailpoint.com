get:
  operationId: listMcpServerConnectedAgentsV1
  tags:
    - Business Applications
  summary: List MCP server connected agents
  description: >-
    Returns the AI agents connected to an MCP server. Results are sorted by `name` ascending unless
    `sorters` is provided. Filtering is not supported on this endpoint. Requires the
    `idn:business-application:read` right and the Machine Identity Security product to be enabled for
    the tenant. Returns `404` if MCP server discovery is not enabled for the tenant.
  security:
    - userAuth:
        - idn:business-application:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
      x-sailpoint-resource-operation-id: listMcpServersV1
      description: MCP server ID.
      example: 2ee5e239-e68c-4d69-93fb-6c7ce4576190
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: name
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **created, modified, name, nativeIdentity,
        owners.primaryIdentity.name, owners.secondaryIdentity.name, source.name, resource.id**
    - $ref: ../../shared/parameters/count.yaml
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: A list of AI agents connected to the MCP server.
      headers:
        X-Total-Count:
          description: Included when `count=true`.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/mcpconnectedagent.yaml
    '400':
      description: >-
        Client Error - Returned if `id` is not a valid UUID, if `filters` is provided, or if `sorters`
        names an unsupported field.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      description: >-
        Not Found - Returned if no MCP server exists for the given ID, or if MCP server discovery is not
        enabled for the tenant.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
