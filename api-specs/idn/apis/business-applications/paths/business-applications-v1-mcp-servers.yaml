get:
  operationId: listMcpServersV1
  tags:
    - Business Applications
  summary: List MCP servers
  description: >-
    Returns the MCP (Model Context Protocol) servers discovered for the requesting tenant. Requires the
    `idn:business-application:read` right and the Machine Identity Security product to be enabled for
    the tenant. Returns `404` if MCP server discovery is not enabled for the tenant.
  security:
    - userAuth:
        - idn:business-application:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: serverName sw "io.github"
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **serverName**: *eq, co, sw*


        **description**: *eq, co*


        **sanctionedStatus**: *eq, in*


        **remotes**: *eq*


        Matching on `serverName` and `description` is case-insensitive. For `remotes`, `true` matches MCP servers
        with at least one remote endpoint.
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: -connectedAgentCount
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **serverName, description, modified,
        connectedAgentCount**
    - $ref: ../../shared/parameters/count.yaml
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: A list of MCP servers.
      headers:
        X-Total-Count:
          description: Included when `count=true`.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/mcpserver.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
