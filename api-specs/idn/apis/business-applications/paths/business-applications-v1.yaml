get:
  operationId: listBusinessApplicationsV1
  tags:
    - Business Applications
  summary: List Business Applications
  description: >-
    Returns the list of Business Applications defined for the requesting tenant. Requires the
    `idn:business-application:read` right and the Machine Identity Security product to be enabled
    for the tenant.
  security:
    - userAuth:
        - idn:business-application:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: sanctionedStatus eq "SANCTIONED"
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq*


        **name**: *eq, co*


        **vendor**: *eq, co*


        **signatures.type**: *eq, co*


        **signatures.name**: *eq, co*


        **source.name**: *eq, co*


        **sanctionedStatus**: *eq*
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: name
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **id, name, sanctionedStatus**
    - $ref: ../../shared/parameters/count.yaml
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
  responses:
    '200':
      description: A list of Business Application objects.
      headers:
        X-Total-Count:
          description: Included when `count=true`.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/businessapplication.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  operationId: createBusinessApplicationV1
  tags:
    - Business Applications
  summary: Create Business Application
  description: >-
    Creates a custom Business Application. Requires the `idn:business-application:create` right,
    the Machine Identity Security product to be enabled, and the custom Business Application
    feature to be enabled for the tenant. The `name` must be unique within the tenant, and any
    provided `signatures` must not already be assigned to another Business Application.
  security:
    - userAuth:
        - idn:business-application:create
  x-sailpoint-userLevels:
    - ORG_ADMIN
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/businessapplication.yaml
        example:
          name: Cursor
          description: AI coding assistant used by the platform engineering team.
          vendor: Cursor
          sanctionedStatus: SANCTIONED
          owner:
            type: IDENTITY
            id: 2c91808568c529c60168cca6f90c1313
            name: William Wilson
          signatures:
            - type: AI Agent
              name: cursor
  responses:
    '200':
      description: The created Business Application.
      content:
        application/json:
          schema:
            $ref: ../schemas/businessapplication.yaml
    '400':
      description: >-
        Client Error - Returned if the request body is invalid, for example a missing or blank
        `name`, an unrecognized signature `type`, or a duplicate `(type, name)` signature pair
        within the request.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
          examples:
            Missing name:
              value:
                detailCode: 400.1.0 Required Data Missing Or Empty
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                  - locale: en-US
                    localeOrigin: DEFAULT
                    text: Required field 'name' was missing or empty.
            Invalid signature type:
              value:
                detailCode: 400.1.0 Required Data Missing Or Empty
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                  - locale: en-US
                    localeOrigin: DEFAULT
                    text: 'Invalid signature type: Robot'
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '409':
      description: >-
        Conflict - Returned if the `name` is already in use by another Business Application in the
        tenant, or if a requested signature is already assigned to another Business Application.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
          examples:
            Name already in use:
              value:
                detailCode: 400.1.409 Reference Conflict
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                  - locale: en-US
                    localeOrigin: DEFAULT
                    text: Business Application with name "Cursor" already exists.
            Signature already assigned:
              value:
                detailCode: 400.1.409 Reference Conflict
                trackingId: b21b1f7ce4da4d639f2c62a57171b427
                messages:
                  - locale: en-US
                    localeOrigin: DEFAULT
                    text: Signature(s) is already associated with "another Business Application" "[AI_AGENT|cursor]".
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
