openapi: 3.0.1
info:
  title: Identity Security Cloud API - Capabilities
  description: >-
    Use these APIs to interact with the Identity Security Cloud platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Capabilities
    description: >
      Use this API to list, view, and update capabilities. A capability is something a machine identity such as an AI
      agent can use, for example an MCP server, a tool, a skill, a plugin, or a process, discovered from a connected
      source. You can update a capability's owners, description, and environment; the values discovered from the
      source are read-only.
paths:
  /capabilities/v1:
    $ref: ./paths/capabilities-v1.yaml
  /capabilities/v1/{id}:
    $ref: ./paths/capabilities-v1-by-id.yaml
security:
  - userAuth:
      - sp:scopes:all
