get:
  operationId: getCampaignReportDownloadUrlV1
  tags:
  - Certification Campaigns
  summary: Get campaign report download URL
  description: |
    Use this API to get a URL for downloading a certification campaign report.
  security:
  - userAuth:
    - idn:campaign-report:read
    - idn:campaign-report:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - CERT_ADMIN
  - REPORT_ADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  - in: path
    name: id
    schema:
      type: string
      example: 2c91808571bcfcf80171c23e4b4221fc
    required: true
    x-sailpoint-resource-operation-id: getActiveCampaignsV1
    description: ID of the campaign whose report is being downloaded.
  - in: path
    name: taskResultId
    schema:
      type: string
      example: 2c91808571bcfcf80171c23e4b4221fc
    required: true
    x-sailpoint-resource-operation-id: getCampaignReportsV1
    description: ID of the campaign task that generated the report.
  - in: path
    name: reportFormat
    schema:
      type: string
      enum:
      - PDF
      - CSV
      example: PDF
    required: true
    description: File format of the report to download.
  responses:
    '200':
      description: The information to download the campaign report.
      content:
        application/json:
          schema:
            $ref: ../schemas/campaignreportdownloadresponse.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
