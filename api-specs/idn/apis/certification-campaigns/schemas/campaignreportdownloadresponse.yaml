type: object
title: Campaign Report Download
required:
  - id
  - downloadUrl
properties:
  id:
    type: string
    description: The unique ID of the campaign report.
    example: e1aeb0b600214f408bc75c56533214b3
  downloadUrl:
    type: string
    format: uri
    description: |
      A URL to download the campaign report. A presigned download URL is valid for 90 minutes from the time it is returned. Call this endpoint again to get a new URL.
    example: https://secure-content.accessiq.sailpoint.com/someCampaignReport.pdf
