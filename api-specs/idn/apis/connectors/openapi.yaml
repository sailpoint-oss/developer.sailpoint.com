openapi: 3.0.1
info:
  title: SailPoint Identity Security API - Connectors
  description: >-
    Use these APIs to interact with the SailPoint Identity Security platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Connectors
    description: >
      Use this API to implement connector functionality.

      With this functionality in place, administrators can view available connectors.


      Connectors are the bridges SailPoint Identity Security uses to communicate with and aggregate data from sources.

      For example, if it is necessary to set up a connection between SailPoint Identity Security and the Active Directory
      source, a connector can bridge the two and enable SailPoint Identity Security to synchronize data between the systems.

      This ensures account entitlements and states are correct throughout the organization.


      In SailPoint Identity Security, administrators can use the Connections drop-down menu and select Sources to view the
      available source connectors.


      Refer to [SailPoint Identity Security
      Connectors](https://documentation.sailpoint.com/connectors/identitynow/landingpages/help/landingpages/identitynow_connectivity_landing.html)
      for more information about the connectors available in SailPoint Identity Security.


      Refer to [SaaS Connectivity](https://developer.sailpoint.com/docs/connectivity/saas-connectivity/) for more
      information about the SaaS custom connectors that do not need VAs (virtual appliances) to communicate with their
      sources.


      Refer to [Managing Sources](https://documentation.sailpoint.com/saas/help/sources/index.html) for more information
      about using connectors in SailPoint Identity Security.
paths:
  /connectors/v1/{scriptName}:
    $ref: ./paths/connectors-v1-by-scriptname.yaml
  /connectors/v1:
    $ref: ./paths/connectors-v1.yaml
  /connectors/v1/{scriptName}/source-config:
    $ref: ./paths/connectors-v1-by-scriptname-source-config.yaml
  /connectors/v1/{scriptName}/translations/{locale}:
    $ref: ./paths/connectors-v1-by-scriptname-translations-by-locale.yaml
  /connectors/v1/{scriptName}/source-template:
    $ref: ./paths/connectors-v1-by-scriptname-source-template.yaml
  /connectors/v1/{scriptName}/correlation-config:
    $ref: ./paths/connectors-v1-by-scriptname-correlation-config.yaml
security:
  - userAuth:
      - sp:scopes:all
