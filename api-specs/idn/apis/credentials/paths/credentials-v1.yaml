get:
  operationId: listCredentialsV1
  tags:
    - Credentials
  summary: List credentials
  description: |
    This API returns a list of credentials.


    Source sub-admins only see credentials on the sources they manage.


    When Machine Identity Security is not enabled for the tenant, this API returns `404`. When the credentials API is
    not enabled for the tenant, this API returns `403`.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: type eq "ACCESS_KEY"
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **name**: *eq, in, sw*


        **nativeIdentity**: *eq, in, sw*


        **type**: *eq, in*


        **status**: *eq, in*


        **resource.id**: *eq, in*


        **source.id**: *eq, in*


        **source.name**: *eq, in, sw*


        **owners.primary.id**: *eq, in*


        **owners.primary.name**: *eq, in, sw*


        **owners.primaryIdentity.id**: *eq, in*


        **owners.primaryIdentity.name**: *eq, in, sw*


        **owners.secondaryIdentity.id**: *eq, in*


        **owners.secondaryIdentity.name**: *eq, in, sw*


        **owners.secondaryGovernanceGroup.id**: *eq, in*


        **owners.secondaryGovernanceGroup.name**: *eq, in, sw*


        **owners.governanceGroup.id**: *eq, in*


        **owners.governanceGroup.name**: *eq, in, sw*


        **created**: *gt, ge, lt, le*


        **modified**: *gt, ge, lt, le*


        **expiresAt**: *gt, ge, lt, le*
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      required: false
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **created, modified, name, nativeIdentity, resource.id,
        source.name, owners.primary.id, owners.primary.name, owners.primaryIdentity.id, owners.primaryIdentity.name,
        owners.secondaryIdentity.id, owners.secondaryIdentity.name, owners.secondaryGovernanceGroup.id,
        owners.secondaryGovernanceGroup.name, owners.governanceGroup.id, owners.governanceGroup.name**
      example: name
    - $ref: ../../shared/parameters/count.yaml
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of credentials.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/credential.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
