title: Credential
type: object
description: A credential, such as an API key or access key, discovered from a connected source.
allOf:
  - $ref: ../../shared/schemas/basecommondto.yaml
  - type: object
    properties:
      description:
        type: string
        description: Description of the credential.
        example: Key used by the nightly export job
      status:
        type: string
        description: The credential status reported by the source.
        example: Active
      nativeIdentity:
        type: string
        description: The credential's unique identifier on the source.
        example: AKIAIOSFODNN7EXAMPLE
      environment:
        type: string
        description: The environment the credential belongs to.
        example: production
      source:
        description: The source the credential was discovered from.
        allOf:
          - $ref: ../../shared/schemas/basereferencedto.yaml
          - example:
              id: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
              name: AWS Production
              type: SOURCE
      resource:
        description: The source resource the credential is derived from.
        $ref: ./credentialresource.yaml
      datasetId:
        type: string
        description: The ID of the source dataset the credential was retrieved from.
        example: 8886e5e3-63d0-462f-a195-d98da885b8dc
      type:
        type: string
        description: The credential type.
        example: ACCESS_KEY
      scope:
        type: string
        description: The scope the source reports for the credential.
        example: read-write
      expiresAt:
        type: string
        format: date-time
        description: The date and time the credential expires.
        example: '2026-12-31T23:59:59Z'
      lastUsedAt:
        type: string
        format: date-time
        description: The date and time the credential was last used.
        example: '2026-10-20T08:15:00Z'
      owners:
        description: The owner configuration of the credential.
        $ref: ./credentialowners.yaml
      attributes:
        type: object
        additionalProperties: true
        description: A map of curated credential attributes.
        example:
          status: Active
      connectorAttributes:
        type: object
        additionalProperties: true
        description: A map of attributes sourced from the connector during aggregation.
        example:
          keyId: AKIAIOSFODNN7EXAMPLE
      manuallyEdited:
        type: boolean
        description: Indicates if the credential has been manually edited.
        default: false
        example: true
