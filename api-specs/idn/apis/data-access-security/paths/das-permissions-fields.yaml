get:
  summary: List data dictionary fields
  description: >-
    Returns custom data dictionary fields that can be used when configuring identity collector field mappings and
    other permission-related settings. Built-in fields are not included in list responses; only custom fields created
    via [Create Data Dictionary Field](https://developer.sailpoint.com/docs/api/create-data-dictionary-field-v-1) are returned. All listed fields have `required: false`.
  security:
  - userAuth:
    - das:permissions:read
    - das:permissions:manage
  - applicationAuth:
    - das:permissions:read
    - das:permissions:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  tags:
  - Data Access Security
  operationId: listDataDictionaryFieldsV1
  parameters:
  - name: filters
    in: query
    schema:
      type: string
    required: false
    example: dataDictionaryType eq "Users" and name eq "Department"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **dataDictionaryType**: *eq*


      **name**: *eq*


      Supported composite operators are *and*
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  responses:
    '200':
      description: Data dictionary fields matching the filter criteria.
      headers:
        X-Total-Count:
          description: The total number of results matching the filter criteria, regardless of paging limits.
          schema:
            type: integer
            format: int64
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/datadictionaryfieldlistitem.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  summary: Create data dictionary field
  description: >-
    Creates a custom data dictionary field. The server assigns fieldType String and required false; callers do not
    supply those values.
  security:
  - userAuth:
    - das:permissions:manage
  - applicationAuth:
    - das:permissions:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  tags:
  - Data Access Security
  operationId: createDataDictionaryFieldV1
  requestBody:
    description: Custom data dictionary field to create.
    content:
      application/json:
        schema:
          $ref: ../schemas/createdatadictionaryfieldrequest.yaml
    required: true
  responses:
    '201':
      description: The data dictionary field was created.
      headers:
        Location:
          description: URL of the created data dictionary field.
          schema:
            type: string
          example: /das/v1/permissions/fields/Department
      content:
        application/json:
          schema:
            $ref: ../schemas/datadictionaryfieldlistitem.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '409':
      $ref: ../responses/409.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
