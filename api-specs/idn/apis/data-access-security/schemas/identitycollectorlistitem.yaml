type: object
properties:
  id:
    type: string
    description: The unique identifier of the identity collector.
    example: "12345"
  name:
    type: string
    description: The display name of the identity collector.
    example: Active Directory Identity Collector
  type:
    type: string
    description: The identity collector type, derived from its underlying source.
    x-extensible-enum:
      - "Active Directory"
      - "Azure Active Directory"
      - "Google Drive"
      - "Dropbox"
      - "Dropbox SaaS"
      - "Box"
      - "Box SaaS"
      - "Microsoft Entra SaaS"
      - "Snowflake"
      - "Snowflake SaaS"
      - "Databricks"
      - "AWS"
      - "AWS SaaS"
    example: Active Directory
  sourceId:
    type: string
    description: >-
      The identifier of the source the identity collector is associated with, represented as a UUID. Both hyphenated
      and non-hyphenated formats are accepted.
    example: 2c9180835d2e5168015d32f890ca1581
  users:
    $ref: './identitycollectorcollectionsettings.yaml'
    description: Current users collection configuration, including properties and dynamic field mappings.
  groups:
    $ref: './identitycollectorcollectionsettings.yaml'
    description: Current groups collection configuration, including properties and dynamic field mappings.
