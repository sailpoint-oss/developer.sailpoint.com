type: object
description: >-
  A public identity collector type and the ISC `connectorName` values the UI should use when
  querying `GET /v3/sources` for sources that can back that type.
properties:
  type:
    type: string
    description: >-
      Identity collector type display name. Matches the `type` values returned by list and used
      by create/update metadata. Base types only (for example `Box`, not `Box SaaS`).
    example: Google Drive
  iscConnectorNames:
    type: array
    description: >-
      Exact ISC `connectorName` values to use in `GET /v3/sources` filters
      (`connectorName eq "..."`). These are not always equal to `type`
      (for example Google Drive maps to `G Suite` and `Google Workspace SaaS`).
    items:
      type: string
    example:
      - G Suite
      - Google Workspace SaaS
required:
- type
- iscConnectorNames
