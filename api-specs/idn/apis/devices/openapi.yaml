openapi: 3.0.1
info:
  title: Identity Security Cloud API - Devices
  description: >-
    Use these APIs to interact with the Identity Security Cloud platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Devices
    description: >
      Use this API to list, view, and update devices, and to get tenant-wide device counts. A device is a machine
      identity that represents an endpoint, such as a laptop or server, discovered from a connected source.
      You can update a device's owners, description, and environment; the discovered device attributes are read-only.
paths:
  /devices/v1:
    $ref: ./paths/devices-v1.yaml
  /devices/v1/device-counts:
    $ref: ./paths/devices-v1-device-counts.yaml
  /devices/v1/{id}:
    $ref: ./paths/devices-v1-by-id.yaml
security:
  - userAuth:
      - sp:scopes:all
