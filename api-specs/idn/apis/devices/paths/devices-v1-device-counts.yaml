get:
  operationId: getDeviceCountsV1
  tags:
    - Devices
  summary: Get device counts
  description: |
    This API returns tenant-wide device counts: the total number of devices, a breakdown by operating system, the
    average number of agents per device, and counts of devices without recent data and devices with active agents.


    Because the counts cover every device in the tenant, the caller needs the **idn:mis-identity:read** right. Owning
    devices does not grant access to this API.


    When Machine Identity Security is not enabled for the tenant, this API returns `404`. When the devices API is not
    enabled for the tenant, this API returns `403`.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: Device counts for the tenant.
      content:
        application/json:
          schema:
            $ref: ../schemas/devicesummary.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
