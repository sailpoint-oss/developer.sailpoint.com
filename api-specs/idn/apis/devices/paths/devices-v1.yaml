get:
  operationId: listDevicesV1
  tags:
    - Devices
  summary: List devices
  description: |
    This API returns a list of devices.


    A caller who owns the devices can list them. Other callers need the **idn:mis-identity:read** right. A caller
    without that right must filter the request to devices they own, for example `owners.primaryIdentity.id eq "me"`;
    if any returned device is not owned by the caller, this API returns `403`. In `owners.primaryIdentity.id` and
    `owners.secondaryIdentity.id` filters, the value `me` resolves to the calling identity.


    Source sub-admins only see devices on the sources they manage.


    When Machine Identity Security is not enabled for the tenant, this API returns `404`. When the devices API is not
    enabled for the tenant, this API returns `403`.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: hostname sw "lab-"
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **name**: *eq, in, sw*


        **nativeIdentity**: *eq, in, sw*


        **subtype**: *eq, in*


        **hostname**: *eq, in, sw*


        **os.type**: *eq, in, sw*


        **os.version**: *eq, in, sw*


        **sentinelVersion**: *eq, in, sw*


        **detectionModuleVersion**: *eq, in, sw*


        **email**: *eq, in, sw*


        **description**: *eq, in, sw*


        **environment**: *eq, in, sw*


        **datasetId**: *eq, in, sw*


        **resource.id**: *eq, in*


        **resource.type**: *eq, in*


        **source.id**: *eq, in*


        **source.name**: *eq, in, sw*


        **owners.primary.id**: *eq, in*


        **owners.primary.name**: *eq, in, sw*


        **owners.primaryIdentity.id**: *eq, in*


        **owners.primaryIdentity.name**: *eq, in, sw*


        **owners.secondaryIdentity.id**: *eq, in*


        **owners.secondaryIdentity.name**: *eq, in, sw*


        **owners.secondaryGovernanceGroup.id**: *eq, in*


        **owners.secondaryGovernanceGroup.name**: *eq, in, sw*


        **owners.governanceGroup.id**: *eq, in*


        **owners.governanceGroup.name**: *eq, in, sw*


        **created**: *gt, ge, lt, le*


        **modified**: *gt, ge, lt, le*
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      required: false
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **created, modified, name, nativeIdentity, hostname, os.type,
        os.version, sentinelVersion, detectionModuleVersion, email, description, environment, datasetId, resource.id,
        resource.type, source.name, owners.primaryIdentity.name, owners.secondaryIdentity.name,
        owners.secondaryGovernanceGroup.id, owners.secondaryGovernanceGroup.name, owners.governanceGroup.id,
        owners.governanceGroup.name**
      example: hostname
    - $ref: ../../shared/parameters/count.yaml
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of devices.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/device.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
