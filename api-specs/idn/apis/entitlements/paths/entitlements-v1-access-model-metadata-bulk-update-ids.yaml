post:
  operationId: updateEntitlementsMetadataByIdsV1
  summary: Bulk-update metadata by ids
  tags:
  - Entitlements
  description: |-
    This API initiates a bulk update of Access Model Metadata for one or more entitlements by a list of entitlement IDs.

    The update is processed asynchronously. The response returns the ID of the task performing the update.

    The maximum entitlement count in a single request is 3000. Adding or replacing custom metadata requires a suite license.

    This API replaces the deprecated `updateAccessModelMetadataByIdsV1` operation.
  requestBody:
    description: Attribute metadata bulk update request body.
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/entitlementmetadatabulkupdatebyidrequest.yaml
        example:
          entitlements:
          - 2c9180867817ac4d017817c491119a20
          operation: REPLACE
          replaceScope: ATTRIBUTE
          values:
          - attribute: iscFederalClassifications
            values:
            - topSecret
  responses:
    '202':
      description: Returned if the bulk update request was created.
      content:
        application/json:
          schema:
            $ref: ../schemas/entitlementmetadatabulkupdateresponse.yaml
          examples:
            Update request created successfully:
              value:
                id: 2d82ac17-eb0d-4ba6-9918-dcad6ee0294d
                type: ENTITLEMENT
                status: CREATED
                created: '2024-09-16T18:59:06.871594Z'
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:entitlement:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
