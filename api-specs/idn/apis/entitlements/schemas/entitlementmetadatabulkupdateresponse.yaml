type: object
properties:
  id:
    type: string
    description: ID of the task that is processing the bulk update.
    example: 2d82ac17-eb0d-4ba6-9918-dcad6ee0294d
  type:
    type: string
    description: Type of the object the bulk update applies to.
    example: ENTITLEMENT
  status:
    type: string
    description: The status of the bulk update request.
    enum:
      - CREATED
      - PRE_PROCESS
      - PRE_PROCESS_COMPLETED
      - POST_PROCESS
      - COMPLETED
      - CHUNK_PENDING
      - CHUNK_PROCESSING
      - RE_PROCESSING
      - PRE_PROCESS_FAILED
      - FAILED
    example: CREATED
  created:
    type: string
    description: Time when the bulk update request was created
    format: date-time
    example: '2020-10-08T18:33:52.029Z'
