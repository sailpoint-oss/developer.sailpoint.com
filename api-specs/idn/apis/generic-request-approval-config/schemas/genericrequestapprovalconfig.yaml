title: Generic Request Approval Config
type: object
description: The approval configuration for one scope, with one entry per action the scope's target type supports.
properties:
  id:
    type: string
    description: The approval configuration ID. Use it with the update API.
    example: 0f2c7a9e-3b4d-4e5f-8a6b-7c8d9e0f1a2b
  targetType:
    type: string
    description: The kind of scope.
    enum:
      - RESOURCE
      - SUBTYPE
      - SOURCE
      - GLOBAL
    example: RESOURCE
  targetId:
    type: string
    description: >-
      The scope target: the source resource ID for RESOURCE, the subtype ID for SUBTYPE, the source ID for SOURCE, and
      the tenant ID for GLOBAL.
    example: aws:bedrock-agent-alias-version
  approvalConfig:
    type: object
    description: >-
      The approval setting for each action, keyed by action name (ACTIVATE, DEACTIVATE, CREATE, or DELETE, depending on
      the target type). An empty object means the action inherits the organization-level approval configuration.
    additionalProperties:
      $ref: ./genericrequestapprovalactionconfig.yaml
    example:
      ACTIVATE:
        scheme: APPROVAL
        approvers: machineIdentityPrimaryOwner,workgroup:8d3e0094-8a5e-4c6f-9a0b-2e5a1c7d4f10
        comments: REJECTION
      DEACTIVATE: {}
