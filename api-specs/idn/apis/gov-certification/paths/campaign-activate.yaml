post:
  operationId: startGovCertificationCampaignV1
  tags:
    - Next Generation Certification Campaigns
  summary: Activate a Campaign
  description: >-
    Submits a job to activate the campaign with the given ID. The campaign must be staged. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  requestBody:
    description:
      Optional. If the timezone is not specified, we will continue using the campaign's timezone,
      which was set during campaign creation. The activation time calculated from the given
      timezone may cause the campaign deadline time to be modified, but it will remain
      within the original date. The timezone must be in a valid ISO 8601 format.
    required: false
    content:
      application/json:
        schema:
          $ref: '../schemas/ActivateCampaignOptions.yaml'
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
      description: The campaign id
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCampaignsV1
  responses:
    '202':
      $ref: '../../shared/responses/202.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
