post:
  operationId: completeGovCertificationCampaignV1
  tags:
    - Next Generation Certification Campaigns
  summary: Complete a Campaign
  description: >-
    :::caution

    This endpoint will run successfully for any campaigns that are **past due**.

    This endpoint will return a bad request error if the campaign is **not past due**.

    :::

    Completes a certification campaign. This is provided to admins so that they
    can complete a certification even if all items have not been completed. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  requestBody:
    description:
      Optional. Default behavior is for the campaign to auto-approve upon completion,
      unless we specify explicitly REVOKE in autoCompleteAction
    required: false
    content:
      application/json:
        schema:
          $ref: '../schemas/CompleteCampaignOptions.yaml'
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
      description: The campaign id
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCampaignsV1
  responses:
    '202':
      $ref: '../../shared/responses/202.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
