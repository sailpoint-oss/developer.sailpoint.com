get:
  operationId: getDownloadUrlV1
  tags:
    - Next Generation Certification Campaigns
  summary: Download URL for campaign report
  description: >-
    Retrieves a presigned URL to use for downloading the campaign report. Required roles are ORG_ADMIN or CERT_ADMIN or REPORT_ADMIN.
  security:
    - userAuth: [ idn:campaign-report:read ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
    - REPORT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: campaignId
      schema:
        type: string
        format: uuid
      required: true
      description: The ID of the campaign to be retrieved
      example: e1aeb0b6-0021-4f40-8bc7-5c56533214b3
      x-sailpoint-resource-operation-id: listCampaignsV1
    - in: path
      name: reportId
      schema:
        type: string
        format: uuid
      required: true
      description: The ID of the report to be retrieved
      example: e1aeb0b6-0021-4f40-8bc7-5c56533214b3
      x-sailpoint-resource-operation-id: listReportsV1
  responses:
    '200':
      description: The information to download the campaign report
      content:
        application/json:
          schema:
            $ref: '../schemas/CampaignReportDownloadResponse.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
