get:
  operationId: listReportsV1
  tags:
    - Next Generation Certification Campaigns
  summary: List reports for a campaign
  description: >-
    Retrieves all reports for an existing campaign using the campaign's ID. Required roles are ORG_ADMIN or CERT_ADMIN or REPORT_ADMIN.
  security:
    - userAuth: [ idn:campaign-report:read ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
    - REPORT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: campaignId
      schema:
        type: string
        format: uuid
      required: true
      description: The ID of the campaign to be retrieved
      example: e1aeb0b6-0021-4f40-8bc7-5c56533214b3
      x-sailpoint-resource-operation-id: listCampaignsV1
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      required: false
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, ne, in*


        **name**: *eq, sw, co*


        **type**: *eq, in, ne*


        Possible values are [STATUS, SIGN_OFF, COMPOSITION, REMEDIATION]


        **format**: *eq, in, ne*


        Possible values are [PDF, CSV]


        **status**: *eq, in, ne*


        Possible values are [IN_PROGRESS, FAILED, SUCCESS]
      example: type eq "SIGN_OFF"
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      required: false
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **name, type, format, created, modified**
      example: name,-created
  responses:
    '200':
      description: A list of all reports, regardless of status, for the given campaign
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/CampaignReport.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
post:
  operationId: createReportV1
  tags:
    - Next Generation Certification Campaigns
  summary: Create campaign report
  description: Creates a new campaign report asynchronously for the provided campaignId. Required roles are ORG_ADMIN or CERT_ADMIN or REPORT_ADMIN.
  security:
    - userAuth: [ idn:campaign-report:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
    - REPORT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: campaignId
      schema:
        type: string
        format: uuid
      required: true
      description: The ID of the campaign to generate a report for
      example: e1aeb0b6-0021-4f40-8bc7-5c56533214b3
      x-sailpoint-resource-operation-id: listCampaignsV1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/TriggerCampaignReportRequest.yaml'
  responses:
    '200':
      description: Indicates that the generation of the campaign report was started successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/CampaignReport.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
