post:
  operationId: createCampaignFromTemplateV1
  tags:
    - Next Generation Certification Campaigns
  summary: Generate campaign from template
  description: >-
    Generates a new campaign from a campaign template.

    The campaign object contained in the template has special formatting applied to its name and description
    fields in order to determine the generated campaign's name/description. Placeholders in those fields are
    formatted with the current date and time upon generation.

    Placeholders consist of a percent sign followed by a letter indicating what should be inserted; for
    example, "%Y" will insert the current year; a campaign template named "Campaign for %y" would generate a
    campaign called "Campaign for 2020" (assuming the year at generation time is 2020).

    Valid placeholders are the date/time conversion suffix characters supported by [java.util.Formatter](https://docs.oracle.com/javase/8/docs/api/java/util/Formatter.html).

    Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
      description: The desired campaign template's ID.
      example: 2c918083-5d19-1a86-a15d-28455b4a2329
      x-sailpoint-resource-operation-id: listCampaignTemplatesV1
  responses:
    '200':
      description: Indicates a campaign was successfully generated from this template, and returns a reference to the new campaign.
      content:
        application/json:
          schema:
            $ref: '../schemas/CampaignGet.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
