post:
  operationId: createGovCertificationCampaignTemplateV1
  tags:
    - Next Generation Certification Campaigns
  summary: Create a Campaign Template.
  description: Creates campaign template based on campaign. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign-template:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/CampaignTemplateCreate.yaml'
        examples:
          Identity Campaign Template With Manager As Reviewer Using Search Based Params:
            $ref: '../schemas/examples/IdentityCampaignTemplateWithSearchBasedParams.yaml'
          Identity Campaign Template With Identity As Reviewer Using Campaign Filter:
            $ref: '../schemas/examples/IdentityCampaignTemplateWithCampaignFilter.yaml'
          Identity Campaign Template With Governance Group As Reviewer:
            $ref: '../schemas/examples/IdentityCampaignTemplateWithGovernanceGroupAsReviewer.yaml'
          Identity Campaign Template With Source Owner As Reviewer:
            $ref: '../schemas/examples/SourceOwnerCampaignTemplate.yaml'
          Identity Campaign Template With Object Owner As Reviewer:
            $ref: '../schemas/examples/IdentityCampaignTemplateWithObjectOwnerAsReviewer.yaml'
          Machine Accounts Campaign Template:
            $ref: '../schemas/examples/MachineAccountsCampaignTemplate.yaml'
          Uncorrelated Accounts Campaign Template:
            $ref: '../schemas/examples/UncorrelatedAccountsCampaignTemplate.yaml'
  responses:
    '200':
      description: Created successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/CampaignTemplateGet.yaml'
          examples:
            Manager Review:
              $ref: '../schemas/examples/CampaignTemplateManager.yaml'
            Search Campaign:
              $ref: '../schemas/examples/CampaignTemplateSearch.yaml'
            Source Owner Campaign:
              $ref: '../schemas/examples/CampaignTemplateSourceOwner.yaml'
            Machine Accounts Campaign:
              $ref: '../schemas/examples/CampaignTemplateMachineAccount.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
get:
  operationId: listCampaignTemplatesV1
  tags:
    - Next Generation Certification Campaigns
  summary: List Campaign Templates
  description: >-
    Lists all campaign templates matching the supplied standard V3 query parameters. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign-template:read ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      description: >-
        Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **name, created, modified**
      example: name
      required: false
    - in: query
      name: filters
      schema:
        type: string
      description: >-
        Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, ne, in, gt, ge, lt, le, sw, co*


        **name**: *eq, ne, in, gt, ge, lt, le, sw, co*
      example: name eq "Campaign Template"
      required: false
  responses:
    '200':
      description: List of campaign template objects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/CampaignTemplateGet.yaml'
          examples:
            Campaign Templates:
              $ref: '../schemas/examples/CampaignTemplates.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
