post:
  operationId: moveCertificationsV1
  tags:
    - Next Generation Certification Campaigns
  summary: Reassign certifications to an identity
  description: >-
    This API reassigns the specified certifications from one identity to another. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: campaignId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification campaign ID.
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCampaignsV1
  requestBody:
    required: true
    description: A non-empty array of items and identities which reviewer is going to reassign.
    content:
      application/json:
        schema:
          $ref: '../schemas/ReassignCertifications.yaml'
  responses:
    '202':
      description: A task tracking the asynchronous certification reassignment.
      content:
        application/json:
          schema:
            $ref: '../schemas/CertificationTask.yaml'
          examples:
            Reassignment Task:
              $ref: '../schemas/examples/ReassignmentTask.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
