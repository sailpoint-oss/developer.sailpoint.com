get:
  operationId: listCampaignsV1
  summary: List the campaigns
  tags:
    - Next Generation Certification Campaigns
  description: List all the campaign details. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:read ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      required: false
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **name**: *eq, sw, co*


        **status**: *eq, in, ne*


        Possible values are [PENDING, STAGED, CANCELING, ACTIVATING, ACTIVE, COMPLETING, COMPLETED, ERROR]
      example: name eq "Manager Campaign"
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      required: false
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **name, created, modified, deadline, status, totalCertifications, completedCertifications**
      example: name,-created
  responses:
    '200':
      description: The list of all the campaign details.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/CampaignSummary.yaml'
          examples:
            Campaigns:
              $ref: '../schemas/examples/CampaignSummaries.yaml'
      headers:
        X-Total-Count:
          description: Total number of items, regardless of paging limits.
          schema:
            type: integer
            format: int64
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
post:
  operationId: createGovCertificationCampaignV1
  tags:
    - Next Generation Certification Campaigns
  summary: Create a campaign
  description: Creates a new Certification Campaign with the information provided in the request body. Required roles are ORG_ADMIN or CERT_ADMIN.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/CampaignCreate.yaml'
        examples:
          Identity Campaign With Manager As Reviewer Using Search Based Params:
            $ref: '../schemas/examples/IdentityCampaignWithSearchBasedParams.yaml'
          Identity Campaign With Identity As Reviewer Using Campaign Filter:
            $ref: '../schemas/examples/IdentityCampaignWithCampaignFilter.yaml'
          Identity Campaign With Governance Group As Reviewer:
            $ref: '../schemas/examples/IdentityCampaignWithGovernanceGroupAsReviewer.yaml'
          Identity Campaign With Source Owner As Reviewer:
            $ref: '../schemas/examples/SourceOwnerCampaign.yaml'
          Identity Campaign With Object Owner As Reviewer:
            $ref: '../schemas/examples/IdentityCampaignWithObjectOwnerAsReviewer.yaml'
          Machine Accounts Campaign:
            $ref: '../schemas/examples/MachineAccountsCampaign.yaml'
          Uncorrelated Accounts Campaign:
            $ref: '../schemas/examples/UncorrelatedAccountsCampaign.yaml'
  responses:
    '200':
      description: Indicates that the campaign requested was successfully created and returns its representation.
      content:
        application/json:
          schema:
            $ref: '../schemas/CampaignGet.yaml'
          examples:
            Manager Review:
              $ref: '../schemas/examples/FullCampaignManager.yaml'
            Search Campaign:
              $ref: '../schemas/examples/FullCampaignSearch.yaml'
            Source Owner Campaign:
              $ref: '../schemas/examples/FullCampaignSourceOwner.yaml'
            Machine Accounts Campaign:
              $ref: '../schemas/examples/FullCampaignMachineAccount.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
