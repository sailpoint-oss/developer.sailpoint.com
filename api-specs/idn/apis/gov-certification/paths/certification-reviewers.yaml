get:
  operationId: listGovCertificationReviewersV1
  tags:
    - Next Generation Certification Campaigns
  summary: List of Reviewers for certification
  description: >-
    This API returns a list of reviewers for the certification. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      description: >-
        Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **name**: *eq, sw, co*


        **email**: *eq, sw, co*
      example: name eq "Bob"
      required: false
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      description: >-
        Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **name, email**
      example: name
      required: false
  responses:
    '200':
      description: A list of reviewers
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/IdentityReference.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
