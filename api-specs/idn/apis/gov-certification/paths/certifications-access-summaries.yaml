get:
  operationId: getAccessSummariesV1
  tags:
    - Next Generation Certification Campaigns
  summary: Access Summaries
  description: >-
    This API returns a list of access summaries for the specified certification and type. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
    - in: path
      name: type
      schema:
        $ref: '../schemas/CertificationItemType.yaml'
      required: true
      description: The type of review item to retrieve summaries for
      example: ACCESS_PROFILE
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      description: >-
        Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **completed**: *eq, ne*


        **targetReference.id**: *eq, ne, in*


        **targetReference.name**: *eq, sw, co*


        **sourceName**: *eq, sw, co*
      example: completed eq false and sourceName sw 'AD'
      required: false
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      description: >-
        Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **targetReference.name**
      required: false
      example: targetReference.name
  responses:
    '200':
      description: List of access summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/ReviewData.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
