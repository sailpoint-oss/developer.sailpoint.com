get:
  operationId: getCertificationEntitlementPermissionsV1
  tags:
    - Next Generation Certification Campaigns
  summary: Permissions in a Certification
  description: >-
    Retrieves a list of permissions associated with the given certification itemId value, as long as the logged-in user is a
    reviewer of the specified certification, and the certification contains either the specified entitlement, or an
    access profile or the role that contains the specified entitlement. ORG_ADMIN or CERT_ADMIN can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
    - in: path
      name: reviewItemId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification item ID
      example: 2478b87b-f0d2-4585-b42d-45e4d580c5cf
      x-sailpoint-resource-operation-id: listReviewItemsV1
    - in: path
      name: entitlementId
      schema:
        type: string
      required: true
      description: The entitlement ID
      example: ef38f94347e94562b5bb8424a56397d8
      x-sailpoint-resource-operation-id: listEntitlementsV1
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
  responses:
    '200':
      description: Entitlement permissions corresponding to the given entitlement ID
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/passthrough/PermissionDTO.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
