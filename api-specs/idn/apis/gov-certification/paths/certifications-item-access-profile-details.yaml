get:
  operationId: getGovCertificationAccessProfileV1
  tags:
    - Next Generation Certification Campaigns
  summary: Get an Access Profile
  description: >-
    This API returns an access profile details based on access profile id provided, as long as the logged-in user is a reviewer of
    the specified certification, and the certification contains either the specified access profile, or a role
    that contains the specified access profile. ORG_ADMIN or CERT_ADMIN can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
    - in: path
      name: reviewItemId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification item ID. This must of review item type either ROLE or ACCESS_PROFILE.
      example: 2478b87b-f0d2-4585-b42d-45e4d580c5cf
      x-sailpoint-resource-operation-id: listReviewItemsV1
    - in: path
      name: accessProfileId
      required: true
      schema:
        type: string
      description: The Access Profile ID
      example: 2c9180837ca6693d017ca8d097500149
      x-sailpoint-resource-operation-id: listAccessProfilesV1
  responses:
    '200':
      description: An AccessProfile
      content:
        application/json:
          schema:
            $ref: '../schemas/passthrough/AccessProfile.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
