post:
  operationId: searchCertificationsV1
  tags:
    - Next Generation Certification Campaigns
  summary: Search Certifications
  description: >-
    This API returns a list of certifications. It contains a request body with search parameters.
    Any authenticated token can call this API, but only certifications you are authorized to review will be returned.
    Non-admin users must include query parameter as `?reviewer-identity=me` in the API call.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: query
      name: reviewer-identity
      schema:
        type: string
        example: me
      description: The ID of reviewer identity. *me* indicates the current user.
      required: false
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **phase**: *eq*


        **completed**: *eq*


        **campaignRef.campaignType**: *eq, in*


        **campaignRef.id**: *eq, in*


        **reviewProgress**: *eq, in*


        **reviewerDeleted**: *eq*


        **reviewerName**: *sw, co*
      required: false
      example: reviewerName sw "Bob"
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **name, dueDate, dateSigned**
      required: false
      example: name
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../schemas/SearchRequest.yaml'
  responses:
    '200':
      description: A List of certifications
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Certification.yaml'
      headers:
        X-Total-Count:
          description: Total number of items, regardless of paging limits.
          schema:
            type: integer
            format: int64
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
