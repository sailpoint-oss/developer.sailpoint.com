post:
  operationId: processSignOffCertificationV1
  tags:
    - Next Generation Certification Campaigns
  summary: Finalize Certification Decisions
  description: >-
    This API finalizes all decisions made on a certification and initiates any remediations required. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this
    API.
  security:
    - userAuth: [ idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
  responses:
    '200':
      description: A Certification object
      content:
        application/json:
          schema:
            $ref: '../schemas/Certification.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
