get:
  operationId: getStatusSummaryV1
  tags:
    - Next Generation Certification Campaigns
  summary: Status Summary For Certifications
  description: >-
    Return the status summary for certifications owned by the logged in user. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  responses:
    '200':
      description: Status Summary of the active certifications owned by the logged in user
      content:
        application/json:
          schema:
            $ref: '../schemas/CertificationStatusSummary.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
