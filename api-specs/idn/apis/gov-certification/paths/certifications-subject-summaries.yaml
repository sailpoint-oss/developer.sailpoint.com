get:
  operationId: listSubjectSummariesV1
  tags:
    - Next Generation Certification Campaigns
  summary: Subject Summaries for a Certification
  description: >-
    This API returns a list of the subject summaries for a specific certification. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
    - in: path
      name: certificationId
      schema:
        type: string
        format: uuid
      required: true
      description: The certification ID
      example: ef38f943-47e9-4562-b5bb-8424a56397d8
      x-sailpoint-resource-operation-id: listCertificationsV1
    - $ref: '../../shared/parameters/limit.yaml'
    - $ref: '../../shared/parameters/offset.yaml'
    - $ref: '../../shared/parameters/count.yaml'
    - in: query
      name: filters
      schema:
        type: string
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **targetId**: *eq, ne, in*


        **completed**: *eq, ne*


        **subjectName**: *eq, sw, co*
      example: completed eq false and subjectName sw 'Derek'
      required: false
    - in: query
      name: sorters
      schema:
        type: string
        format: comma-separated
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **subjectName, targetDisplayName**
      example: subjectName
      required: false
  responses:
    '200':
      description: List of certification subject summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/CertificationSubjectSummary.yaml'
          example:
            - subjectType: IDENTITY
              id: 2c918087-72a5-44f5-a172-a9540e501ba7
              subjectName: Derek Grey
              subjectTargetId: 2c9180857182306001719937379633e4
              completed: false
            - subjectType: IDENTITY
              id: 2c918087-72a5-44f5-a172-a9540e501ba8
              subjectName: Mary LeMasters
              subjectTargetId: 2c9180857182306001719937377a33de
              completed: true
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
