post:
  operationId: searchInsightsAccessSummaryV1
  tags:
    - Next Generation Certification Campaigns
  summary: Get Insights Access Summary
  description: >-
    Retrieves the scoped access based on the provided InsightDetails. Required roles are ORG_ADMIN or CERT_ADMIN. Reviewers for this certification can also call this API.
  security:
    - userAuth: [ idn:campaign:read, idn:campaign:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - CERT_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/passthrough/InsightDetails.yaml'
  responses:
    '200':
      description: Scoped access based on the provided InsightDetails.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/passthrough/ScopedAccess.yaml'
    '400':
      $ref: '../../shared/responses/400.yaml'
    '401':
      $ref: '../../shared/responses/401.yaml'
    '403':
      $ref: '../../shared/responses/403.yaml'
    '404':
      $ref: '../../shared/responses/404.yaml'
    '429':
      $ref: '../../shared/responses/429.yaml'
    '500':
      $ref: '../../shared/responses/500.yaml'
