type: object
title: Campaign
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    description: ID of the campaign
    example: 2c9079b2-70a2-66a6-a170-a2779fcb0007
  name:
    description: >-
      The campaign name.
    type: string
    example: Manager Campaign
  description:
    type: string
    description: >-
      The campaign description.
    example: Everyone needs to be reviewed by their manager
  deadline:
    type: string
    format: date
    description: >-
      The campaign's completion deadline date. While creating campaign, If deadline is passed as empty then
      automatically it will be set for two weeks later from current time.
    example: '2020-03-15'
  deadlineTimezone:
    type: string
    description:
      The timezone must be in a valid ISO 8601 format. Timezones in ISO 8601 are represented as UTC (represented as 'Z')
      or as an offset from UTC. The offset format can be +/-hh:mm, +/-hhmm, or +/-hh.
    example: -05:00
  deadlineTime:
    type: string
    format: date-time
    description: Calculated deadline time in UTC timezone of the campaign calculated from the deadline and the deadlineTimezone
    example: '2018-10-19T13:49:37.385Z'
  emailNotificationEnabled:
    type: boolean
    description: Enables email notification for this campaign
    default: false
    example: false
  autoRevokeAllowed:
    type: boolean
    description: Allows auto revoke for this campaign
    default: false
    example: false
  autoActivate:
    type: boolean
    description: >-
      If true, the campaign is set to activate automatically after generation completes.
      Campaigns stored without this attribute default to false.
    default: false
    example: false
  recommendationsEnabled:
    type: boolean
    description: >-
      Enables IAI for this campaign. Accepts true even if the IAI product feature is off. If IAI is turned off
      then campaigns generated from this template will indicate false. The real value will then be returned if
      IAI is ever enabled for the org in the future.
    default: false
    example: true
  sunsetCommentsRequired:
    type: boolean
    description: >-
      Determines if comments on sunset date changes are required.
    default: true
    example: true
  type:
    $ref: 'CampaignType.yaml'
  reviewer:
    $ref: 'Reviewer.yaml'
  alerts:
    type: array
    description: A list of errors and warnings that have accumulated.
    readOnly: true
    items:
      $ref: 'Alert.yaml'
    default: [ ]
  filterRef:
    $ref: 'CampaignFilterRef.yaml'
  inlineFilter:
    $ref: 'CampaignFilterInline.yaml'
  searchBasedParams:
    $ref: 'CampaignSearchBasedParams.yaml'
  remediatorRef:
    $ref: 'CampaignRemediatorRef.yaml'
  ownerId:
    type: string
    description: The campaign owner is the Identity that created the campaign.
    example: 4030ca72bdfb4980b51b8fcee948be50
  created:
    type: string
    readOnly: true
    format: date-time
    description: Created time of the campaign
    example: '2020-03-03T22:15:13.611Z'
  modified:
    type: string
    readOnly: true
    format: date-time
    description: Modified time of the campaign
    example: '2020-03-03T22:20:12.674Z'
  totalCertifications:
    type: integer
    format: int32
    description: The total number of certifications in this campaign.
    readOnly: true
    example: 100
  completedCertifications:
    type: integer
    format: int32
    description: The number of completed certifications in this campaign.
    readOnly: true
    example: 10
  mandatoryCommentRequirement:
    $ref: './CampaignMandatoryCommentRequirement.yaml'
  status:
    type: string
    description: The campaign's current status.
    readOnly: true
    enum:
      - PENDING
      - STAGED
      - CANCELING
      - ACTIVATING
      - ACTIVE
      - COMPLETING
      - COMPLETED
      - ERROR
    example: ACTIVE
  latestReports:
    type: object
    description: A map of the latest report for each report type
    additionalProperties:
      $ref: './CampaignLatestReport.yaml'
    example: "{'STATUS': {...},'SIGN_OFF': {...}}"
  sourceIds:
    type: array
    description: A direct list of sourceIds to include in this campaign.
    items:
      type: string
    example: [ 0fbe863c063c4c88a35fd7f17e8a3df5 ]
  sourcesWithOrphanEntitlements:
    type: array
    description: >-
      Sources that have orphan entitlement line items for this campaign, as supplied when the campaign finished staging.
      Each entry identifies a source by id and name.
    readOnly: true
    items:
      $ref: './CampaignOrphanEntitlementSource.yaml'
    example:
      - type: SOURCE
        id: 30e6435e60bf47b0bc11622c31dfdbfd
        name: Active Directory

required:
  - name
  - description
  - type
  - reviewer
