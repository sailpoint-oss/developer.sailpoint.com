type: object
properties:
  certificationIds:
    type: array
    description: List of certification IDs to reassign
    items:
      type: string
      format: uuid
    minItems: 1
    maxItems: 250
    example:
      - af385946-4779-4712-91bb-8424a563abc1
      - af385946-4779-4712-91bb-8424a563abc2
      - af385946-4779-4712-91bb-8424a563abc3
  reassignTo:
    type: object
    description: Reviewer to which the certification is reassigned
    properties:
      id:
        type: string
        format: uuid
        description: The identity ID to which the review is being assigned.
        example: 0fbe863c-063c-4c88-a35f-d7f17e8a3df5
      type:
        type: string
        description: The type of the ID provided
        enum:
          - IDENTITY
        example: IDENTITY
  reason:
    type: string
    description: Comment to explain why the certification was reassigned
    example: Reassigning the certifications
required:
  - certificationIds
  - reassignTo
  - reason
