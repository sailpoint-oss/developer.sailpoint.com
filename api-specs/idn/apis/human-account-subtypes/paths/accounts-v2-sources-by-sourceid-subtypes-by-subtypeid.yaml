get:
  summary: Get a human account subtype
  description: Get a human account subtype of a source by subtype ID.
  operationId: getHumanAccountSubtypeV2
  tags:
  - Human Account Subtypes
  parameters:
  - in: path
    name: sourceId
    description: ID of the source.
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    example: 6d0458373bec4b4b80460992b76016da
  - in: path
    name: subtypeId
    description: ID of the human account subtype.
    required: true
    x-sailpoint-resource-operation-id: listHumanAccountSubtypesV2
    schema:
      type: string
    example: 38453251-6be2-5f8f-df93-5ce19e295838
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  responses:
    '200':
      description: Human account subtype.
      content:
        application/json:
          schema:
            $ref: ../schemas/humanaccountsubtype.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:read
  - applicationAuth:
    - idn:source-subtypes:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
patch:
  summary: Update a human account subtype
  description: >-
    Update the display name or description of a human account subtype. Only replace operations on `/displayName` and
    `/description` are supported.
  operationId: updateHumanAccountSubtypeV2
  tags:
  - Human Account Subtypes
  parameters:
  - in: path
    name: sourceId
    description: ID of the source.
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    example: 6d0458373bec4b4b80460992b76016da
  - in: path
    name: subtypeId
    description: ID of the human account subtype.
    required: true
    x-sailpoint-resource-operation-id: listHumanAccountSubtypesV2
    schema:
      type: string
    example: 38453251-6be2-5f8f-df93-5ce19e295838
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  requestBody:
    required: true
    description: JSON Patch operations to apply to the subtype, as defined by [RFC 6902](https://tools.ietf.org/html/rfc6902).
    content:
      application/json-patch+json:
        schema:
          type: array
          items:
            $ref: ../../shared/schemas/jsonpatchoperation.yaml
        examples:
          UpdateDisplayName:
            value:
            - op: replace
              path: /displayName
              value: Senior Contractor
  responses:
    '200':
      description: Updated human account subtype.
      content:
        application/json:
          schema:
            $ref: ../schemas/humanaccountsubtype.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:update
  - applicationAuth:
    - idn:source-subtypes:update
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
delete:
  summary: Delete a human account subtype
  description: Delete a human account subtype of a source, together with its account-create configuration.
  operationId: deleteHumanAccountSubtypeV2
  tags:
  - Human Account Subtypes
  parameters:
  - in: path
    name: sourceId
    description: ID of the source.
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    example: 6d0458373bec4b4b80460992b76016da
  - in: path
    name: subtypeId
    description: ID of the human account subtype.
    required: true
    x-sailpoint-resource-operation-id: listHumanAccountSubtypesV2
    schema:
      type: string
    example: 38453251-6be2-5f8f-df93-5ce19e295838
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  responses:
    '204':
      description: Human account subtype deleted.
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '409':
      description: >-
        Conflict - Returned if the subtype is in use and cannot be deleted.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:delete
  - applicationAuth:
    - idn:source-subtypes:delete
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
