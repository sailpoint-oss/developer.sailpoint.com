get:
  x-sailpoint-lint-ignore:
    path-list-operations-must-return-object: Shelby returns this page as a JSON array, the same shape as the machine subtype list.
  summary: List human account subtypes
  description: Get the human account subtypes of a source.
  operationId: listHumanAccountSubtypesV2
  tags:
  - Human Account Subtypes
  parameters:
  - in: path
    name: sourceId
    description: ID of the source.
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    example: 6d0458373bec4b4b80460992b76016da
  - $ref: ../../shared/parameters/count.yaml
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
      default: ""
    required: false
    description: |-
      Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

      Sorting is supported for the following fields: **sourceId**
    example: sourceId
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  responses:
    '200':
      description: List of human account subtypes of the source.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/humanaccountsubtype.yaml
          examples:
            HumanAccountSubtype:
              value:
              - id: 38453251-6be2-5f8f-df93-5ce19e295838
                sourceId: 6d0458373bec4b4b80460992b76016da
                technicalName: contractor
                displayName: Contractor
                description: Contractors with a limited account lifecycle
                entityType: ACCOUNT
                default: false
                systemManaged: false
                created: '2026-11-20T10:15:30.123Z'
                modified: '2026-11-20T10:15:30.123Z'
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:read
  - applicationAuth:
    - idn:source-subtypes:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
post:
  summary: Create a human account subtype
  description: Create a human account subtype for a source.
  operationId: createHumanAccountSubtypeV2
  tags:
  - Human Account Subtypes
  parameters:
  - in: path
    name: sourceId
    description: ID of the source.
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    example: 6d0458373bec4b4b80460992b76016da
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/humanaccountsubtypecreaterequest.yaml
        examples:
          HumanAccountSubtype:
            value:
              technicalName: contractor
              displayName: Contractor
              description: Contractors with a limited account lifecycle
              default: false
  responses:
    '201':
      description: Created human account subtype.
      headers:
        location:
          description: URL of the created human account subtype.
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: ../schemas/humanaccountsubtype.yaml
          examples:
            HumanAccountSubtype:
              value:
                id: 38453251-6be2-5f8f-df93-5ce19e295838
                sourceId: 6d0458373bec4b4b80460992b76016da
                technicalName: contractor
                displayName: Contractor
                description: Contractors with a limited account lifecycle
                entityType: ACCOUNT
                default: false
                systemManaged: false
                created: '2026-11-20T10:15:30.123Z'
                modified: '2026-11-20T10:15:30.123Z'
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '409':
      description: >-
        Conflict - Returned if a subtype with the same technical name already exists for the source.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:source-subtypes:create
  - applicationAuth:
    - idn:source-subtypes:create
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
