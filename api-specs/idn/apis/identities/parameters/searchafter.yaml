in: query
name: searchAfter
description: >-
  Used to begin the search window at the values specified.


  This parameter consists of the last values of the sorted fields in the current record set.


  searchAfter length must match the number of sorters.


  This is used to page beyond the offset limit of 10,000 records by shifting the search window to begin at this value.


  `searchAfter` cannot be combined with `offset`. When `searchAfter` is provided, `id` must be included in `sorters`.


  It is recommended that you always include the ID of the object in addition to any other sort fields in order to
  ensure you don't get duplicate results while paging.


  For example, if you are sorting by name you will also want to include ID, for example
  searchAfter=John Mathews,01f04e428c484542a241dc89c303b178&sorters=name,id.


  Refer to [Paginating Search
  Queries](https://developer.sailpoint.com/docs/api/standard-collection-parameters#paginating-search-queries) for more
  information about how to implement `searchAfter` paging.
required: false
example: John Mathews,01f04e428c484542a241dc89c303b178
schema:
  type: string
  format: comma-separated
style: form
explode: true
