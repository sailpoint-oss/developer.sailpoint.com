get:
  operationId: getIdentityV2
  tags:
  - Identities
  summary: Identity details (search)
  description: >-
    This API returns a single identity from the identities search index.


    `privilegeLevel.effective` is `HIGH`, `MEDIUM`, `LOW`, or `NONE`. An identity with no privilege level is returned
    as `NONE`. `privilegeLevel` is null when the `IDNARC_ENABLE_IDENTITY_EFFECTIVE_PRIVILEGE` feature flag is
    disabled. Comparisons on `privilegeLevel.effective` are case-insensitive, and returned values are uppercase.
  security:
  - userAuth:
    - idn:identity:read
    - idn:identity-self:read
  - applicationAuth:
    - idn:identity:read
    - idn:identity-self:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listIdentitiesV2
    description: Identity Id
    example: 01f04e428c484542a241dc89c303b178
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: An identity object
      content:
        application/json:
          schema:
            $ref: ../schemas/identityv2.yaml
          example:
            id: 01f04e428c484542a241dc89c303b178
            name: John Mathews
            alias: john.mathews
            type: HUMAN
            emailAddress: john.mathews@example.com
            identityStatus: ACTIVE
            processingState: OK
            protected: false
            correlated: true
            inactive: false
            isManager: true
            locked: false
            disabled: false
            manager:
              id: 2c4180a46faadee4016fb4e018c20626
              name: Robert Robinson
              type: IDENTITY
            lifecycleState:
              stateName: active
              manuallyUpdated: false
            created: '2023-01-03T21:16:22.432Z'
            modified: '2023-01-03T21:16:22.432Z'
            synced: '2023-01-03T21:16:22.432Z'
            lastRefresh: '2020-11-22T15:42:31.123Z'
            privilegeLevel:
              effective: NONE
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
