get:
  operationId: getIntelIdentityCapabilitiesV1
  x-sailpoint-lint-ignore:
    path-list-operations-must-return-object: Intelligence child list endpoints return a bare JSON array; matches the NHI accounts pagination contract.
    path-429-responses-must-define-rate-limit-headers: Reuses apis/shared/responses/429.yaml; gateway enforces rate-limit response headers.
  security:
  - userAuth:
    - sp:identity-sec-intel:read
  - applicationAuth:
    - sp:identity-sec-intel:read
  x-required-right: sp:identity-sec-intel:read
  x-sailpoint-userLevels:
  - Any
  tags:
  - Intelligence
  summary: List NHI capabilities
  description: |
    Requires tenant license idn:response-and-remediation.

    Lists linked capabilities for one non-human identity (NHI). Required query parameter `type`
    selects the kind: `mcp`, `tool`, or `skill`. Do not send `isNHI`.

    Returns one page of capabilities as a JSON array. Each element includes the capability id,
    display name, kind (`MCP`, `TOOL`, or `SKILL`), and source name. An empty array is a valid page.

    Send `count=true` to receive the `x-total-count` response header (including `0` on empty pages).

    Returns **404** when the identity is unknown or linked capabilities are not available for this identity.
  parameters:
  - $ref: ../parameters/intelligence-identity-id-path.yaml
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - $ref: ../parameters/intelligence-nhi-capability-type.yaml
  responses:
    '200':
      description: One page of linked capabilities for the requested kind.
      headers:
        x-total-count:
          description: Total count for this kind. Present when `count=true` was sent (including `0` on empty pages).
          schema:
            type: integer
            format: int32
            minimum: 0
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/intelnhicapabilitywire.yaml
          example:
          - id: 7c2a9e14-6b3f-4d18-9a27-0e5f8c1b4d63
            name: example inventory tool
            type: TOOL
            sourceName: Example Source
          - id: 3f8b1c62-91e4-4a7d-b2c0-6d5e4f3a8b19
            name: example access tool
            type: TOOL
            sourceName: Example Source
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
