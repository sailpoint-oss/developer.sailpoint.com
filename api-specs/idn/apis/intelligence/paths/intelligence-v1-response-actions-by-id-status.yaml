get:
  operationId: getResponseActionStatusV1
  security:
  - userAuth:
    - sp:identity-sec-intel:read
  - applicationAuth:
    - sp:identity-sec-intel:read
  x-required-right: sp:identity-sec-intel:read
  x-sailpoint-userLevels:
  - Any
  tags:
  - Intelligence
  summary: Get response action status
  description: |
    Requires tenant license idn:response-and-remediation.

    Returns the current aggregate status of a previously submitted response action, identified by
    the requestId returned from POST /intelligence/v1/response-actions.

    Supported actionType values: DISABLE_IDENTITY, DISABLE_ACCOUNT.
  parameters:
  - name: id
    in: path
    required: true
    description: The requestId of the response action to look up.
    x-sailpoint-resource-operation-id: createResponseActionV1
    schema:
      type: string
      minLength: 1
      maxLength: 128
    example: 3f1e6c9a-8b2d-4e5f-9a1b-2c3d4e5f6a7b
  responses:
    '200':
      description: The current status of the response action.
      content:
        application/json:
          schema:
            $ref: ../schemas/response-action-status.yaml
          example:
            requestId: 3f1e6c9a-8b2d-4e5f-9a1b-2c3d4e5f6a7b
            actionType: DISABLE_ACCOUNT
            status: SUBMITTED
            submittedAt: '2026-08-07T10:15:30Z'
            updatedAt: '2026-08-07T10:15:30Z'
    '400':
      description: Invalid path parameter.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      description: No response action exists for the supplied requestId.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      description: Internal or upstream server failure.
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
