type: object
nullable: true
description: |
  Overall risk level for this non-human identity. Null when the identity is not scored
  (for example, risk is not licensed, scoring is not yet available, or the identity was removed).
properties:
  severity:
    type: string
    description: Risk band for the identity.
    enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    example: HIGH
  lastModified:
    type: string
    format: date-time
    description: When the risk level last changed. Omitted when not available.
    example: '2026-10-10T16:48:51.866993644Z'