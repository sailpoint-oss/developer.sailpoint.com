post:
  operationId: startEntitlementConnectionConversionV1
  tags:
  - JIT Activation Convert
  summary: Convert entitlement connection assignment type
  description: |
    Initiates an asynchronous workflow to convert the assignment type of an entitlement connection
    between `STANDING` and `JIT` (Just-In-Time Privileged).

    The response is returned with HTTP 202 Accepted while the conversion workflow initializes.
  security:
  - userAuth:
    - idn:jit-assignment-type-conversion:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/convertentitlementconnectionrequest.yaml
  responses:
    '202':
      description: |
        Accepted. The conversion workflow was accepted and is running.
      content:
        application/json:
          schema:
            $ref: ../schemas/convertentitlementconnectionresponse.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
