info:
  title: Identity Security Cloud API - Launchers
  description: >-
    Use these APIs to interact with the Identity Security Cloud platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Launchers
    description: >
      Use this API to manage Launchers.


      A launcher lets users start a workflow on demand from Identity Security Cloud, such as a Privileged Workflow or a
      workflow that creates an Active Directory group. Each launcher references a workflow. Launching it starts an
      interactive process that runs that workflow for the user who launched it, and the response returns the ID of
      that interactive process.


      Users can launch only the launchers assigned to them, and only while the launcher is enabled.


      A launcher's enabled state follows the workflow it references. When the workflow is disabled, the launcher is
      disabled, and when the workflow is enabled again, the launcher is enabled again. If the referenced workflow is
      deleted, the reference is removed from the launcher.


      Launcher names must be unique within a tenant, and a tenant can have up to 100 launchers.
paths:
  /launchers/v1:
    $ref: ./paths/launchers-v1.yaml
  /launchers/v1/{launcherID}:
    $ref: ./paths/launchers-v1-by-launcherid.yaml
  /launchers/v1/{launcherID}/launch:
    $ref: ./paths/launchers-v1-by-launcherid-launch.yaml
security:
  - userAuth:
      - sp:scopes:all
