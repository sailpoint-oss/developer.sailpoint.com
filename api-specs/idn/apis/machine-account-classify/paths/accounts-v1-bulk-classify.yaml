post:
  operationId: sendBulkClassifyMachineAccountsV1
  tags:
  - Machine Account Classify
  summary: Classify multiple machine accounts
  security:
  - userAuth:
    - idn:accounts:classify
  - applicationAuth:
    - idn:accounts:classify
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  description: |-
    Use this API to classify up to 250 accounts in one request.
    The response lists a result for each requested account, with its own status code, so some accounts can succeed while others fail.
    A token with API, ORG_ADMIN, SOURCE_ADMIN, or SOURCE_SUBADMIN authority is required to call this API.
    When machine account classification is not enabled for the tenant, this API returns `404`.
  parameters:
  - $ref: ../parameters/classificationmode.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/bulkclassifymachineaccountsrequest.yaml
  responses:
    '207':
      description: Classification result for each requested account.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/bulkclassifymachineaccountresult.yaml
          example:
          - id: ef38f94347e94562b5bb8424a56397d8
            status: 200
            isMachine: true
            message: Account classified successfully
          - id: 2c9180835d191a86015d28455b4a2329
            status: 404
            isMachine: false
            message: Account is not valid
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
