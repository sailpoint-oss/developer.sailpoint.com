type: object
title: Bulk Classify Machine Account Result
description: Classification result for one account in a bulk classify request.
properties:
  id:
    type: string
    description: Account ID from the request.
    example: ef38f94347e94562b5bb8424a56397d8
  status:
    type: integer
    format: int32
    description: >-
      HTTP status code for this account. `200` means the account was classified, `404` means the account was not found,
      and other codes describe why classification failed.
    example: 200
  isMachine:
    type: boolean
    default: false
    description: Indicates if the account is classified as machine. `false` when classification did not succeed.
    example: true
  message:
    type: string
    description: Result message for this account.
    example: Account classified successfully
