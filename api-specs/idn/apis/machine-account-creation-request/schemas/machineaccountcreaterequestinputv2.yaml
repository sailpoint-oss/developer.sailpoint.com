type: object
title: Machine Account Create Request Input V2
description: >-
  Contains the information for processing a user-initiated machine account creation request. Adds a target source and
  per-entitlement request details to the v1 request.
required:
  - subtypeId
  - ownerIdentityId
properties:
  subtypeId:
    type: string
    description: >-
      Subtype ID for which machine account create is enabled and user have the entitlement to create the machine
      account.
    example: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
  sourceId:
    type: string
    description: >-
      ID of the source to create the machine account on. The subtype must be available on this source. Required when
      subtypes can be configured per source for the tenant; otherwise it is ignored and the subtype's own source is
      used.
    example: 2c9180835d191a86015d28455b4a2329
  formId:
    type: string
    description: Form ID selected by user for the machine account create request.
    example: f5dd23fe-3414-42b7-bb1c-869400ad7a10
  ownerIdentityId:
    type: string
    description: Owner Identity ID. This identity will be assigned as an owner of the created machine account.
    example: 18104e7e499b4e23882d6323344ab6bc
  machineIdentityId:
    type: string
    nullable: true
    description: >-
      Machine identity to correlate with the created machine account. If not provided, a new machine identity will be
      created.
    example: 6d28b7c1-620c-49c6-b6d5-cbf81eb4b5fa
  environment:
    type: string
    description: Environment type to use for the machine account.
    example: Dev
  description:
    type: string
    description: Description for the machine account.
    example: Requesting machine account for tracking the inventory.
  userInput:
    type: object
    description: Fields of the form linked to the subtype in approval settings.
    example:
      target: AD Source
      description: Inventory tracking
  entitlements:
    type: array
    description: >-
      Entitlements to request for the created machine account, each with an optional comment, start date, and remove
      date. Duplicate IDs are ignored and up to 20 unique entitlements are allowed. Use either `entitlements` or
      `entitlementIds`, depending on which one your tenant supports; sending a non-empty list that your tenant does
      not support returns `400`.
    items:
      $ref: ./machineaccountcreateentitlement.yaml
    example:
      - id: 2c91808a7624751a01762f19d67c220e
        comment: Needed to read the inventory share.
        startDate: '2026-11-01T00:00:00Z'
        removeDate: '2027-11-01T00:00:00Z'
  entitlementIds:
    type: array
    description: >-
      List of entitlement IDs to provision for created machine account. Up to 20 unique entitlements are allowed. Use
      either `entitlements` or `entitlementIds`, depending on which one your tenant supports; sending a non-empty list
      that your tenant does not support returns `400`.
    items:
      type: string
    example:
      - 6d28b7c1620c49c6b6d5cbf81eb4b5fa
      - 2c91808a7624751a01762f19d67c220e
