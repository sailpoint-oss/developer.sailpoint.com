get:
  operationId: getMachineAccountRecommendationV1
  tags:
    - Machine Account Recommendation
  summary: Get machine account recommendation
  description: |
    This API returns the machine account discovery recommendation for an account. The recommendation states whether
    the account is likely a machine account and lists the reasons that contributed to it.


    When no recommendation exists for the account, this API returns `200` with an empty response body.


    When machine account discovery is not enabled for the tenant, this API returns `404`.
  security:
    - userAuth:
        - idn:accounts:read
        - idn:accounts:manage
    - applicationAuth:
        - idn:accounts:read
        - idn:accounts:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
    - name: id
      in: path
      description: Account ID.
      required: true
      x-sailpoint-resource-operation-id: listAccountsV1
      schema:
        type: string
      example: 2c9180835d2e5168015d32f890ca1581
  responses:
    '200':
      description: Machine account recommendation for the account.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountrecommendation.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
