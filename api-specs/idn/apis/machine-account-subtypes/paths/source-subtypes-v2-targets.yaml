get:
  operationId: listSourceSubtypeTargetsV2
  tags:
  - Machine Account Subtypes
  summary: List subtype targets
  description: |-
    List the targets that have machine account subtypes, with subtype and source counts for each.

    A `targetType` filter is required. `targetType eq "CONNECTOR"` returns one item per connector type.
    `targetType eq "SOURCE"` returns one item per source subtype. A missing or unsupported `targetType` filter returns
    `400`.

    The caller needs the `idn:source-subtypes:read` right.

    This API returns `404` when Machine Identity Security or tiered subtype configuration is not enabled for the tenant.
  security:
  - userAuth:
    - idn:sources:read
    - idn:sources:manage
    - idn:connector-subtypes:manage
  - applicationAuth:
    - idn:sources:read
    - idn:sources:manage
    - idn:connector-subtypes:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    required: true
    schema:
      type: string
    example: targetType eq "CONNECTOR"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **targetType**: *eq*


      **targetName**: *eq, sw*


      A `targetType` filter with the value `CONNECTOR` or `SOURCE` is required.
  - in: query
    name: sorters
    required: false
    schema:
      type: string
      format: comma-separated
    example: -subtypeCount
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **targetType, targetName, subtypeCount, sourceCount**


      Results are sorted by **targetName** ascending by default.
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: List of subtype targets. The `X-Total-Count` header is returned when `count=true`.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/subtypetargetsummary.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
