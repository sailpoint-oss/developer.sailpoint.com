get:
  operationId: listSourceSubtypesV2
  tags:
  - Machine Account Subtypes
  summary: List subtypes
  description: |-
    List machine account subtypes defined at the source tier and the connector tier.

    Without `sourceId`, the API lists every subtype in the tenant, and `filters` and `sorters` apply.

    With `sourceId`, the API returns the source's effective subtypes: the subtypes defined for the source plus the
    subtypes defined for the source's connector type. When a source subtype has the same technical name as a connector
    subtype, only the source subtype is returned and its `origin` is `CONNECTOR`. `filters` cannot be used in this mode.
    Use `targetType` to return only one tier of the effective set. An unknown `sourceId` returns `404`.

    With `sourceId` and `effectiveSet=false`, the API returns only the subtypes defined for that source, and `filters`
    apply.

    The caller needs the `idn:source-subtypes:read` right.

    This API returns `404` when Machine Identity Security or tiered subtype configuration is not enabled for the tenant.
  security:
  - userAuth:
    - idn:sources:read
    - idn:sources:manage
    - idn:connector-subtypes:manage
  - applicationAuth:
    - idn:sources:read
    - idn:sources:manage
    - idn:connector-subtypes:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: query
    name: sourceId
    required: false
    schema:
      type: string
    description: ID of a source. When supplied, the API returns subtypes for that source instead of the whole tenant.
    example: 6d0458373bec4b4b80460992b76016da
  - in: query
    name: effectiveSet
    required: false
    schema:
      type: boolean
      default: true
    description: >-
      Controls what is returned for `sourceId`. When `true`, which is the default when `sourceId` is supplied, the
      API returns the source's effective subtypes across both tiers. When `false`, the API returns only the subtypes
      defined for the source. Passing `effectiveSet=true` explicitly without `sourceId` returns `400`.
    example: true
  - in: query
    name: targetType
    required: false
    schema:
      type: string
      enum:
      - SOURCE
      - CONNECTOR
    description: >-
      Returns only effective subtypes of this tier. Requires `sourceId`, and cannot be combined with
      `effectiveSet=false`; otherwise the API returns `400`.
    example: CONNECTOR
  - in: query
    name: includeConfigs
    required: false
    schema:
      type: boolean
      default: false
    description: When `true`, each item includes a summary of its machine account creation configuration in `config`.
    example: false
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    required: false
    schema:
      type: string
    example: targetType eq "CONNECTOR"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, ne, in*


      **technicalName**: *eq, ne, in, sw, co*


      **displayName**: *eq, ne, in, sw, co*


      **source.id**: *eq, ne, in, sw, co*


      **targetType**: *eq, ne, in, sw, co*


      **targetId**: *eq, ne, in, sw, co*


      **targetName**: *eq, ne, in, sw, co, isnull*


      **classification**: *eq, ne, in, sw, co*


      **type**: *eq, ne, in, sw, co*


      **created**: *gt, ge, lt, le*


      **modified**: *gt, ge, lt, le*


      Filters cannot be used with `sourceId` unless `effectiveSet=false`; otherwise the API returns `400`.
  - in: query
    name: sorters
    required: false
    schema:
      type: string
      format: comma-separated
    example: displayName
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **id, technicalName, displayName, source.id, targetType,
      targetId, targetName, classification, type, created, modified**
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: >-
        List of machine account subtypes. Items include `config` when `includeConfigs=true`. The `X-Total-Count`
        header is returned when `count=true`.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/sourcesubtypev2withconfig.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  operationId: createSourceSubtypeV2
  tags:
  - Machine Account Subtypes
  summary: Create subtype
  description: |-
    Create a machine account subtype at the source tier or the connector tier.

    A `SOURCE` subtype applies to the one source identified by `targetId`. A `CONNECTOR` subtype applies to every
    source of the connector type identified by `targetId`, which must be a registered connector type. `targetType`
    defaults to `SOURCE`. `CONNECTOR_VARIANT` is not supported and returns `400`. `technicalName`, `displayName` and
    `description` are required, and the technical name and display name must be unique within the tier's scope.

    Who can call this API depends on the requested tier:

    * `SOURCE` (or omitted): requires the `idn:source-subtypes:create` right, held by org admins, source admins and
    source sub-admins.

    * `CONNECTOR`: requires the `idn:connector-subtypes:create` right, held by org admins.

    A caller without the right for the requested tier receives `404`, not `403`.

    This API returns `404` when Machine Identity Security or tiered subtype configuration is not enabled for the tenant.
  security:
  - userAuth:
    - idn:sources:manage
    - idn:connector-subtypes:manage
  - applicationAuth:
    - idn:sources:manage
    - idn:connector-subtypes:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/createsourcesubtypev2request.yaml
        examples:
          Connector subtype:
            value:
              targetType: CONNECTOR
              targetId: active-directory
              technicalName: service-account
              displayName: Service Account
              description: Accounts used by automated services.
          Source subtype:
            value:
              targetType: SOURCE
              targetId: 6d0458373bec4b4b80460992b76016da
              technicalName: batch-account
              displayName: Batch Account
              description: Accounts used by batch jobs.
  responses:
    '201':
      description: Created machine account subtype.
      content:
        application/json:
          schema:
            $ref: ../schemas/sourcesubtypev2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
