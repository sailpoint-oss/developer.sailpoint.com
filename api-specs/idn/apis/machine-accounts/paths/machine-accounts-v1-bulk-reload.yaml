post:
  operationId: reloadMachineAccountsInBulkV1
  tags:
  - Machine Accounts
  summary: Reload machine accounts in bulk
  description: |
    Use this API to reload up to 100 machine accounts from their sources. The response has one result per requested machine account, in no particular order. Each result has its own HTTP-style `status`: `200` when the reload was queued, or an error status such as `400`, `404` or `500`.

    To track the whole reload with a single task instead, use the asynchronous bulk reload API.

    The request fails with `400` when `ids` is empty or has more than 100 entries.

    A caller who owns the machine accounts can reload them. Other callers need the **idn:mis-account:reload** right. For a caller without the right, machine accounts they do not own get a result with status `404`.

    When this capability is not enabled for the tenant, this API returns `403`.
  security:
  - userAuth:
    - idn:mis-account-state:manage
  - applicationAuth:
    - idn:mis-account-state:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/machineaccountbulkrequest.yaml
  responses:
    '207':
      description: One result per requested machine account.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineaccountbulkresult.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
