get:
  operationId: getMachineAccountEntitlementsV1
  tags:
  - Machine Accounts
  summary: List machine account entitlements
  description: |
    Use this API to list the entitlements held by a machine account. Use `limit` and `offset` to page through the results.

    This API requires the **idn:mis-account:read** right. Owning the machine account is not enough.

    When this capability is not enabled for the tenant, this API returns `403`.
  security:
  - userAuth:
    - idn:mis-account:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listMachineAccountsV1
    description: Machine Account ID.
    example: ef38f94347e94562b5bb8424a56397d8
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: List of the machine account's entitlements.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineaccountentitlement.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
