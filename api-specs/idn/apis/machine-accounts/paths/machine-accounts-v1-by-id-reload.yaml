post:
  operationId: reloadMachineAccountV1
  tags:
  - Machine Accounts
  summary: Reload machine account
  description: |
    This API asynchronously reloads the machine account directly from the connector and performs a one-time aggregation. It returns the task ID.

    A caller who owns the machine account can reload it. Other callers need the **idn:mis-account:reload** right.
  security:
  - userAuth:
    - idn:mis-account:reload
  - applicationAuth:
    - idn:mis-account:reload
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listMachineAccountsV1
    description: Machine Account ID.
    example: ef38f94347e94562b5bb8424a56397d8
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '202':
      description: Async task details.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountsasyncresult.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
