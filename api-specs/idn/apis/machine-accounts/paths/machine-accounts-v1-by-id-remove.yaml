post:
  operationId: deleteMachineAccountAsyncV1
  tags:
  - Machine Accounts
  summary: Remove machine account
  description: |
    Use this API to remove a machine account from Identity Security Cloud. The source account is left unchanged, and a removed machine account can be re-created during the next aggregation. The response returns the task ID.

    This endpoint is intended for:

    * Removing machine accounts that no longer exist on the source.

    * Removing machine accounts that will not be aggregated after a source configuration change.

    * Forcing machine accounts to be re-created on the next aggregation so account processing can run again.

    A caller who owns the machine account can remove it. Other callers need the **idn:mis-account:remove** right.
  security:
  - userAuth:
    - idn:mis-account:remove
  - applicationAuth:
    - idn:mis-account:remove
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listMachineAccountsV1
    description: Machine Account ID.
    example: ef38f94347e94562b5bb8424a56397d8
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '202':
      description: Async task details.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountsasyncresult.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
