get:
  operationId: getMachineAccountsSummaryV1
  tags:
  - Machine Accounts
  summary: Get machine account candidate summary
  description: |
    Use this API to count the machine account candidates that are not yet linked to a machine identity, grouped by the classification method that found them. Candidates that are correlated to a human identity are counted in `human`; candidates that are not correlated to any identity are counted in `uncorrelated`.

    This API requires the **idn:mis-account-list:read** right.
  security:
  - userAuth:
    - idn:mis-account:read
    - idn:mis-account:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: query
    name: filters
    required: false
    schema:
      type: string
    example: source.id eq "8d3e0094e99445de98eef6c75e25jc04"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **source.id**: *eq, in*


      Filtering on any other field returns `400`.
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: Machine account candidate counts.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountssummary.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
