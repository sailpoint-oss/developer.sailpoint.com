get:
  operationId: getMachineAccountV2
  tags:
  - Machine Accounts
  summary: Get machine account details
  description: |
    Use this API to get the details of a machine account, including all of its linked machine identities.

    A caller who owns the machine account can get it. Other callers need the **idn:mis-account:read** right.

    When this capability is not enabled for the tenant, this API returns `403`.
  security:
  - userAuth:
    - idn:mis-account:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listMachineAccountsV2
    description: Machine Account ID.
    example: ef38f94347e94562b5bb8424a56397d8
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: Machine account object.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountv2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
patch:
  operationId: updateMachineAccountV2
  tags:
  - Machine Accounts
  summary: Update machine account details
  description: |
    Use this API to update a machine account with a [JSON Patch](https://tools.ietf.org/html/rfc6902) document. The response is the updated machine account.

    A caller who owns the machine account can update it. Other callers need the **idn:mis-account:update** right.

    When this capability is not enabled for the tenant, this API returns `403`.
  security:
  - userAuth:
    - idn:mis-account:manage
  - applicationAuth:
    - idn:mis-account:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    x-sailpoint-resource-operation-id: listMachineAccountsV2
    description: Machine Account ID.
    example: ef38f94347e94562b5bb8424a56397d8
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    description: >-
      A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard. The following fields are
      patchable:
                * description
                * environment
                * accessType
                * attributes
                * manuallyEdited
                * ownerIdentity
                * subtype
                * machineIdentities
                * owners

      Non-dataset accounts may patch ownerIdentity, subtype, and machineIdentities. Dataset accounts may patch owners.
      When expanded ownership is enabled, non-dataset accounts may also patch owners, and dataset accounts may also patch ownerIdentity.
      Patching ownerIdentity and owners in the same request returns `400`.


      To change the machine identity, use a single `replace` operation on `/machineIdentities` whose value is a
      list of exactly one machine identity reference with its `id`. The `/machineIdentity` path, indexed or nested
      paths such as `/machineIdentities/0`, other operations on `/machineIdentities`, and a value that is not a
      one-element list all return `400`.


      All other fields, including `risk`, `permissionLevel`, `compliance`, and `lastUsedAt`, are read-only. A patch
      that changes one of them returns `400`.
    content:
      application/json-patch+json:
        schema:
          type: array
          items:
            $ref: ../../shared/schemas/jsonpatchoperation.yaml
        examples:
          Replace environment:
            value:
            - op: replace
              path: /environment
              value: test
          Remove description:
            value:
            - op: remove
              path: /description
          Replace machine identity:
            value:
            - op: replace
              path: /machineIdentities
              value:
              - id: 3fa85f6457174562b3fc2c963f66afa6
      application/json:
        schema:
          type: array
          items:
            $ref: ../../shared/schemas/jsonpatchoperation.yaml
  responses:
    '200':
      description: Updated machine account object.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineaccountv2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
