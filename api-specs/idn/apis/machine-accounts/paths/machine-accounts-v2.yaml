get:
  operationId: listMachineAccountsV2
  tags:
  - Machine Accounts
  summary: List machine accounts
  description: |
    Use this API to get a list of machine accounts. By default, the list includes machine accounts that are linked to a machine identity or to a source resource.

    When the whole filter is a single comparison on `machineIdentity.id` or `machineIdentity.name`, the list also includes machine accounts linked to the matching machine identities through source resource links.

    A caller without the **idn:mis-account-list:read** right can call this API only when every returned machine account is one they own; otherwise this API returns `403`. Use `ownerIdentity=self` to list only the caller's own machine accounts.

    When this capability is not enabled for the tenant, this API returns `403`.
  security:
  - userAuth:
    - idn:mis-account:read
    - idn:mis-account:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: ownerIdentity
    required: false
    schema:
      type: string
    example: self
    description: >-
      Return only machine accounts whose owner identity is this identity ID. Use `self` for the caller's
      own identity. This parameter can't be combined with a filter on `ownerIdentity.id`; that combination
      returns `400`.
  - in: query
    name: filters
    required: false
    schema:
      type: string
    example: machineIdentity.id eq "2c9180858082150f0180893dbaf44201"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, in, sw*


      **nativeIdentity**: *eq, in, sw*


      **uuid**: *eq, in*


      **description**: *eq, in, sw*


      **machineIdentity.id**: *eq, in*


      **machineIdentity.name**: *eq, in, sw*


      **subtype.technicalName**: *eq, in, sw*


      **subtype.displayName**: *eq, in, sw*


      **accessType**: *eq, in, sw*


      **environment**: *eq, in, sw*


      **ownerIdentity**: *eq, in*


      **ownerIdentity.id**: *eq, in*


      **ownerIdentity.name**: *eq, in, sw*


      **owners.primary.id**: *eq, in*


      **owners.primary.name**: *eq, in, sw*


      **owners.secondaryIdentity.id**: *eq, in*


      **owners.secondaryIdentity.name**: *eq, in, sw*


      **owners.governanceGroup.id**: *eq, in*


      **owners.governanceGroup.name**: *eq, in, sw*


      **manuallyCorrelated**: *eq*


      **enabled**: *eq*


      **locked**: *eq*


      **hasEntitlements**: *eq*


      **attributes**: *eq*


      **connectorAttributes**: *eq*


      **source.id**: *eq, in*


      **source.name**: *eq, in, sw*


      **datasetId**: *eq, in*


      **resource.id**: *eq, in*


      **type**: *eq, in*


      **created**: *eq, gt, lt, ge, le*


      **modified**: *eq, gt, lt, ge, le*


      **risk.severity**: *eq, in*


      **permissionLevel**: *eq, in*


      **lastUsedAt**: *gt, lt, ge, le*


      Use `me` as the value of `ownerIdentity.id` to match the caller's own identity.


      The `owners.*` fields are available only when expanded machine account ownership is enabled for the
      tenant. The `risk.severity`, `permissionLevel` and `lastUsedAt` fields are available only when
      machine account risk enrichment is enabled for the tenant. Filtering on an unavailable field returns
      `400`.
  - in: query
    name: sorters
    required: false
    style: form
    explode: true
    schema:
      type: string
      format: comma-separated
    example: id,name
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **id, name, nativeIdentity, uuid, description,
      machineIdentity.id, machineIdentity.name, subtype.technicalName, subtype.displayName, accessType,
      environment, ownerIdentity, ownerIdentity.id, ownerIdentity.name, owners.primary.id, owners.primary.name,
      owners.secondaryIdentity.id, owners.secondaryIdentity.name, owners.governanceGroup.id,
      owners.governanceGroup.name, manuallyCorrelated, enabled, locked, hasEntitlements, attributes,
      connectorAttributes, source.id, source.name, datasetId, resource.id, type, created, modified,
      risk.severity, permissionLevel, lastUsedAt**


      The same availability rules as for `filters` apply to the `owners.*`, `risk.severity`,
      `permissionLevel` and `lastUsedAt` fields. `risk.severity` sorts by rank (UNKNOWN, LOW, MEDIUM, HIGH,
      CRITICAL), not alphabetically.
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: List of machine accounts.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineaccountv2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
