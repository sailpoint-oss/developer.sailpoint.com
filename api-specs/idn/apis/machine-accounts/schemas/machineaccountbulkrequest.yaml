type: object
title: Machine Account Bulk Request
description: The machine accounts to process in a bulk operation.
required:
- ids
properties:
  ids:
    type: array
    description: IDs of the machine accounts to process. Provide between 1 and 100 IDs.
    minItems: 1
    maxItems: 100
    items:
      type: string
      maxLength: 128
    example:
    - ef38f94347e94562b5bb8424a56397d8
    - 2c9180835d2e5168015d32f890ca1581
