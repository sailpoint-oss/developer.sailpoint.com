type: object
title: Machine Account Bulk Update Request
description: The machine accounts to update and the JSON Patch to apply to each of them.
required:
- ids
- jsonPatch
properties:
  ids:
    type: array
    description: IDs of the machine accounts to update. Provide between 1 and 100 IDs.
    minItems: 1
    maxItems: 100
    items:
      type: string
      maxLength: 128
    example:
    - ef38f94347e94562b5bb8424a56397d8
    - 2c9180835d2e5168015d32f890ca1581
  jsonPatch:
    type: array
    description: >-
      [JSON Patch](https://tools.ietf.org/html/rfc6902) operations to apply to every machine account in `ids`.
      Each operation must target one of these top-level fields: `description`, `subtype`, `environment`,
      `machineIdentity`, `ownerIdentity`, `manuallyEdited`.
    items:
      $ref: ../../shared/schemas/jsonpatchoperation.yaml
    example:
    - op: replace
      path: /environment
      value: PROD
