title: Machine Account V2
type: object
description: >-
  A machine account. Machine identities are returned as the `machineIdentities` list, which includes the machine
  identity the account is directly linked to and machine identities linked to the account through its source
  resource.
allOf:
- $ref: ../../shared/schemas/basecommondto.yaml
- type: object
  properties:
    machineIdentities:
      type: array
      description: The machine identities linked to this machine account. The list is empty when there are none.
      items:
        type: object
        properties:
          type:
            type: string
            description: The reference type.
            enum:
            - MACHINE_IDENTITY
            example: MACHINE_IDENTITY
          id:
            type: string
            description: ID of the machine identity.
            example: 1540e5a4-6c2e-4bf1-b88e-c08cae0696e9
          name:
            type: string
            description: The display name of the machine identity.
            example: SVC_ADService
          subtype:
            type: string
            nullable: true
            description: The subtype of the machine identity.
            enum:
            - AI_AGENT
            - APPLICATION
            - DEVICE
            example: APPLICATION
      example:
      - type: MACHINE_IDENTITY
        id: 1540e5a4-6c2e-4bf1-b88e-c08cae0696e9
        name: SVC_ADService
        subtype: APPLICATION
    description:
      type: string
      nullable: true
      description: The description of the machine account.
      example: Service account for Active Directory
    nativeIdentity:
      type: string
      description: The unique ID of the machine account generated by the source system.
      example: '552775'
    uuid:
      type: string
      nullable: true
      description: The unique ID of the account as determined by the account schema.
      example: '{b0dce506-d6d4-44d2-8a32-d9a5b21fb175}'
    ownerIdentity:
      description: The identity that owns this machine account.
      nullable: true
      allOf:
      - $ref: ../../shared/schemas/basereferencedto.yaml
      example:
        id: 2c918084660f45d6016617daa9210584
        type: IDENTITY
        name: Adam Kennedy
    owners:
      type: object
      nullable: true
      description: >-
        The owners of the machine account: a primary owner plus secondary owners, which are either up to ten
        identities or one governance group.
      properties:
        primary:
          description: The identity selected as the primary owner.
          allOf:
          - $ref: ../../shared/schemas/basereferencedto.yaml
          example:
            id: 2c918084660f45d6016617daa9210584
            type: IDENTITY
            name: Adam Kennedy
        secondary:
          type: array
          maxItems: 10
          description: >-
            The secondary owners. Entries are either up to ten identities (type `IDENTITY`) or one governance group
            (type `GOVERNANCE_GROUP`), not both.
          items:
            $ref: ../../shared/schemas/basereferencedto.yaml
          example:
          - id: 2c9180858082150f0180893dbaf44202
            type: IDENTITY
            name: Jane Doe
    subtype:
      type: object
      nullable: true
      description: The machine account subtype assigned to this machine account.
      properties:
        id:
          type: string
          description: ID of the subtype.
          example: 43bdd144-4b17-4fce-a744-17c7fd3e717b
        technicalName:
          type: string
          description: The technical name of the subtype.
          example: serviceAccount
        displayName:
          type: string
          description: The display name of the subtype.
          example: Service Account
    accessType:
      type: string
      nullable: true
      description: The connection type of the source this account is from.
      example: direct
    environment:
      type: string
      nullable: true
      description: The environment of the machine account.
      example: TEST
    attributes:
      type: object
      nullable: true
      additionalProperties: true
      description: Custom attributes specific to the machine account.
      example:
        firstName: SailPoint
        lastName: Support
    connectorAttributes:
      type: object
      nullable: true
      additionalProperties: true
      description: The connector attributes for the account.
      example:
        mail: machine-178@sailpoint.com
        givenName: Support
    classificationMethod:
      type: string
      nullable: true
      description: How the account was classified as a machine account.
      enum:
      - CRITERIA
      - SOURCE
      - DISCOVERY
      - MANUAL
      - MANUALLY_UNCLASSIFIED
      example: SOURCE
    manuallyEdited:
      type: boolean
      default: false
      description: Indicates whether the machine account has been manually edited.
      example: false
    manuallyCorrelated:
      type: boolean
      default: false
      description: Indicates whether the account has been manually correlated to an identity.
      example: false
    enabled:
      type: boolean
      default: false
      description: Indicates whether the account is enabled.
      example: true
    locked:
      type: boolean
      default: false
      description: Indicates whether the account is currently locked.
      example: false
    hasEntitlements:
      type: boolean
      default: false
      description: Indicates whether the account has entitlements.
      example: true
    source:
      description: The source this machine account belongs to.
      allOf:
      - $ref: ../../shared/schemas/basereferencedto.yaml
      example:
        id: 8d3e0094e99445de98eef6c75e25jc04
        type: SOURCE
        name: Active Directory
    resource:
      type: object
      nullable: true
      description: The source resource the machine account is derived from. Null when the account has no source resource.
      properties:
        id:
          type: string
          description: The source resource identifier.
          example: 8886e5e3-63d0-462f-a195-d98da885b8dc
        type:
          type: string
          description: The type of the source resource.
          example: aws:iam-role
        name:
          type: string
          nullable: true
          description: The display name of the source resource.
          example: nightly-batch-role
        features:
          type: array
          nullable: true
          description: The features supported by the source resource.
          items:
            type: string
          example:
          - PROVISIONING
          - AUTHENTICATION
    datasetId:
      type: string
      nullable: true
      description: ID of the dataset the machine account was aggregated from. Null for accounts that were not aggregated from a dataset.
      example: aws-iam-roles
    type:
      type: string
      nullable: true
      description: The classification of the machine account.
      enum:
      - MACHINE
      - MACHINE_DATASET
      - CANDIDATE
      - CANDIDATE_BY_SOURCE
      - DISCOVERED
      - AGENT
      example: MACHINE
    accountType:
      type: string
      nullable: true
      deprecated: true
      description: Deprecated. Use `type`, which always has the same value.
      enum:
      - MACHINE
      - MACHINE_DATASET
      - CANDIDATE
      - CANDIDATE_BY_SOURCE
      - DISCOVERED
      - AGENT
      example: MACHINE
    risk:
      type: object
      readOnly: true
      nullable: true
      description: >-
        Risk for this machine account, set by enrichment. Null when no risk has been recorded or when risk
        enrichment is not enabled for the tenant. Read-only.
      properties:
        score:
          type: number
          format: double
          nullable: true
          description: Risk score from 0 to 100. Null when only a severity has been recorded.
          example: 72.5
        severity:
          type: string
          nullable: true
          description: Risk severity.
          enum:
          - UNKNOWN
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: HIGH
    permissionLevel:
      type: string
      readOnly: true
      nullable: true
      description: The permission level set by enrichment. Null when not enriched. Read-only.
      enum:
      - PRIVILEGED
      - ELEVATED
      - BASIC
      - UNKNOWN
      example: PRIVILEGED
    compliance:
      type: array
      readOnly: true
      nullable: true
      description: >-
        Compliance control IDs the machine account violates, set by enrichment. Null when not enriched; empty when
        no violations were recorded. Read-only.
      items:
        type: object
        properties:
          id:
            type: string
            nullable: true
            description: Framework control ID.
            example: SOC2-CC6.1
    lastUsedAt:
      type: string
      format: date-time
      readOnly: true
      nullable: true
      description: When the machine account was last used, set by enrichment. Null when not enriched. Read-only.
      example: '2026-03-10T21:38:25Z'
