get:
  operationId: getMachineIdentityAgentCountsV1
  tags:
  - Machine Identities
  summary: Get AI agent counts
  description: |
    This API returns tenant-wide summary counts for AI agent machine identities: the total, unsanctioned agents,
    agents discovered in the last 30 days, risk severity counts, and ownership coverage.

    When agentic risk scoring is not enabled for the tenant, `riskSeverity` is `null`. This version never counts AI
    agents that have no risk severity, so `riskSeverity.unknown` is always `null`.
  security:
  - userAuth:
    - idn:mis-identity:read
    - idn:mis-identity:manage
  - applicationAuth:
    - idn:mis-identity:read
    - idn:mis-identity:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: AI agent summary counts.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineidentityagentcounts.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
