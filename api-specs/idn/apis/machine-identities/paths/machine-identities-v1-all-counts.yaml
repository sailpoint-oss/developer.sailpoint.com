get:
  operationId: getMachineIdentityAllCountsV1
  tags:
  - Machine Identities
  summary: Get owner machine identity counts
  description: |
    This API returns the number of application machine identities, AI agent machine identities, and machine accounts
    owned by one identity, plus their total. Identify the owner with an `ownerId` filter. Use `ownerId eq "me"` for
    the caller's own counts. Requests without an `ownerId` filter return `400`.

    A caller who owns the machine identities and machine accounts can view their own counts. Other callers need the
    **idn:mis-identity:read** or **idn:mis-account:read** right.
  security:
  - userAuth:
    - idn:mis-identity:read
    - idn:mis-identity:manage
    - idn:mis-account:read
  - applicationAuth:
    - idn:mis-identity:read
    - idn:mis-identity:manage
    - idn:mis-account:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  - HELPDESK
  parameters:
  - in: query
    name: filters
    required: true
    schema:
      type: string
    example: ownerId eq "me"
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **ownerId**: *eq*


      `ownerId` is required. Use the identity ID of the owner, or `me` for the caller.
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: Machine identity and machine account counts for the owner.
      content:
        application/json:
          schema:
            $ref: ../schemas/machineidentityallcounts.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
