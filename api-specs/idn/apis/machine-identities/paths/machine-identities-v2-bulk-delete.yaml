post:
  operationId: deleteMachineIdentitiesInBulkV2
  tags:
    - Machine Identities
  summary: Bulk delete machine identities
  description: |
    This API deletes up to 100 machine identities and returns a result for each requested ID.

    The response is always `207` when the request is valid. Check the `status` of each result to see whether that
    machine identity was deleted.

    A caller who owns a machine identity can delete it. Other callers need the **idn:mis-identity:delete** right.
    For callers without that right, IDs of machine identities they do not own return a `404` result.
  security:
    - userAuth:
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/machineidentitybulkrequest.yaml
  responses:
    '207':
      description: A result for each requested machine identity ID.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineidentitybulkresult.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
