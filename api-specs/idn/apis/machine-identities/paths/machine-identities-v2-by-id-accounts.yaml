get:
  operationId: listMachineIdentityAccountsV2
  tags:
    - Machine Identities
  summary: List linked machine accounts
  description: |
    This API returns the machine accounts that are linked to a machine identity. It supports the same filters and
    sorters as the list machine accounts API, applied to the linked accounts only.

    A caller who owns the machine identity can view its linked accounts. Other callers need the
    **idn:mis-identity:read** right.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      x-sailpoint-resource-operation-id: listMachineIdentitiesV2
      description: Machine Identity ID.
      example: ef38f94347e94562b5bb8424a56397d8
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - $ref: ../../shared/parameters/count.yaml
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: hasEntitlements eq true
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **id**: *eq, in*


        **name**: *eq, in, sw*


        **nativeIdentity**: *eq, in, sw*


        **uuid**: *eq, in*


        **description**: *eq, in, sw*


        **machineIdentity.id**: *eq, in*


        **machineIdentity.name**: *eq, in, sw*


        **subtype.technicalName**: *eq, in, sw*


        **subtype.displayName**: *eq, in, sw*


        **accessType**: *eq, in, sw*


        **environment**: *eq, in, sw*


        **ownerIdentity**: *eq, in*


        **ownerIdentity.id**: *eq, in*


        **ownerIdentity.name**: *eq, in, sw*


        **manuallyCorrelated**: *eq*


        **enabled**: *eq*


        **locked**: *eq*


        **hasEntitlements**: *eq*


        **attributes**: *eq*


        **source.id**: *eq, in*


        **source.name**: *eq, in, sw*


        **created**: *eq, gt, lt, ge, le*


        **modified**: *eq, gt, lt, ge, le*


        **risk.severity**: *eq, in*


        **permissionLevel**: *eq, in*


        **lastUsedAt**: *gt, lt, ge, le*


        `risk.severity`, `permissionLevel`, and `lastUsedAt` require Entro enrichment to be enabled for the tenant.
        When it is not, those filters return `400`. `compliance` and `complianceViolationsCount` are not filter fields.
        With unknown-severity enabled, a null stored severity matches `risk.severity eq "UNKNOWN"`.
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: id,name
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **id, name, nativeIdentity, ownerIdentity, uuid, description,
        machineIdentity.id, machineIdentity.name, subtype.technicalName, subtype.displayName, accessType, environment,
        manuallyCorrelated, enabled, locked, hasEntitlements, ownerIdentity.id, ownerIdentity.name, attributes,
        source.id, source.name, created, modified, risk.severity, permissionLevel, lastUsedAt**


        `risk.severity`, `permissionLevel`, and `lastUsedAt` require Entro enrichment to be enabled; otherwise those
        sorters return `400`. `risk.severity` sorts by rank (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL), not alphabetically.
        Null Entro values sort last. `compliance` is not sortable.
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of machine accounts linked to the machine identity.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../machine-accounts/schemas/machineaccount.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
