get:
  operationId: listMachineIdentityCapabilitiesV2
  tags:
    - Machine Identities
  summary: List machine identity capabilities
  description: |
    This API returns all capabilities, such as MCP servers and tools, that are linked to a machine identity. The list
    is not paginated.

    A caller who owns the machine identity can view its linked capabilities. Other callers need the
    **idn:mis-identity:read** right.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      x-sailpoint-resource-operation-id: listMachineIdentitiesV2
      description: Machine Identity ID.
      example: ef38f94347e94562b5bb8424a56397d8
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of capabilities linked to the machine identity.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineidentitycapability.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
