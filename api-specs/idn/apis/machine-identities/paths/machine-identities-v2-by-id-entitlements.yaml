get:
  operationId: listMachineIdentityEntitlementsV2
  tags:
    - Machine Identities
  summary: List machine identity entitlements
  description: |
    This API returns the entitlements held by the machine accounts that are linked to a machine identity.

    A caller who owns the machine identity can view its entitlements. Other callers need the
    **idn:mis-identity:read** right.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      x-sailpoint-resource-operation-id: listMachineIdentitiesV2
      description: Machine Identity ID.
      example: ef38f94347e94562b5bb8424a56397d8
    - $ref: ../../shared/parameters/limit.yaml
    - $ref: ../../shared/parameters/offset.yaml
    - $ref: ../../shared/parameters/count.yaml
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: entitlementName sw "Finance"
      description: >-
        Filter results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


        Filtering is supported for the following fields and operators:


        **entitlementName**: *eq, in, sw, co*


        `sw` and `co` both match the value anywhere in the entitlement name. Combine filters with `and` and `or`.
        `not` is not supported and returns `400`.
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: entitlementName
      description: >-
        Sort results using the standard syntax described in [V3 API Standard Collection
        Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


        Sorting is supported for the following fields: **entitlementName**
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of entitlements of the machine identity.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/machineidentityentitlement.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
