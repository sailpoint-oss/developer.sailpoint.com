get:
  operationId: listMachineIdentityHostnamesV2
  tags:
    - Machine Identities
  summary: List AI agent hostnames
  description: |
    This API returns the distinct hostnames of AI agent machine identities, in ascending order. Hostnames are returned
    in lowercase with accents removed.

    The API pages with a cursor instead of an offset. To get the next page, pass the last hostname of the current page
    as `cursor`. A page with fewer hostnames than `limit` is the last page.

    A caller who owns AI agents can list the hostnames of those agents. Other callers need the
    **idn:mis-identity:read** right.
  security:
    - userAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:read
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: query
      name: prefix
      required: false
      description: >-
        Return only hostnames that start with this value. Matching ignores case and accents. A blank value is ignored.
      schema:
        type: string
      example: prod-
    - in: query
      name: limit
      required: false
      description: Maximum number of hostnames to return. Values of `0` or more than `250` return `400`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 250
        default: 50
      example: 50
    - in: query
      name: cursor
      required: false
      description: >-
        Return only hostnames that sort after this value. Pass the last hostname of the previous page. Omit it for the
        first page. A blank value returns `400`.
      schema:
        type: string
      example: prod-agent-07.example.com
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: A page of AI agent hostnames.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
            example:
              - prod-agent-08.example.com
              - prod-agent-09.example.com
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
