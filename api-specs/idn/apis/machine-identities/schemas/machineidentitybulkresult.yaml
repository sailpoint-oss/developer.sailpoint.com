type: object
title: Machine Identity Bulk Result
description: Outcome of a bulk operation for one requested machine identity ID.
properties:
  id:
    type: string
    maxLength: 128
    description: The requested machine identity ID.
    example: ef38f94347e94562b5bb8424a56397d8
  status:
    type: integer
    format: int32
    description: >-
      HTTP status code for this ID. `200` means the operation succeeded. Other values explain why it did not, for
      example `400` when the ID is missing or not valid, `404` when the machine identity is not found or the caller does
      not own it, and `409` when the ID appears more than once in the request.
    example: 200
  message:
    type: string
    description: Message describing the outcome for this ID.
    example: Success
