get:
  operationId: listMachineIdentitySubtypesV1
  tags:
    - Machine Identity Metadata
  summary: List machine identity subtypes
  description: |
    This API returns the machine identity subtypes available in the tenant.


    The list includes **Application** and **Device**. When agentic identity governance is enabled for the tenant, the
    list also includes **AI Agent**.


    When Machine Identity Security is not enabled for the tenant, this API returns `404`.
  security:
    - userAuth:
        - idn:identity:read
    - applicationAuth:
        - idn:identity:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: List of machine identity subtypes.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              description: A machine identity subtype.
            example:
              - AI Agent
              - Application
              - Device
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
