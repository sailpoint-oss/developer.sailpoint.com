openapi: 3.0.1
info:
  title: Identity Security Cloud API - Machine Mapping Metadata
  description: >-
    Use these APIs to interact with the Identity Security Cloud platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Machine Mapping Metadata
    description: >
      Use this API to get the identity and account attributes you can use as targets when you map source attributes
      for machine account classification. The lists tell you which attribute names a mapping can write to before you
      configure it.
paths:
  /machine-mapping-metadata/v1/target-identity-attributes:
    $ref: ./paths/machine-mapping-metadata-v1-target-identity-attributes.yaml
  /machine-mapping-metadata/v1/target-account-attributes:
    $ref: ./paths/machine-mapping-metadata-v1-target-account-attributes.yaml
security:
  - userAuth:
      - sp:scopes:all
