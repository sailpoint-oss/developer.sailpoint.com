get:
  operationId: getMachineMappingTargetAccountAttributesV1
  tags:
    - Machine Mapping Metadata
  summary: List target account attributes
  description: |
    This API returns the account attribute names that a machine mapping can target.


    The list always includes **name** and **nativeIdentity**. When expanded mapping targets are enabled for the tenant,
    the list also includes **description**, **environment**, **subtype**, and **businessApplication**.


    The caller needs the **idn:account:read** right.


    When machine account classification is not enabled for the tenant, this API returns `404`.
  security:
    - userAuth:
        - idn:accounts:read
        - idn:accounts:manage
    - applicationAuth:
        - idn:accounts:read
        - idn:accounts:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: Target account attributes.
      content:
        application/json:
          schema:
            $ref: ../schemas/targetattributes.yaml
          example:
            attributes:
              - name
              - nativeIdentity
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
