get:
  operationId: getMachineMappingTargetIdentityAttributesV1
  tags:
    - Machine Mapping Metadata
  summary: List target identity attributes
  description: |
    This API returns the identity attribute names that a machine mapping can target.


    The list always includes **name**, **alias**, **email**, and **uid**. When expanded mapping targets are enabled
    for the tenant, the list also includes the tenant's searchable identity attributes.


    When machine account classification is not enabled for the tenant, this API returns `404`.
  security:
    - userAuth:
        - idn:identity:read
    - applicationAuth:
        - idn:identity:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: Target identity attributes.
      content:
        application/json:
          schema:
            $ref: ../schemas/targetattributes.yaml
          example:
            attributes:
              - name
              - alias
              - email
              - uid
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
