get:
  operationId: testMFAConfigV1
  tags:
  - MFA Configuration
  summary: Mfa method's test configuration
  description: >-
    This API validates that the configuration is valid and will properly authenticate with the MFA provider identified
    by the method path parameter.
  security:
  - userAuth:
    - idn:mfa-configuration:read
    - idn:mfa-configuration:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  parameters:
  - in: path
    name: method
    schema:
      x-sailpoint-lint-ignore:
        schema-enum-values-must-be-upper-snake-case: These enum values are the actual MFA method names the system requires, so they cannot be converted to UPPER_SNAKE_CASE.
      type: string
      example: okta-verify
      nullable: false
      enum:
      - okta-verify
      - duo-web
      - clear1
    required: true
    description: >-
      The name of the MFA method. The currently supported method names are 'okta-verify', 'duo-web', and 'clear1'.
  responses:
    '200':
      description: The result of configuration test for the MFA provider.
      content:
        application/json:
          schema:
            $ref: ../schemas/mfaconfigtestresponse.yaml
          example:
            state: SUCCESS
            error:
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
