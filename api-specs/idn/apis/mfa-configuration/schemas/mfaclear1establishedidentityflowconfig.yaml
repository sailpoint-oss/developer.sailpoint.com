type: object
nullable: true
properties:
  enabled:
    type: boolean
    description: If the established identity flow is enabled for the CLEAR1 MFA method.
    default: false
    example: true
  projectId:
    type: string
    nullable: true
    description: >-
      The ID of the CLEAR1 project used for the established identity flow. This field is required if `enabled` is
      *true*. It may be null if `enabled` is *false*.
  userProfileMatchingAttributes:
    $ref: ./mfaclear1userprofilematchingattributes.yaml
    nullable: true
    description: >-
      Mapping of CLEAR1 user profile attributes to the Identity Security Cloud identity attributes used to match an
      identity during the established identity flow. This field is required if `enabled` is *true*. It may be null
      if `enabled` is *false*.
