type: object
title: Org Config
description: |
  OrgConfig settings accessible to external customer org admins (`ORG_ADMIN`).

  ### Provisioning setting precedence

  1. **Source value:** used first when set. When the request spans more than one source, the largest value among those sources wins.
  2. **OrgConfig value:** used when no source value is set.
  3. **Default:** used when neither is set.

  A value outside the allowed range is ignored, and the next level is used.

  ### Defaults

  * **Retries:** 3
  * **Retry interval:** 60 minutes. The actual wait varies by up to 10 percent above or below the interval, so requests that fail together do not retry at the same time.
  * **Status check interval:** 240 minutes
  * **Status check limit:** 180 checks

  ### Scope

  * **Retry count and retry interval:** account enable, disable, unlock, or delete; lifecycle changes that provision accounts; access requests; and RSA token PIN resets.
  * **Not affected by these settings:** password changes, which use a fixed retry schedule.
  * **Status check interval and status check limit:** queued provisioning requests.
properties:
  orgName:
    type: string
    description: The name of the org.
    example: acme-solar
  timeZone:
    type: string
    description: >-
      The selected time zone which is to be used for the org.  This directly affects when scheduled tasks are executed. 
      Valid options can be found at /beta/org-config/valid-time-zones
    example: America/Toronto
  lcsChangeHonorsSourceEnableFeature:
    type: boolean
    description: Flag to determine whether the LCS_CHANGE_HONORS_SOURCE_ENABLE_FEATURE flag is enabled for the current org.
    default: false
    example: false
  armCustomerId:
    type: string
    description: ARM Customer ID
    nullable: true
    example: DE38E75A-5FF6-4A65-5DC7-08D64426B09E
  armSapSystemIdMappings:
    type: array
    description: A list of IDN::sourceId to ARM::systemId mappings.
    nullable: true
    x-sailpoint-lint-ignore:
      schema-arrays-must-not-be-nullable: Org config returns null for armSapSystemIdMappings when the stored value is absent. An empty array is not what the API returns.
    items:
      $ref: ./IdnSourceToArmSystem.yaml
    example:
      - sourceId: 2c91808c791a94e501792388b0d62659
        systemId: '1556'
      - sourceId: 2_2c91808c791a94e501792388b0d62659
        systemId: '21556'
      - sourceId: 3_2c91808c791a94e501792388b0d62659
        systemId: '31556'
  armAuth:
    type: string
    description: ARM authentication string
    nullable: true
    example: >-
      epiYNTRYA2S7swisDWk1Zv4VMNgvqEjiBh5_ufuCWsma2m-5XADijqBg0ijXLby5nS6lxZNXabhGnAPGeDGc4V3jQKrhwV-UHypRLs8ZLgOjiQNus9NimS0uPdKomRW6TFWqXyfnYd-znNgbbVuwUy9GyD9ebDVJSntPastxSx7UcyGuWBqfNZYpuxKRWe_7TVY60qL55jUqyz8N4XUbbdcxdbZ0uik6ut-Bv90MKTbZexBW_PR4qcgIkaEs4kIenLyBxnGziYo7AO0tJ8bGHO8FJRkibCpAQIt7PISLo7Gg_Xf9j10dKq2YDgy4pPTvz3fE2ZHYnXCXvXFSA-vVag==
  armDb:
    type: string
    description: ARM database name
    nullable: true
    example: EU
  armSsoUrl:
    type: string
    format: uri
    description: ARM SSO URL
    nullable: true
    example: https://your-arm-sso-url
  iaiEnableCertificationRecommendations:
    type: boolean
    description: Flag to determine whether IAI Certification Recommendations are enabled for the current org
    default: true
    example: true
  aiAgentDeleteRequestEnabled:
    type: boolean
    description: Org opt-in flag that enables AI Agent delete-at-source lifecycle requests for the current org.
    default: false
    example: false
  provisioningMaxRetries:
    type: integer
    format: int32
    nullable: true
    minimum: 0
    maximum: 24
    description: The number of times a provisioning request is retried.
    example: 3
  provisioningRetryThreshold:
    type: integer
    format: int32
    nullable: true
    minimum: 1
    maximum: 1440
    description: The number of minutes between provisioning retries.
    example: 60
  provisioningStatusCheckInterval:
    type: integer
    format: int32
    nullable: true
    minimum: 1
    maximum: 1440
    description: The number of minutes between status checks of a queued provisioning request.
    example: 240
  provisioningMaxStatusChecks:
    type: integer
    format: int32
    nullable: true
    minimum: 1
    maximum: 1000
    description: The number of status checks that run before a queued provisioning request times out.
    example: 180
  sodReportConfigs:
    type: array
    items:
      $ref: ./reportconfigdto.yaml
