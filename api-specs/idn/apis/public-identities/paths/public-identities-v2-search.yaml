post:
  operationId: searchPublicIdentitiesV2
  tags:
  - Public Identities
  summary: Search public identities
  description: >-
    Search public identities using a composite query and return matching records.


    The root query set combines criteria with AND and must include attributes.identityState.exact = ACTIVE.
    The field keys must come from GET /public-identities/v2/visible-attributes and may use the prefix "attributes." and/or the suffix ".exact".
    See the request examples for the required exact payload structure.


    Any authenticated user with the default scope can call this endpoint.
  security:
  - userAuth:
    - sp:scopes:default
  x-sailpoint-userLevels:
  - USER
  parameters:
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/publicidentitiessearchrequest.yaml
        examples:
          singleEntryComposite:
            summary: Root AND with ACTIVE gate and one TEXT entry
            value:
              queryType: COMPOSITE
              indices:
              - identities
              includeNested: false
              sort:
              - name
              querySet:
                matchAny: false
                entries:
                - queryType: TEXT
                  textQuery:
                    fields:
                    - attributes.identityState.exact
                    terms:
                    - ACTIVE
                    matchAny: false
                    contains: false
                    strict: true
                - queryType: TEXT
                  textQuery:
                    terms:
                    - Mara
                    fields:
                    - name
                    - email
                    matchAny: true
                    contains: true
                    strict: true
          multiEntryComposite:
            summary: Root AND with ACTIVE gate and multiple TEXT entries
            value:
              queryType: COMPOSITE
              indices:
              - identities
              includeNested: false
              sort:
              - name
              querySet:
                matchAny: false
                entries:
                - queryType: TEXT
                  textQuery:
                    fields:
                    - attributes.identityState.exact
                    terms:
                    - ACTIVE
                    matchAny: false
                    contains: false
                    strict: true
                - queryType: TEXT
                  textQuery:
                    terms:
                    - M
                    fields:
                    - email
                    matchAny: true
                    contains: false
                    strict: true
                - queryType: TEXT
                  textQuery:
                    terms:
                    - M
                    fields:
                    - name
                    matchAny: true
                    contains: false
                    strict: true
          nestedCompositeAndOr:
            summary: Root AND with ACTIVE gate and nested OR of TEXT entries
            value:
              queryType: COMPOSITE
              indices:
              - identities
              includeNested: false
              sort:
              - name
              querySet:
                matchAny: false
                entries:
                - queryType: TEXT
                  textQuery:
                    fields:
                    - attributes.identityState.exact
                    terms:
                    - ACTIVE
                    matchAny: false
                    contains: false
                    strict: true
                - queryType: COMPOSITE
                  querySet:
                    matchAny: true
                    entries:
                    - queryType: TEXT
                      textQuery:
                        terms:
                        - Mara
                        fields:
                        - name
                        matchAny: false
                        contains: false
                        strict: true
                    - queryType: TEXT
                      textQuery:
                        terms:
                        - Mara
                        fields:
                        - email
                        matchAny: false
                        contains: false
                        strict: true
  responses:
    '200':
      description: >-
        Request succeeded. Body is an array of PublicIdentityV2. When count=true, X-Total-Count may
        be set with the total matching count (ignoring limit/offset).
      headers:
        X-Total-Count:
          description: Total number of matching results when count=true.
          schema:
            type: integer
            format: int32
          example: 30
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/publicidentityv2.yaml
          example:
          - id: 2c9180857182305e0171993735622948
            name: sample.user
            displayName: Sample User
            email: someemail@identitynow.com
            identityState: ACTIVE
            cloudLifecycleState: Active
            manager:
              id: 2c9180a46faadee4016fb4e018c20639
              name: thomas.edison
              displayName: Thomas Edison
            attributes:
              country: US
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
