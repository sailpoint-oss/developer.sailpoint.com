type: object
title: Public Identity Visible Attributes
description: >-
  Default and configured identity attribute keys with display names exposed by the public identities
  API.
required:
- defaultAttributes
- configuredAttributes
properties:
  defaultAttributes:
    type: array
    description: >-
      Always-available public-identity field keys for search and sort. Fixed platform list. `key` is
      the search field name; `name` is the display label.
    items:
      $ref: ./publicidentityattributeconfig.yaml
    example:
    - key: id
      name: id
    - key: email
      name: email
    - key: manager.displayName
      name: manager name
  configuredAttributes:
    type: array
    description: >-
      Tenant-configured public attributes from public-identities config (same source as
      public-identities-config). These keys are also allowed in search/sort and appear under
      `attributes` on search results.
    items:
      $ref: ./publicidentityattributeconfig.yaml
    example:
    - key: displayName
      name: Display Name
    - key: lastSyncDate
      name: Last Sync Date
