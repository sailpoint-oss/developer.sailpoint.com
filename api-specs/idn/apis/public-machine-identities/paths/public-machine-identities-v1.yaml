get:
  operationId: listPublicMachineIdentitiesV1
  tags:
  - Public Machine Identities
  summary: List public machine identities
  description: >-
    Get a list of machine identities with a reduced public payload (`id`, `name`, `description`, and optionally
    `subtype` and the primary `owner`). Any authenticated user with the default scope can call this endpoint; it does
    not require the `idn:mis-identity:read` scope.
  security:
  - userAuth:
    - sp:scopes:default
  x-sailpoint-userLevels:
  - USER
  parameters:
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    schema:
      type: string
    required: false
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, sw*


      **subtype**: *eq*


      **owner.id**: *eq*


      **owner**: *eq*


      `subtype`, **owner.id**, and **owner** are only available when your tenant returns enriched public machine
      identity data; otherwise requests using those filters return `400 Bad Request`. **owner** is rewritten to
      **owner.id** when filtering.
    example: name eq "Production API Agent"
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
    required: false
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **id, name, subtype**


      Sorting on `subtype` is only available when your tenant returns enriched public machine identity data; otherwise
      the request returns `400 Bad Request`.
    example: name
  responses:
    '200':
      description: A list of public machine identity objects.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/publicmachineidentity.yaml
          example:
          - id: 2c9180857182305e0171993735622948
            name: Production API Agent
            description: Agent used for nightly reconciliation jobs.
            subtype: AI Agent
            owner:
              id: 2c9180a46faadee4016fb4e018c20639
              name: Thomas Edison
              email: thomas.edison@acme-solar.com
          - id: 2c9180a46faadee4016fb4e018c20639
            name: Finance Integration App
            description: Application identity for finance data sync.
            subtype: Application
            owner:
              id: 2c918086676d3e0601677611dbde220f
              name: Mister Manager
              email: mister.manager@acme-solar.com
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
