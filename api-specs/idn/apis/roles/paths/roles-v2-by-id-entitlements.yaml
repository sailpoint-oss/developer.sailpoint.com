get:
  operationId: getRoleEntitlementsV2
  x-sailpoint-lint-ignore:
    path-list-operations-must-return-object: RolesV4Controller returns a top-level JSON array of entitlements for this role. Wrapping it in an items object would not match the live response.
    path-query-parameters-must-be-camel-case: RolesV4Controller binds for-segment-ids, segmented-for-identity, and include-unsegmented by those kebab-case query names. Camel-case names are not accepted.
  tags:
  - Roles
  summary: List role's entitlements
  description: >-
    Get a list of entitlements assigned directly to a specified Role. Each entitlement includes its privilege level in
    `privilegeLevel`, with the direct, inherited, and effective levels.


    Use either offset pagination (`offset` and `limit`) or cursor pagination (`cursor` and `limit`). When more results
    are available, the `x-next-cursor` response header contains the cursor for the next page. You can't use `cursor`
    together with an `offset` greater than 0, and `offset` plus `limit` can't be greater than 10,000.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  - name: id
    in: path
    description: Containing role's ID.
    required: true
    x-sailpoint-resource-operation-id: listRolesV2
    schema:
      type: string
      example: 2c91808a7813090a017814121919ecca
  - in: query
    name: limit
    description: >-
      Max number of results to return.

      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 50
    schema:
      type: integer
      format: int32
      minimum: 0
      maximum: 250
      default: 50
  - in: query
    name: offset
    description: >-
      Offset into the full result set. Usually specified with *limit* to paginate through the results. Must be 0 or
      omitted when *cursor* is specified.

      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 0
    schema:
      type: integer
      format: int32
      minimum: 0
      default: 0
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: cursor
    schema:
      type: string
      default: ""
    description: >-
      Opaque cursor returned in the `x-next-cursor` response header of the previous page. Pass it with the same
      `sorters` to get the next page of results. Can't be used with an *offset* greater than 0.
    example: eyJzb3J0IjpbImNyZWF0ZWQiLCJpZCJdLCJzZWFyY2hBZnRlciI6WyIxNjAyMTgyMDMyMDI5IiwiMmM5MSJdfQ
    required: false
  - in: query
    name: filters
    schema:
      type: string
      default: ""
    description: >-
      Filter results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, in, sw, co*


      **attribute**: *eq, sw, co*


      **value**: *eq, sw, co*


      **created**: *gt, lt, ge, le*


      **modified**: *gt, lt, ge, le*


      **privilegeLevel.effective**: *eq, in*
    example: privilegeLevel.effective eq "HIGH"
    required: false
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
      default: created
    description: >-
      Sort results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **id, name, attribute, value, created, modified,
      privilegeLevel.effective**


      The default sort is **created**. **id** is always added as the final sort field so that cursor pagination is
      stable.
    example: -privilegeLevel.effective,name
    required: false
  - in: query
    name: for-segment-ids
    schema:
      type: string
      format: comma-separated
      default: ""
    description: >-
      If present and not empty, filters entitlements to those assigned to the segment(s) with the specified IDs.
      Can't be used with *segmented-for-identity*.
    example: 0b5c9f25-83c6-4762-9073-e38f7bb2ae26,2e8d8180-24bc-4d21-91c6-7affdb473b0d
    required: false
  - in: query
    name: segmented-for-identity
    schema:
      type: string
      default: ""
    description: >-
      If present, filters entitlements to those in the segments visible to the specified identity. The value must be
      the calling identity's ID or the special value **me**. Can't be used with *for-segment-ids*.
    example: me
    required: false
  - in: query
    name: include-unsegmented
    schema:
      type: boolean
      default: true
    description: >-
      Whether the response list should contain unsegmented entitlements. If *for-segment-ids* is absent or empty,
      specifying *include-unsegmented* as false results in an error.
    example: false
    required: false
  responses:
    '200':
      description: List of entitlements.
      headers:
        x-total-count:
          description: The total result count (returned only if the *count* parameter is specified as *true*).
          schema:
            type: integer
            format: int32
          example: 12
        x-next-cursor:
          description: >-
            Opaque cursor for the next page of results. Returned only when more results are available. Pass it in the
            *cursor* query parameter to get the next page.
          schema:
            type: string
          example: eyJzb3J0IjpbImNyZWF0ZWQiLCJpZCJdLCJzZWFyY2hBZnRlciI6WyIxNjAyMTgyMDMyMDI5IiwiMmM5MSJdfQ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../entitlements/schemas/entitlementv2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:role-unchecked:read
    - idn:role-unchecked:manage
    - idn:role-checked:manage
    - idn:role-checked:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
