get:
  operationId: listRolesV2
  x-sailpoint-lint-ignore:
    path-list-operations-must-return-object: RolesV4Controller.listRoles returns a top-level JSON array of roles. Wrapping it in an items object would not match the live response.
    path-query-parameters-must-be-camel-case: RolesV4Controller binds for-subadmin, for-segment-ids, and include-unsegmented by those kebab-case query names. Camel-case names are not accepted.
  tags:
  - Roles
  summary: List roles
  description: >-
    This API returns a list of Roles. Each Role includes its effective privilege level in `privilegeLevel.effective`,
    which is the highest effective privilege level among the entitlements assigned directly to the Role and the
    entitlements included in the Role's access profiles.


    Use either offset pagination (`offset` and `limit`) or cursor pagination (`cursor` and `limit`). When more results
    are available, the `x-next-cursor` response header contains the cursor for the next page. Send that value in the
    `cursor` query parameter, with the same `sorters`, to get the next page. You can't use `cursor` together with an
    `offset` greater than 0, and `offset` plus `limit` can't be greater than 10,000. Use cursor pagination to page
    beyond 10,000 results.


    A token with API, ORG_ADMIN, ROLE_ADMIN, or ROLE_SUBADMIN authority is required to call this API.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: 'true'
    schema:
      type: string
      default: 'true'
    required: true
  - in: query
    name: for-subadmin
    schema:
      type: string
      default: ""
    description: >-
      If provided, filters the returned list according to what is visible to the indicated ROLE_SUBADMIN Identity. The
      value of the parameter is either an Identity ID, or the special value **me**, which is shorthand for the calling
      Identity's ID. A 400 Bad Request error is returned if the **for-subadmin** parameter is specified for an
      Identity that is not a subadmin.
    example: 5168015d32f890ca15812c9180835d2e
    required: false
  - in: query
    name: limit
    description: >-
      Max number of results to return.

      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 50
    schema:
      type: integer
      format: int32
      minimum: 0
      maximum: 250
      default: 50
  - in: query
    name: offset
    description: >-
      Offset into the full result set. Usually specified with *limit* to paginate through the results. Must be 0 or
      omitted when *cursor* is specified.

      See [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters)
      for more information.
    required: false
    example: 0
    schema:
      type: integer
      format: int32
      minimum: 0
      default: 0
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: cursor
    schema:
      type: string
      default: ""
    description: >-
      Opaque cursor returned in the `x-next-cursor` response header of the previous page. Pass it with the same
      `sorters` to get the next page of results. Can't be used with an *offset* greater than 0.
    example: eyJzb3J0IjpbIm5hbWUiLCJpZCJdLCJzZWFyY2hBZnRlciI6WyJSb2xlIDI1NjciLCIyYzkxIl19
    required: false
  - in: query
    name: filters
    schema:
      type: string
      default: ""
    description: >-
      Filter results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **name**: *eq, in, sw, co*


      **created**: *gt, lt, ge, le*


      **modified**: *gt, lt, ge, le*


      **type**: *eq, in*


      **owner.id**: *eq, in*


      **additionalOwners.id**: *eq, in*


      **requestable**: *eq*


      **dimensional**: *eq*


      **source.id**: *eq, in*


      **entitlement.id**: *eq, in*


      **entitlement.name**: *eq, sw, co*


      **accessProfile.id**: *eq, in*


      **accessProfile.name**: *eq, sw, co*


      **privilegeLevel.effective**: *eq, in*


      Supported composite operators are *and, or*
    example: privilegeLevel.effective in ("HIGH","MEDIUM")
    required: false
  - in: query
    name: sorters
    schema:
      type: string
      format: comma-separated
      default: name
    description: >-
      Sort results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **id, name, created, modified, privilegeLevel.effective**


      The default sort is **name**. **id** is always added as the final sort field so that cursor pagination is
      stable.
    example: -privilegeLevel.effective,name
    required: false
  - in: query
    name: for-segment-ids
    schema:
      type: string
      format: comma-separated
      default: ""
    description: >-
      If present and not empty, additionally filters Roles to those which are assigned to the Segment(s) with the
      specified IDs.


      If segmentation is currently unavailable, specifying this parameter results in an error.
    example: 0b5c9f25-83c6-4762-9073-e38f7bb2ae26,2e8d8180-24bc-4d21-91c6-7affdb473b0d
    required: false
  - in: query
    name: include-unsegmented
    schema:
      type: boolean
      default: true
    description: >-
      Whether or not the response list should contain unsegmented Roles. If *for-segment-ids* is absent or empty,
      specifying *include-unsegmented* as false results in an error.
    example: false
    required: false
  responses:
    '200':
      description: List of Roles
      headers:
        x-total-count:
          description: The total result count (returned only if the *count* parameter is specified as *true*).
          schema:
            type: integer
            format: int32
          example: 75
        x-next-cursor:
          description: >-
            Opaque cursor for the next page of results. Returned only when more results are available. Pass it in the
            *cursor* query parameter to get the next page.
          schema:
            type: string
          example: eyJzb3J0IjpbIm5hbWUiLCJpZCJdLCJzZWFyY2hBZnRlciI6WyJSb2xlIDI1NjciLCIyYzkxIl19
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../roles/schemas/rolev2.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
  security:
  - userAuth:
    - idn:role-unchecked:read
    - idn:role-unchecked:manage
    - idn:role-checked:manage
    - idn:role-checked:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - ROLE_ADMIN
  - ROLE_SUBADMIN
