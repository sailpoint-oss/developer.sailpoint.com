type: object
title: Role Privilege Level
description: >-
  Privilege level of the role. The effective level is the highest effective privilege level among the entitlements
  assigned directly to the role and the entitlements included in the role's access profiles.
properties:
  effective:
    type: string
    description: >-
      Effective privilege level of the role. **UNDETERMINED** means the privilege level could not be calculated for the
      role's entitlements.
    example: HIGH
    enum:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      - UNDETERMINED
