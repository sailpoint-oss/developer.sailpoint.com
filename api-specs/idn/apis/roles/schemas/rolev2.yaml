type: object
title: Role V2
description: A Role, including its effective privilege level.
properties:
  id:
    type: string
    description: >-
      The id of the Role. This field must be left null when creating an Role, otherwise a 400 Bad Request error will
      result.
    example: 2c918086749d78830174a1a40e121518
  name:
    type: string
    description: The human-readable display name of the Role
    maxLength: 128
    example: Role 2567
  created:
    type: string
    description: Date the Role was created
    format: date-time
    example: '2021-03-01T22:32:58.104Z'
    readOnly: true
  modified:
    type: string
    description: Date the Role was last modified.
    format: date-time
    example: '2021-03-02T20:22:28.104Z'
    readOnly: true
  description:
    type: string
    nullable: true
    description: A human-readable description of the Role
    example: Read-only access to the finance reporting system
  owner:
    $ref: ../../shared/schemas/ownerreference.yaml
  additionalOwners:
    type: array
    nullable: true
    x-sailpoint-lint-ignore:
      schema-arrays-must-not-be-nullable: The Role model leaves additionalOwners null when there are no additional owners. An empty array is not what the API returns.
    description: >-
      List of additional owner references beyond the primary owner. Each entry may be an identity (IDENTITY) or a
      governance group (GOVERNANCE_GROUP).
    items:
      $ref: ../../shared/schemas/additionalownerref.yaml
  accessProfiles:
    type: array
    items:
      $ref: ./accessprofileref.yaml
    nullable: true
    x-sailpoint-lint-ignore:
      schema-arrays-must-not-be-nullable: The Role model initializes accessProfiles to null. An empty array is not what the API returns.
  entitlements:
    type: array
    items:
      $ref: ../../shared/schemas/entitlementref.yaml
  membership:
    $ref: ./rolemembershipselector.yaml
    nullable: true
  legacyMembershipInfo:
    type: object
    nullable: true
    description: >-
      This field is not directly modifiable and is generally expected to be *null*. In very rare instances, some Roles
      may have been created using membership selection criteria that are no longer fully supported. While these Roles
      will still work, they should be migrated to STANDARD or IDENTITY_LIST selection criteria. This field exists for
      informational purposes as an aid to such migration.
    example:
      type: IDENTITY_LIST
    additionalProperties: true
  enabled:
    type: boolean
    description: Whether the Role is enabled or not.
    example: true
    default: false
  requestable:
    type: boolean
    description: Whether the Role can be the target of access requests.
    example: true
    default: false
  accessRequestConfig:
    $ref: ./requestabilityforrole.yaml
    nullable: true
    description: Access request configuration for this object
  revocationRequestConfig:
    $ref: ./revocabilityforrole.yaml
    nullable: true
    default:
    description: Revocation request configuration for this object.
  segments:
    type: array
    items:
      type: string
    nullable: true
    x-sailpoint-lint-ignore:
      schema-arrays-must-not-be-nullable: The Role model initializes segments to null. An empty array is not what the API returns.
    description: List of IDs of segments, if any, to which this Role is assigned.
    example:
    - f7b1b8a3-5fed-4fd4-ad29-82014e137e19
    - 29cb6c06-1da8-43ea-8be4-b3125f248f2a
  dimensional:
    description: Whether the Role is dimensional.
    type: boolean
    nullable: true
    x-sailpoint-lint-ignore:
      schema-booleans-must-not-be-nullable: The Role model types dimensional as Boolean, so a role with no value is returned as null.
    default: false
  dimensionRefs:
    type: array
    items:
      $ref: ./dimensionref.yaml
    nullable: true
    x-sailpoint-lint-ignore:
      schema-arrays-must-not-be-nullable: The Role model leaves dimensionRefs unset, so it is returned as null when the role has no dimensions.
    description: >-
      List of references to dimensions to which this Role is assigned. This field is only relevant if the Role is
      dimensional.
  accessModelMetadata:
    $ref: ../../shared/schemas/attributedtolist.yaml
    description: This field must be left null or empty when creating an Role, otherwise a 400 Bad Request error will result.
    example:
    - key: iscFederalClassifications
      name: Federal Classifications
      multiselect: true
      status: active
      type: governance
      objectTypes:
      - general
      description: Classification used by government organizations to specify the level of confidentiality for an access item.
      values:
      - value: secret
        name: Secret
        status: active
  privilegeLevel:
    allOf:
      - $ref: ./roleprivilegelevel.yaml
    nullable: true
    readOnly: true
required:
- name
- owner
