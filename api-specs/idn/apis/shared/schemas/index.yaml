description: |-
  Enum representing the currently supported indices.
  Additional values may be added in the future without notice.

  The `*` value does not include the `workflowsummaries` index. To search workflow summaries, specify `workflowsummaries` explicitly.
type: string
enum:
  - accessprofiles
  - accountactivities
  - entitlements
  - events
  - identities
  - roles
  - workflowsummaries
  - '*'
example: identities
