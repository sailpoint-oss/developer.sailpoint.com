get:
  operationId: listControlsV1
  tags:
  - SOD Controls
  summary: List Compensating Controls
  description: Returns a list of compensating controls associated with separation-of-duties policies.
  security:
  - userAuth:
    - idn:sod-control:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOD_CONTROL_ADMIN
  - SOD_POLICY_ADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - in: query
    name: filters
    description: |-
      Filter results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)

      Filtering is supported for the following fields and operators:

      **id**: *eq, in*

      **name**: *eq, in, sw, co*

      **type**: *eq*

      **owner**: *eq, in*

      **description**: *eq, in, sw, co*

      **action**: *eq, in*
    schema:
      type: string
    required: false
    example: type eq "Mitigation" and name co "payroll"
  - in: query
    name: sort
    description: |-
      Sort results using the standard syntax described in [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)

      Sorting is supported for the following fields: **name**

      Prefix a field with - for descending order, for example -name. If no sort is provided, results default to name ascending.
    schema:
      type: string
    required: false
    example: -name
  responses:
    '200':
      description: List of compensating controls
      headers:
        X-Total-Count:
          description: >
            Total number of matching controls (only present when `count=true`).
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/compensatingcontrolresponse.yaml
          example:
          - id: 3e078865-55ed-43cf-b83c-85c58d2016e6
            name: Example Name
            description: a description
            owner:
              id: 943a7c57da334d07ba2454bf7fcf144f
              type: IDENTITY
              name: John Doe
            secondaryOwners: []
            type: MITIGATION
            action: action
            expiration: "720h"
            justificationRequired: true
            workflowID: "3e07886555ed43cfb83c85c58d2016e6"
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  operationId: createControlV1
  tags:
  - SOD Controls
  summary: Create Compensating Control
  description: Creates a compensating control associated with separation-of-duties policies.
  security:
  - userAuth:
    - idn:sod-control:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOD_CONTROL_ADMIN
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    description: Data needed to create a Compensating Control
    content:
      application/json:
        schema:
          $ref: ../schemas/compensatingcontrolcreate.yaml
        example:
          name: a name
          description: a description
          owner:
            id: 3e07886555ed43cfb83c85c58d2016e6
            type: IDENTITY
          secondaryOwners:
          - id: 943a7c57da334d07ba2454bf7fcf144f
            type: GOVERNANCE_GROUP
          type: Mitigation
          action: Workflow
          expiration: 20d
          justificationRequired: true
          workflowID: "3e07886555ed43cfb83c85c58d2016e6"
  responses:
    '201':
      description: Compensating Control successfully created
      content:
        application/json:
          schema:
            $ref: ../schemas/compensatingcontrolresponse.yaml
          example:
            id: 3e078865-55ed-43cf-b83c-85c58d2016e6
            name: Example Name
            description: a description
            owner:
              id: 943a7c57da334d07ba2454bf7fcf144f
              type: IDENTITY
              name: John Doe
            secondaryOwners: []
            type: MITIGATION
            action: action
            expiration: "720h"
            justificationRequired: true
            workflowID: "3e07886555ed43cfb83c85c58d2016e6"
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
