get:
  security:
  - userAuth:
    - idn:sod-violation:read
  x-sailpoint-userLevels:
  - Any
  operationId: getViolationV1
  tags:
  - SOD Violations
  summary: Get policy violation by ID
  description: >
    Returns a single policy violation by ID for the current tenant.
    Access is allowed if the caller has the read scope (`idn:sod-violation:read`)
    or is an owner of the violation (direct or via governance group).
    Returns 403 Forbidden if the violation exists but the caller has neither
    the read scope nor ownership. Returns 404 Not Found if the violation
    does not exist for the tenant.

    Embedded references (`owner`, `target`, `policy`, and references inside
    `appliedControls`) use `ReferenceResponse`: `id` and `type` are always present;
    `name` is included when display metadata resolves.
  parameters:
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  - in: path
    name: id
    required: true
    x-sailpoint-resource-operation-id: listViolationsV1
    description: The ID of the policy violation to fetch
    schema:
      type: string
      format: uuid
      example: 3e078865-55ed-43cf-b83c-85c58d2016e6
  responses:
    '200':
      description: The policy violation
      content:
        application/json:
          schema:
            $ref: ../schemas/policyviolationresponse.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
