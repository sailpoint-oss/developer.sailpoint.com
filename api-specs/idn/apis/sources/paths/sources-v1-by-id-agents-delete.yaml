post:
  operationId: deleteSourceAgentsV1
  tags:
  - Sources
  summary: Delete source AI agents
  description: |
    Use this API to delete all AI agents that were aggregated into the given datasets on a source. Deletion runs as an
    asynchronous task, and the response contains the task's initial status.


    This API returns `400` when the source has no connector instance, when `datasetIds` is missing or empty, or when a
    deletion or aggregation is already running for the source.


    When agentic identity governance is not enabled for the tenant, or AI agent deletion is not available,
    this API returns `404`.
  security:
  - userAuth:
    - idn:dataset:manage
  - applicationAuth:
    - idn:dataset:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  parameters:
  - in: path
    name: id
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/deletesourceagentsrequest.yaml
  responses:
    '202':
      description: Accepted. Returns the initial status of the deletion task.
      content:
        application/json:
          schema:
            $ref: ../schemas/sourceagentdeletiontaskstatus.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
