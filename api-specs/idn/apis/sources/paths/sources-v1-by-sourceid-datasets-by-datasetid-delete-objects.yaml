post:
  operationId: deleteSourceDatasetObjectsV1
  security:
  - userAuth:
    - idn:sources:aggregate
    - idn:sources:manage
  - applicationAuth:
    - idn:sources:aggregate
    - idn:sources:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: Delete objects for source dataset
  description: |
    Starts a task to delete aggregated objects for the specified dataset on the source in Identity
    Security Cloud (ISC). Linked dataset and resource definitions are not deleted.
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - in: path
    name: datasetId
    required: true
    x-sailpoint-resource-operation-id: getSourceDatasetsV1
    schema:
      type: string
    description: Dataset ID.
    example: cmdb-servicenow:applications
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: Delete objects task.
      content:
        application/json:
          schema:
            $ref: ../schemas/taskresultdetails.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
