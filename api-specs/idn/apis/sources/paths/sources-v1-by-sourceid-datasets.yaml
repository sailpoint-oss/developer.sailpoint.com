get:
  operationId: getSourceDatasetsV1
  security:
  - userAuth:
    - idn:sources:read
    - idn:sources:manage
  - applicationAuth:
    - idn:sources:read
    - idn:sources:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: List datasets on source
  description: |
    Use this API to list datasets for the specified source in Identity Security Cloud (ISC).
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: The datasets were successfully retrieved.
      content:
        application/json:
          schema:
            type: array
            maxItems: 250
            items:
              $ref: ../schemas/sourcedataset.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  operationId: createSourceDatasetV1
  security:
  - userAuth:
    - idn:sources:update
    - idn:source-schema:create
    - idn:sources:manage
    - idn:source-schema:manage
  - applicationAuth:
    - idn:sources:update
    - idn:source-schema:create
    - idn:sources:manage
    - idn:source-schema:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: Create dataset on source
  description: |
    Use this API to create a dataset on the specified source in Identity Security Cloud (ISC).


    This operation requires a connector with the `supportDatasetCreation` label. `name` is required.
    The dataset `id` is always server-generated from `name` as `customer:` plus a normalized form of
    the name; any client-supplied `id` is ignored.
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/sourcedataset.yaml
        examples:
          Create Dataset:
            value:
              name: Applications
              description: CMDB application records for this source.
  responses:
    '201':
      description: The dataset was successfully created on the specified source.
      content:
        application/json:
          schema:
            $ref: ../schemas/sourcedataset.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
