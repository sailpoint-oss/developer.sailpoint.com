get:
  operationId: getSourceResourceMappingsV1
  security:
  - userAuth:
    - idn:sources:read
    - idn:source-schema:read
    - idn:sources:manage
    - idn:source-schema:manage
  - applicationAuth:
    - idn:sources:read
    - idn:source-schema:read
    - idn:sources:manage
    - idn:source-schema:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: Get source resource mappings
  description: |
    Use this API to get aggregation metadata for resources on the specified source in Identity
    Security Cloud (ISC). The response is keyed by resource id. Each value includes the linked
    dataset id, resource type, and connector object type. Resources without a matching schema are
    omitted.
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: The source resource mappings were successfully retrieved.
      content:
        application/json:
          schema:
            $ref: ../schemas/sourceresourcemapping.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
