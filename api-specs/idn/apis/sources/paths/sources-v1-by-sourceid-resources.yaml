get:
  operationId: getSourceResourcesV1
  security:
  - userAuth:
    - idn:sources:read
    - idn:source-schema:read
    - idn:sources:manage
    - idn:source-schema:manage
  - applicationAuth:
    - idn:sources:read
    - idn:source-schema:read
    - idn:sources:manage
    - idn:source-schema:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: List resources for a source
  description: |
    Use this API to list resources defined on the specified source in Identity Security Cloud (ISC).
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  - $ref: ../../shared/parameters/count.yaml
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  responses:
    '200':
      description: The source resources were successfully retrieved.
      content:
        application/json:
          schema:
            type: array
            maxItems: 250
            items:
              $ref: ../schemas/sourcedatasetresource.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
post:
  operationId: createSourceResourceV1
  security:
  - userAuth:
    - idn:sources:update
    - idn:source-schema:create
    - idn:sources:manage
    - idn:source-schema:manage
  - applicationAuth:
    - idn:sources:update
    - idn:source-schema:create
    - idn:sources:manage
    - idn:source-schema:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_ADMIN
  - SOURCE_SUBADMIN
  tags:
  - Sources
  summary: Create resource on source
  description: |
    Use this API to create a resource on the specified source in Identity Security Cloud (ISC).


    This operation requires a connector with the `supportDatasetCreation` label. `name`, `type`,
    `datasetId`, and `schema` are required. The `schema` must define at least one attribute plus
    `identityAttribute` and `displayAttribute`. The resource `id` is always server-generated from
    `name` as `customer:` plus a normalized form of the name; any client-supplied `id` is ignored.
    After creation, schema attribute edits are made through the source schema APIs.
  parameters:
  - in: path
    name: sourceId
    required: true
    x-sailpoint-resource-operation-id: listSourcesV1
    schema:
      type: string
    description: Source ID.
    example: 2c9180835d191a86015d28455b4a2329
  - name: X-SailPoint-Experimental
    in: header
    description: Use this header to enable this experimental API.
    example: true
    schema:
      type: string
      default: true
    required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/sourcedatasetresource.yaml
        examples:
          Create Resource:
            value:
              name: Account
              type: std:resource
              datasetId: cmdb-servicenow:applications
              features:
              - Create
              - Delete
              schema:
                identityAttribute: NAME
                displayAttribute: NAME
                attributes:
                - name: NAME
                  type: STRING
                  isMultiValued: false
                  isEntitlement: false
                  isGroup: false
  responses:
    '201':
      description: The resource was successfully created on the specified source.
      content:
        application/json:
          schema:
            $ref: ../schemas/sourcedatasetresource.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
