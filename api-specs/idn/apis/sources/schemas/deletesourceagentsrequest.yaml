type: object
title: Delete Source Agents Request
description: Datasets whose AI agents should be deleted from the source.
required:
  - datasetIds
properties:
  datasetIds:
    type: array
    description: >-
      IDs of the datasets to delete AI agents for. All AI agents from these datasets on the source are deleted. Must
      contain at least one ID, and IDs cannot be blank.
    minItems: 1
    items:
      type: string
    example:
      - datasetId12345
      - datasetId67890
