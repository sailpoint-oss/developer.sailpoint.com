type: object
title: Source Dataset
description: >-
  Dataset instance for a source. The dataset `id` is server-generated from `name` on create
  (`customer:` plus a normalized form of `name`); any client-supplied `id` is ignored. `aggregationEnabled` may always
  be updated. `name`, `description`, and `resources` can be changed only when the connector has the
  `supportDatasetCreation` label.
properties:
  id:
    type: string
    readOnly: true
    description: Dataset identifier. Server-generated on create.
    example: cmdb-servicenow:applications
  name:
    type: string
    description: Display name of the dataset. Required on create.
    example: Applications
  description:
    type: string
    description: Description of the dataset.
    example: CMDB application records for this source.
  aggregationEnabled:
    type: boolean
    default: false
    description: Whether aggregation is enabled for this dataset on the source.
    example: true
  resources:
    type: array
    description: Simplified resource references associated with this dataset.
    items:
      $ref: ./sourcedatasetresourceref.yaml
