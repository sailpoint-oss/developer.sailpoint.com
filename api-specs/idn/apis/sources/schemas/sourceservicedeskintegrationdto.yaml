type: object
title: Source Service Desk Integration Dto
description: A Service Desk Integration that carries out provisioning for a source.
required:
- id
- name
- type
properties:
  id:
    type: string
    description: ID of the Service Desk Integration.
    example: 2c9180835d191a86015d28455b4a2329
  name:
    type: string
    description: >-
      Name of the Service Desk Integration, as given by the administrator who created it. Use this to find the
      integration in the Service Desk Integrations list.
    example: ServiceNow Production
  type:
    type: string
    description: >-
      Type of the Service Desk Integration, matching the connector it was created from. This is the same value the
      Service Desk Integration APIs report as `type`, for example:

      - ServiceNowSDIM

      - ServiceNow


      The supported types are not fixed, so use [List service desk integration
      types](https://developer.sailpoint.com/docs/api/get-service-desk-integration-types-v-1) for the current set
      rather than hard coding them.
    example: ServiceNowSDIM
