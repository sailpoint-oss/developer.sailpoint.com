openapi: 3.0.1
info:
  title: Identity Security Cloud API - Tags
  description: >-
    Use these APIs to interact with the Identity Security Cloud platform to achieve repeatable, automated processes with
    greater scalability. We encourage you to join the SailPoint Developer Community forum at
    https://developer.sailpoint.com/discuss to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
  - url: https://{tenant}.api.identitynow.com
    description: This is the production API server.
    variables:
      tenant:
        default: sailpoint
        description: This is the name of your tenant, typically your company's name.
  - url: https://{apiUrl}
    description: This is the versioned API server.
    variables:
      apiUrl:
        default: sailpoint.api.identitynow.com
        description: This is the api url of your tenant
tags:
  - name: Tags
    description: >
      Use this API to manage the tags available in your Identity Security Cloud tenant.


      A tag is a reusable label, such as `PCI` or `SOX`, that you can apply to objects like identities, roles, access
      profiles, entitlements, and sources to group them and find them more quickly when you search Identity Security
      Cloud. These APIs manage the tags themselves. To apply tags to objects or remove them from objects, use the
      Tagged Objects APIs.


      Tag names are normalized when a tag is created: spaces are replaced with underscores, letters are converted to
      uppercase, and any character other than A-Z, 0-9, and underscore is removed. For example, `pci data` becomes
      `PCI_DATA`. The normalized name must be between 3 and 128 characters long.


      A tag can't be deleted while it's still applied to any object. Remove the tag from those objects first.


      Refer to [Tagging Items in Search](https://documentation.sailpoint.com/saas/help/search/index.html?h=tags#tagging-items-in-search) for more information about tagging objects in Identity Security Cloud.
paths:
  /tags/v1:
    $ref: ./paths/tags-v1.yaml
  /tags/v1/{id}:
    $ref: ./paths/tags-v1-by-id.yaml
security:
  - userAuth:
      - sp:scopes:all
