type: object
properties:
  iframeWhiteList:
    type: string
    nullable: true
    description: >-
      Parameter that organizational administrators can adjust to permit another domain to encapsulate IDN within an
      iframe. If you would like to reset the value use "null". It will only allow include into iframe non authenticated
      portions of the product, such as password reset.
    example: http://example.com http://example2.com
  usernameLabel:
    type: string
    nullable: true
    description: Descriptor for the username input field. If you would like to reset the value use "null".
    example: Email
  usernameEmptyText:
    type: string
    nullable: true
    description: Placeholder text displayed in the username input field. If you would like to reset the value use "null".
    example: Please provide your work email address...
  instanceBadgeDisplayName:
    type: string
    nullable: true
    description: Display name for the instance badge. Null when no display name is configured.
    example: Sandbox
  instanceBadgeColor:
    type: string
    nullable: true
    description: Hex value of color for the instance badge. Null when no color is configured.
    example: FFAA00
  instanceBadgeVisible:
    type: boolean
    description: Whether the instance badge is visible. Defaults to false when no value is stored.
    example: true
    default: false
