post:
  operationId: createUiPluginLinkV1
  x-sailpoint-lint-ignore:
    path-201-responses-must-define-location-header: The service returns the new resource in the response body and does not set a Location header.
  tags:
    - UI Plugins
  summary: Create a plugin dev link
  description: >-
    Registers the caller's identity against a local HTTPS origin
    `https://localhost:{port}` in the instance's `devOverrides` map. Used by the
    `sail ui-plugins link` CLI flow.


    Requires product license `idn:ui-plugins-author` (404 if missing).
    Returns 400 `User context is invalid` when the caller has no tenant id or
    identity id. That identity id is the key in `devOverrides`, so the caller
    can only set their own local-dev URL. A plugin instance in another tenant
    is 404.


    Response body contains the updated `devOverrides` map (`identityId` to
    `https://localhost:{port}`) and `devDocumentHeaders`, the ephemeral
    `Content-Security-Policy` and `Permissions-Policy` header values a local dev
    server can use for CSP parity with the deployed plugin.
  security:
    - userAuth:
        - idn:plugins-ui:update
    - applicationAuth:
        - idn:plugins-ui:update
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: pluginInstanceId
      in: path
      required: true
      description: UUID of the plugin instance
      example: 2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c
      schema:
        type: string
        format: uuid
      x-sailpoint-resource-operation-id: listUiPluginsV1
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/linkuipluginrequest.yaml
  responses:
    '201':
      description: Linked; returns updated devOverrides map and devDocumentHeaders
      content:
        application/json:
          schema:
            $ref: ../schemas/linkuipluginresponse.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
delete:
  operationId: deleteUiPluginLinkV1
  tags:
    - UI Plugins
  summary: Delete a plugin dev link
  description: >-
    Removes only the current caller's `identityId` entry from `devOverrides`.
    Other developers' overrides are preserved.


    Requires product license `idn:ui-plugins-author` (404 if missing).
    Returns 400 `User context is invalid` when the caller has no tenant id or
    identity id. A plugin instance in another tenant is 404.
  security:
    - userAuth:
        - idn:plugins-ui:update
    - applicationAuth:
        - idn:plugins-ui:update
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: pluginInstanceId
      in: path
      required: true
      description: UUID of the plugin instance
      example: 2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c
      schema:
        type: string
        format: uuid
      x-sailpoint-resource-operation-id: listUiPluginsV1
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  responses:
    '204':
      $ref: ../../shared/responses/204.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
