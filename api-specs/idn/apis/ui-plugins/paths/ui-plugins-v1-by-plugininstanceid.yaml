get:
  operationId: getUiPluginV1
  tags:
    - UI Plugins
  summary: Get a plugin instance
  description: >-
    Returns a plugin instance by ID for the caller's tenant.


    Requires product license `idn:ui-plugins` or `idn:ui-plugins-author`
    (404 if neither is present). Returns 400 `User context is invalid` when
    the caller has no tenant id. The instance is loaded only when it belongs
    to that tenant; a mismatch is 404.
  security:
    - userAuth:
        - idn:plugins-ui:read
    - applicationAuth:
        - idn:plugins-ui:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: pluginInstanceId
      in: path
      required: true
      description: UUID of the plugin instance
      example: 2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c
      schema:
        type: string
        format: uuid
      x-sailpoint-resource-operation-id: listUiPluginsV1
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  responses:
    '200':
      description: Plugin instance
      content:
        application/json:
          schema:
            $ref: ../schemas/uiplugin.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
patch:
  operationId: updateUiPluginV1
  tags:
    - UI Plugins
  summary: Partially update a plugin instance
  description: >-
    Patch any subset of mutable fields. When `slots` is provided, replaces the
    entire slots list and re-validates registry / maxPlugins rules. When
    `apiScopes` is provided, replaces the entire scopes list. When
    `iframeSandbox` is provided, replaces the entire sandbox grant list; unlike
    CSP / Permissions-Policy changes, it does not rotate the active asset
    bundle. `state` may be set
    to `ENABLED` or `DISABLED` (DISABLED omits the instance from active-slots
    delivery).


    Requires product license `idn:ui-plugins` or `idn:ui-plugins-author`
    (404 if neither is present). Returns 400 `User context is invalid` when
    the caller has no tenant id. The instance is updated only when it belongs
    to that tenant; a mismatch is 404. Emits Kafka audit event
    `UI_PLUGIN_INSTANCE_UPDATED` on success.
  security:
    - userAuth:
        - idn:plugins-ui:update
    - applicationAuth:
        - idn:plugins-ui:update
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: pluginInstanceId
      in: path
      required: true
      description: UUID of the plugin instance
      example: 2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c
      schema:
        type: string
        format: uuid
      x-sailpoint-resource-operation-id: listUiPluginsV1
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/updateuipluginrequest.yaml
  responses:
    '200':
      description: Updated plugin instance
      content:
        application/json:
          schema:
            $ref: ../schemas/uiplugin.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '409':
      description: Alias already in use for this tenant
      content:
        application/json:
          schema:
            $ref: ../../shared/schemas/errorresponsedto.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
delete:
  operationId: deleteUiPluginV1
  tags:
    - UI Plugins
  summary: Delete a plugin instance
  description: >-
    Deletes the plugin instance and associated resources (asset bundles
    tombstoned for deferred cleanup).


    Requires product license `idn:ui-plugins` or `idn:ui-plugins-author`
    (404 if neither is present). Returns 400 `User context is invalid` when
    the caller has no tenant id. The instance is deleted only when it belongs
    to that tenant; a mismatch is 404. Emits Kafka audit event
    `UI_PLUGIN_INSTANCE_DELETED` on success.
  security:
    - userAuth:
        - idn:plugins-ui:delete
    - applicationAuth:
        - idn:plugins-ui:delete
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - name: pluginInstanceId
      in: path
      required: true
      description: UUID of the plugin instance
      example: 2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c
      schema:
        type: string
        format: uuid
      x-sailpoint-resource-operation-id: listUiPluginsV1
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: 'true'
      schema:
        type: string
        default: 'true'
      required: true
  responses:
    '204':
      $ref: ../../shared/responses/204.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
