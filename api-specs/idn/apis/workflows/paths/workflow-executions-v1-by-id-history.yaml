get:
  operationId: getWorkflowExecutionHistoryV1
  tags:
  - Workflows
  summary: Get workflow execution history
  description: >-
    Get a detailed history of a single workflow execution.  Workflow executions are available for up to 90 days before
    being archived.  If you attempt to access a workflow execution that has been archived, you will receive a 404 Not
    Found.
  security:
  - userAuth:
    - sp:workflow-execution:read
    - sp:workflow:manage
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - SOURCE_SUBADMIN
  - SOURCE_ADMIN
  parameters:
  - name: id
    in: path
    description: Id of the workflow execution
    x-sailpoint-resource-operation-id: getWorkflowExecutionV1
    required: true
    style: simple
    explode: false
    schema:
      type: string
      example: c17bea3a-574d-453c-9e04-4365fbf5af0b
  - $ref: ../../shared/parameters/limit.yaml
  - $ref: ../../shared/parameters/offset.yaml
  responses:
    '200':
      description: List of workflow execution events for the given workflow execution
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/workflowexecutionevent.yaml
    '400':
      $ref: ../../shared/responses/400.yaml
    '401':
      $ref: ../../shared/responses/401.yaml
    '403':
      $ref: ../../shared/responses/403.yaml
    '404':
      $ref: ../../shared/responses/404.yaml
    '429':
      $ref: ../../shared/responses/429.yaml
    '500':
      $ref: ../../shared/responses/500.yaml
