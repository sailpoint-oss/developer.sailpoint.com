type: "object"
properties:
  value:
    type: "string"
    description: >-
      Technical name of the Attribute value. This is unique and cannot be changed after creation.
    example: "public"
  name:
    type: "string"
    description: >-
      The display name of the Attribute value.
    example: "Public"
  status:
    type: "string"
    description: >-
      The status of the Attribute value.
    example: "active"
  type:
    type: "string"
    nullable: true
    enum:
      - "static"
      - "adhoc"
    description: >-
      Indicates how this Attribute value was created. **static** values are pre-defined and created
      directly through this API. **adhoc** values are created dynamically through an internal
      service-to-service flow when the parent Attribute has *isAdhoc* set to *true*, and cannot be
      created directly through the public create-value API.
    example: "static"