type: "object"
properties:
  value:
    type: "string"
    pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_-]*[a-zA-Z0-9])?$'
    maxLength: 255
    description: >-
      Technical name of the Attribute value. This is unique and cannot be changed after creation.
      Allowed characters are letters, numbers, dashes (-), and underscores (_); the value cannot
      start or end with a dash or underscore.
    example: "public"
  name:
    type: "string"
    maxLength: 100
    description: >-
      The display name of the Attribute value. Allowed characters are letters, numbers, whitespace,
      and the following special characters: . / | , ( ) & _ -
    example: "Public"
  status:
    type: "string"
    description: >-
      The status of the Attribute value.
    example: "active"