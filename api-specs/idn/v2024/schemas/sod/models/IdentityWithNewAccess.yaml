description: An identity with a set of access to be added
required:
  - identityId
  - accessRefs
type: object
properties:
  identityId:
    description: Identity id to be checked.
    type: string
    example: 2c91808568c529c60168cca6f90c1313
  accessRefs:
    description: >-
      The list of access items to consider for possible violations in a preventive check.
      Supported types are ENTITLEMENT, ACCESS_PROFILE, and ROLE.
    type: array
    items:
      type: object
      description: Reference to an access item that may contribute to an SOD violation.
      properties:
        type:
          type: string
          description: Access item DTO type.
          enum:
            - ENTITLEMENT
            - ACCESS_PROFILE
            - ROLE
          example: ENTITLEMENT
          nullable: false
        id:
          type: string
          description: Access item ID.
          example: 2c91809773dee32014e13e122092014e
          nullable: false
    example:
      - type: ENTITLEMENT
        id: 2c918087682f9a86016839c050861ab1
      - type: ACCESS_PROFILE
        id: 2c918087682f9a86016839c0509c1ab2
      - type: ROLE
        id: 2c918087682f9a86016839c050a01ab3
