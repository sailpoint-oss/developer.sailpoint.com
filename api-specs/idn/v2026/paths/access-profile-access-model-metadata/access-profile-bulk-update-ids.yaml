post:
  operationId: updateAccessProfilesMetadataByIds
  summary: Bulk-update access-profile metadata by id
  description: >-
    This API initiates a bulk update of Access Model Metadata for one or more access profiles by a list of access profile IDs.

    A token with ORG_ADMIN, ROLE_ADMIN, ROLE_SUBADMIN, SOURCE_ADMIN or SOURCE_SUBADMIN authority is required to call this API.

    The update is processed asynchronously. The response returns the ID of the task performing the update.

    The maximum access profile count in a single update request is 3000.
    The maximum metadata value count for a single access profile is 25.
    Adding or replacing custom metadata requires a suite license.
  tags:
    - Access Profiles
  security:
    - userAuth: [ idn:access-profile:manage ]
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - ROLE_ADMIN
    - ROLE_SUBADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/access-profile-metadata/AccessProfileMetadataBulkUpdateByIdRequest.yaml"
        example:
          accessProfiles:
            - b1db89554cfa431cb8b9921ea38d9367
          operation: REPLACE
          replaceScope: ATTRIBUTE
          values:
            - attribute: iscFederalClassifications
              values:
                - topSecret
  responses:
    "202":
      description: Returned if the bulk update request was created.
      content:
        application/json:
          schema:
            $ref: "../../schemas/access-profile-metadata/AccessProfileMetadataBulkUpdateResponse.yaml"
          example:
            id: 2d82ac17-eb0d-4ba6-9918-dcad6ee0294d
            type: ACCESS_PROFILE
            status: CREATED
            created: '2024-09-16T18:59:06.871594Z'
    '400':
      $ref: '../../responses/400.yaml'
    '401':
      $ref: '../../responses/401.yaml'
    '403':
      $ref: '../../responses/403.yaml'
    '429':
      $ref: '../../responses/429.yaml'
    '500':
      $ref: '../../responses/500.yaml'
