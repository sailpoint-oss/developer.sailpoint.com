get:
  operationId: getAccessRequestConfig
  security:
    - userAuth:
        - 'idn:access-request-config:read'
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - USER
  summary: Get access request configuration
  tags:
    - Access Requests
  description: This endpoint returns the current access-request configuration.
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: Access Request Configuration Details.
      content:
        application/json:
          schema:
            $ref: '../schemas/AccessRequestConfig.yaml'
    '400':
      $ref: '../responses/400.yaml'
    '401':
      $ref: '../responses/401.yaml'
    '403':
      $ref: '../responses/403.yaml'
    '429':
      $ref: '../responses/429.yaml'
    '500':
      $ref: '../responses/500.yaml'
put:
  operationId: setAccessRequestConfig
  security:
    - userAuth:
        - 'idn:access-request-config:manage'
  x-sailpoint-userLevels:
    - ORG_ADMIN
  summary: Update access request configuration
  tags:
    - Access Requests
  description: This endpoint replaces the current access-request configuration.
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/AccessRequestConfig.yaml'
  responses:
    '200':
      description: Access Request Configuration Details.
      content:
        application/json:
          schema:
            $ref: '../schemas/AccessRequestConfig.yaml'
    '400':
      $ref: '../responses/400.yaml'
    '401':
      $ref: '../responses/401.yaml'
    '403':
      $ref: '../responses/403.yaml'
    '429':
      $ref: '../responses/429.yaml'
    '500':
      $ref: '../responses/500.yaml'