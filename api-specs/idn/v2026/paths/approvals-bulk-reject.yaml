post:
  x-sailpoint-lint-ignore:
    path-bulk-operations-must-return-207: >-
      sp-approvals bulkRejectApprovals writes 202 Accepted. The documented status must match the service (SailPoint Rule 152).
  security:
  - userAuth: [ sp:generic-approval-management:write ]
  x-sailpoint-userLevels:
  - ORG_ADMIN
  - API
  - idn:access-request-administrator
  operationId: rejectApprovalInBulk
  tags:
  - Approvals
  summary: Post Bulk Reject Approvals
  description: >-
    Bulk reject specified approval requests on behalf of the caller
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/BulkRejectRequestDTO.yaml'
  responses:
    '202':
      $ref: '../responses/202.yaml'
    '400':
      $ref: '../responses/400.yaml'
    '401':
      $ref: '../responses/401.yaml'
    '403':
      $ref: '../responses/403.yaml'
    '404':
      $ref: '../responses/404.yaml'
    '429':
      $ref: '../responses/429.yaml'
    '500':
      $ref: '../responses/500.yaml'
