post:
  security:
    - userAuth:
        - sp:generic-approval:reject
  x-sailpoint-userLevels:
    - Any
  operationId: rejectApproval
  tags:
    - Approvals
  summary: Post Approvals Reject
  description: |-
    Rejects a specified approval request on behalf of the caller. This endpoint does not support access request IDs.
    If called by an admin and the admin is not listed as an approver, the approval request will be reassigned either from overrideApproverID or from a random approver to the admin user and rejected.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      description: Approval ID that correlates to an existing approval request that a user wants to reject.
      example: 38453251-6be2-5f8f-df93-5ce19e295837
      x-sailpoint-resource-operation-id: getApprovals
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../schemas/ApprovalRejectRequest.yaml
  responses:
    '204':
      $ref: ../responses/204.yaml
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '404':
      $ref: ../responses/404.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
