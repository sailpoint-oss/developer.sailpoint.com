get:
  operationId: getMachineIdentity
  tags:
    - Machine Identities
  summary: Get machine identity details
  description: |-
    This API returns a single machine identity using the Machine Identity ID.

    When Business Applications is enabled for the tenant, the response includes enriched
    `businessApplicationRefs` and top-level `effectiveSanctionedStatus`. When Business Applications is not
    enabled, those fields are null.
  security:
    - userAuth:
        - idn:mis-identity:read
  x-sailpoint-userLevels:
    - ORG_ADMIN
    - SOURCE_ADMIN
    - SOURCE_SUBADMIN
    - HELPDESK
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      x-sailpoint-resource-operation-id: listMachineIdentities
      description: Machine Identity ID
      example: ef38f94347e94562b5bb8424a56397d8
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  responses:
    '200':
      description: A machine identity object
      content:
        application/json:
          schema:
            $ref: ../schemas/MachineIdentityResponse.yaml
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '404':
      $ref: ../responses/404.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
patch:
  operationId: updateMachineIdentity
  tags:
    - Machine Identities
  summary: Update machine identity details
  description: |
    Use this API to update machine identity details using a JSON Patch payload.

    When Business Applications is enabled for the tenant, `/businessApplicationRefs` may be replaced with
    at most one MANUAL Business Application reference, or cleared with an empty array.
    Patching `/businessApplicationRefs` when Business Applications is not enabled returns `400`. Existing
    `AUTOMATIC` correlations cannot be overridden (`400` / `ILLEGAL_UPDATE_ATTEMPT`). Unknown BA id returns
    `404`. `sanctionedStatus` and `effectiveSanctionedStatus` are read-only.
  security:
    - userAuth:
        - idn:mis-identity:manage
    - applicationAuth:
        - idn:mis-identity:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
  parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      x-sailpoint-resource-operation-id: listMachineIdentities
      description: Machine Identity ID.
      example: ef38f94347e94562b5bb8424a56397d8
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
  requestBody:
    required: true
    description: A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard.
    content:
      application/json-patch+json:
        schema:
          type: array
          items:
            type: object
        examples:
          Add machine identity attribute:
            value:
              - op: add
                path: /attributes/securityRisk
                value: medium
          Replace machine identity attribute:
            value:
              - op: replace
                path: /attributes/securityRisk
                value: medium
          Remove machine identity attribute:
            value:
              - op: remove
                path: /attributes/securityRisk
          Replace business application refs:
            value:
              - op: replace
                path: /businessApplicationRefs
                value:
                  - type: BUSINESS_APPLICATION
                    id: bff06019-d858-412e-a343-168849c64bb5
          Clear business application refs:
            value:
              - op: replace
                path: /businessApplicationRefs
                value: []
  responses:
    '200':
      description: Updated Machine Identity object.
      content:
        application/json:
          schema:
            $ref: ../schemas/MachineIdentityResponse.yaml
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '404':
      $ref: ../responses/404.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
delete:
  operationId: deleteMachineIdentity
  tags:
