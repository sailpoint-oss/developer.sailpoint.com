get:
  operationId: listNotificationPreferences
  tags:
  - Notifications
  summary: List notification preferences for tenant
  description: >-
    Returns a list of notification preferences for the current tenant, including preferred mediums
    and optional CC/BCC email recipients for each notification key.
  security:
  - userAuth:
    - idn:notification-preferences:read
  x-sailpoint-userLevels:
  - ORG_ADMIN
  parameters:
  - $ref: ../parameters/limit.yaml
  - $ref: ../parameters/offset.yaml
  - $ref: ../parameters/count.yaml
  - in: query
    name: filters
    required: false
    schema:
      type: string
    description: >-
      Filter results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **key**: *eq, in*
    example: key eq "approval_completed_notification"
  - in: query
    name: sorters
    required: false
    schema:
      type: string
      format: comma-separated
    description: >-
      Sort results using the standard syntax described in [V3 API Standard Collection
      Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


      Sorting is supported for the following fields: **key**
    example: key
  responses:
    '200':
      description: List of notification preferences for the tenant.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/PreferencesDto.yaml
      headers:
        X-Total-Count:
          description: The total result count (returned only if the *count* parameter is specified as *true*).
          schema:
            type: integer
          example: 25
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
