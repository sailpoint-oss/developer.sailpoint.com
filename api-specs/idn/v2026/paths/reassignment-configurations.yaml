get:
  operationId: listReassignmentConfigurations
  tags:
    - Work Reassignment
  summary: List reassignment configurations
  description: Gets a paginated list of Reassignment configurations for the current org.
  security:
    - userAuth:
        - idn:reassignment-configuration:read
        - idn:reassignment-configuration:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
  responses:
    '200':
      description: A list of Reassignment Configurations for an org
      headers:
        X-Total-Count:
          description: The total number of reassignment configurations for the tenant. Included only when `count=true`.
          schema:
            type: integer
          example: 3
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/work-reassignment/ConfigurationResponse.yaml
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '404':
      $ref: ../responses/404.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
  parameters:
    - in: query
      name: limit
      description: Max number of results to return.
      required: false
      example: 20
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 20
        default: 20
    - $ref: '../parameters/offset.yaml'
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
    - $ref: '../parameters/count.yaml'
post:
  operationId: createReassignmentConfiguration
  tags:
    - Work Reassignment
  summary: Create a reassignment configuration
  description: Creates a new Reassignment Configuration for the specified identity.
  security:
    - userAuth:
        - idn:reassignment-configuration:manage
  x-sailpoint-userLevels:
    - ORG_ADMIN
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/work-reassignment/ConfigurationItemRequest.yaml
  responses:
    '201':
      description: The newly created Reassignment Configuration object
      content:
        application/json:
          schema:
            $ref: ../schemas/work-reassignment/ConfigurationItemResponse.yaml
    '400':
      $ref: ../responses/400.yaml
    '401':
      $ref: ../responses/401.yaml
    '403':
      $ref: ../responses/403.yaml
    '429':
      $ref: ../responses/429.yaml
    '500':
      $ref: ../responses/500.yaml
  parameters:
    - name: X-SailPoint-Experimental
      in: header
      description: Use this header to enable this experimental API.
      example: true
      schema:
        type: string
        default: true
      required: true
