type: object
x-sailpoint-lint-ignore:
  schema-property-names-must-be-camel-case: >-
    Property "overrideApproverID" matches the sp-approvals wire JSON; do not rename in the spec (SailPoint Rule 118).
  schema-references-must-use-id-names: >-
    Property "overrideApproverID" matches the sp-approvals wire JSON; do not rename in the spec (SailPoint Rule 313).
properties:
  comment:
    type: string
    default: ""
    description: Comment associated with the reject request.
    example: "string"
  overrideApproverID:
    type: string
    default: ""
    description: Optional field for ServiceNow Administrators to specify which member of a governance group to override/reject on behalf of.
    example: "12345678901234567890123456789012"
description: >-
  Request body for rejecting an approval request.