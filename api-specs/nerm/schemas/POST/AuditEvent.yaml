type: object
properties:
  created_at:
    description: Search for record based on the created_at date
    type: object
    properties:
      gt:
        description: Greater Than - search for events with a date greater than the value
        type: string
        format: date
        example: 2024-10-18T16:41:23.232+00:00 | 10/18/2024
      lt:
        description: Less Than - search for events with a date less than the value
        type: string
        format: date
        example: 2024-10-18T16:41:23.232+00:00 | 10/18/2024
      eq:
        description: Equal - search for events with a date equal to the value
        type: string
        format: date
        example: 2024-10-18T16:41:23.232+00:00 | 10/18/2024
  subject_type:
    description: Categorization of audit event.
    type: string
    enum: [ApprovalAction, AutomatedUser, AutomatedWorkflow, BatchWorkflow, CreateWorkflow, DelegateUser, Delegation, Delete, Email, ExpirationWorkflow, Form, FormAttribute, FormAttributeForm, Get, IdentityProofingResult, IdproxyPermission, IdproxyRole, InvitationWorkflow, LoginWorkflow, NeaccessRole, NeaccessUser, NeAttribute, NeAttributeOption, NeprofileRole, NeprofileUser, Notification, Page, PasswordResetWorkflow, Patch, Permission, Portal, PortalRegistrationWorkflow, Post, Profile, ProfilePage, ProfileType, ProfileTypeRole, RegistrationWorkflow, Role, RoleProfile, SamlConfiguration, SchemaMapping, SchemaMappingField, SecurityQuestion, UpdateWorkflow, User, UserManager, UserProfile, UserRole, Validation, VerificationEmail, Workflow, WorkflowAction, WorkflowPage, WorkflowSession]
    example: Profile
  type:
    description: The type of audit event
    type: string
    enum: [AuditableProfileCreate, AuditableProfileUpdate, AuditableProfileDestroy, AuditableBulkProfileUpdate, AuditableProfileContributorAdd, AuditableProfileContributorRemove, AuditableProfileContributorRoleAdd, AuditableProfileContributorRoleRemove, AuditableProfileOwnerUpdate, AuditableProfileWorkflowEvent, AuditableWorkflowActionSkippedEvent, AuditableWorkflowApprovedEvent, AuditableWorkflowApprovedEvent, AuditableWorkflowAssignedEvent, AuditableWorkflowAutoAssignedEvent, AuditableWorkflowBatchCompleteEvent, AuditableWorkflowClosedEvent, AuditableWorkflowDuplicateCheckStartEvent, AuditableWorkflowDuplicateResolutionEvent, AuditableWorkflowFailedEvent, AuditableWorkflowIdentityProofedEvent, AuditableWorkflowInvitationSentEvent, AuditableWorkflowLdapProvidedEvent, AuditableWorkflowNotificationSentEvent, AuditableWorkflowPendingApprovalEvent, AuditableWorkflowPendingAssignmentEvent, AuditableWorkflowPendingFulfillmentEvent, AuditableWorkflowFulfilledEvent, AuditableWorkflowPendingIdentityProofEvent, AuditableWorkflowPendingLdapEvent, AuditableWorkflowPendingRequestEvent, AuditableWorkflowPendingReviewEvent, AuditableWorkflowProfileCreatedEvent, AuditableWorkflowProfileSelectEvent, AuditableWorkflowProfileUpdatedEvent, AuditableWorkflowRejectedEvent, AuditableWorkflowRequestMadeEvent, AuditableWorkflowRestApiEvent, AuditableWorkflowReviewedEvent, AuditableWorkflowRunningWorkflowEvent, AuditableWorkflowSoapApiEvent, AuditableWorkflowStatusChangedEvent, AuditableWorkflowStoredProcedureEvent, AuditableWorkflowUnassignEvent, AuditableWorkflowWaitingForWorkflowEvent, AuditableWorkflowWorkflowChangedEvent, AuditableWorkflowVersionCreatedEvent, AuditableWorkflowVersionForkedEvent, AuditableWorkflowVersionDeprecatedEvent, AuditableWorkflowVersionDeletedEvent, AuditableWorkflowStepCreatedEvent, AuditableWorkflowStepUpdatedEvent, ActiveRecordCreate, ActiveRecordUpdate, ActiveRecordDestroy, AuditableApiEvent]
    example: AuditableProfileCreate
  subject_id: 
    description: Identifier of the subject
    type: string
    format: uuid
    example: 7d8c53ca-e99d-485c-9524-ea3849e82c79
  data:
    type: object
    properties:
      profile_id:
        description: The profile id associated with the event
        type: string
        example: 7d8c53ca-e99d-485c-9524-ea3849e82c79
        format: uuid
      workflow_id:
        description: The workflow id associated with the event
        type: string
        example: 7d8c53ca-e99d-485c-9524-ea3849e82c79
        format: uuid
      workflow_name:
        description: The workflow name associated with the event
        type: string
        example: My Workflow
      workflow_uid:
        description: The workflow uid associated with the event
        type: string
        example: my_workflow
      profile_type_id:
        description: The profile type associated with the event
        type: string
        example: 7d8c53ca-e99d-485c-9524-ea3849e82c79
        format: uuid
      workflow_version_id:
        description: The workflow version a change belongs to. Can be used for both Workflow configurations and Workflow Session events. 
        type: string
        example: e309339f-551f-48ab-b4f6-58d93123911f
        format: uuid
      version:
        description: The workflow version SHA.
        type: string
        example: aadf95e45846365fa4b4c60f02c76ecffe718ee5
      step_id:
        description: The id of the workflow action or condition the step event refers to.
        type: string
        example: 2f4b24c6-d420-4eee-b860-5ad24c743185
        format: uuid
      step_label:
        description: The name associated to an action configuration.
        type: string
        example: RequestAction
      source:
        description: What triggered the versioning change.
        type: string
        enum: [ui, import, fork, cleanup_worker, delete_worker]
        example: ui
